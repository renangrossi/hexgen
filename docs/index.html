<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rolls whole Shadowdark or OSE hexcrawl regions in the browser: map, settlements, ports, ships, keyed hexes, dungeons, powers.">
<title>Hexcrawl Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Alegreya+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a surveyor's desk — control strip on top, the map plate, then the gazetteer in folding sections */
:root{
  --paper:#f2f3ee; --sheet:#fbfbf8; --ink:#1c2321; --muted:#5d6763; --rule:#cfd4cc;
  --accent:#1f5d58; --accent-ink:#ffffff; --danger:#8a2f2a; --chip:#e3e8e1;
  --sea:#86aac4; --lake:#a3c3d9; --grass:#cfd99c; --forest:#7fa86c; --jungle:#4e9459; --swamp:#8ea489;
  --hills:#c6b282; --mount:#988a79; --desert:#e8d6a0; --arctic:#eef1f3; --hexline:#56605c; --river:#2f6fa8; --road:#7a4a22;
  --display:'Alegreya SC',Georgia,serif; --body:'Alegreya',Georgia,'Times New Roman',serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151a19; --sheet:#1c2321; --ink:#e3e7e2; --muted:#9aa49f; --rule:#34403c; --accent:#6fb8b0; --accent-ink:#0f1514;
  --danger:#e08a80; --chip:#26302d; --hexline:#202826; --river:#5aa2e0; --road:#d49a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151a19; --sheet:#1c2321; --ink:#e3e7e2; --muted:#9aa49f; --rule:#34403c; --accent:#6fb8b0; --accent-ink:#0f1514;
  --danger:#e08a80; --chip:#26302d; --hexline:#202826; --river:#5aa2e0; --road:#d49a62; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1080px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding-block:20px 8px}
header.top h1{font:700 30px/1.1 var(--display);margin:0;letter-spacing:.02em;color:var(--accent)}
header.top p{margin:0;color:var(--muted);font-size:15px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:14px}
.tabs button{font:600 15px var(--body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=number]{font:15px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;min-width:0}
input[type=number]{width:5.2em}
.seas{display:flex;gap:8px;font-size:15px}
.seas label{text-transform:none;letter-spacing:0;font:15px var(--body);color:var(--ink);display:flex;gap:3px;align-items:center}
button.go{font:700 15px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:8px 16px;cursor:pointer}
button.ghost{font:600 14px var(--body);background:var(--chip);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:6px 10px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font:13px var(--mono);color:var(--muted);min-height:1.4em;margin:8px 0}
.mapplate{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px;margin:12px 0;overflow-x:auto}
svg.map{display:block;width:100%;height:auto;min-width:560px}
svg.map polygon{stroke:var(--hexline);stroke-width:.6}
svg.map a:hover polygon{stroke:var(--ink);stroke-width:1.6}
svg.map .hid{font:6px var(--mono);fill:#2a302e;text-anchor:middle;opacity:.65;pointer-events:none}
svg.map .town{font:15px sans-serif;text-anchor:middle;fill:#2b1a10;pointer-events:none}
svg.map .mark{font:12px sans-serif;text-anchor:middle;fill:#2b1a10;pointer-events:none}
svg.map .tname{font:700 7px var(--body);text-anchor:middle;fill:#121615;paint-order:stroke;stroke:#fbfbf8;stroke-width:1.8px;pointer-events:none}
svg.map .river{stroke:var(--river);stroke-width:2.3;stroke-linecap:round}
svg.map .road{stroke:var(--road);stroke-width:1.5;stroke-dasharray:3 2}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin:4px 2px}
.legend i{display:inline-block;width:11px;height:11px;border:1px solid var(--hexline);vertical-align:-1px;margin-right:4px}
h2{font:700 23px var(--display);letter-spacing:.02em;border-bottom:2px solid var(--accent);padding-bottom:2px;margin:1.6em 0 .5em;text-wrap:balance}
h3{font:700 19px var(--body);margin:1em 0 .3em;text-wrap:balance}
h4{font:600 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:1em 0 .2em}
h5{font:700 16px var(--body);margin:.5em 0 .1em}
small,.cite{color:var(--muted);font-weight:400}
.cite{font:12px var(--mono);margin-left:.4em;white-space:nowrap}
ul.lines{margin:.15em 0 .5em;padding-left:1.1em} ul.lines li{margin:.12em 0}
details.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;margin:8px 0;padding:0 14px}
details.entry>summary{cursor:pointer;padding:10px 0;font:700 18px var(--body);list-style-position:outside}
details.entry>summary small{font:14px var(--body);margin-left:.4em}
details.entry[open]{padding-bottom:10px}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle;margin-left:6px}
.chip{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;background:var(--chip);color:var(--muted);padding:1px 6px;border-radius:3px}
.chip.hot{color:var(--danger)}
.hexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.hexcard{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;min-width:0;scroll-margin-top:12px}
.hexcard:target,details.entry:target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hexcard h4{margin-top:.2em}
.sub{margin-left:.2em}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14px;margin:.3em 0 1em}
td,th{border-bottom:1px solid var(--rule);padding:3px 7px;text-align:left;vertical-align:top} th{background:var(--chip);font-weight:600}
td.n{font:12px var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.result{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;margin-top:12px}
.result .roll{font:500 13px var(--mono);color:var(--accent);margin-right:8px}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 24px}
.twocol>*{min-width:0}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){details.entry>summary{transition:color .15s} details.entry>summary:hover{color:var(--accent)}}
</style>
</head>
<body>

<div class="wrap">
<header class="top"><h1>Hexcrawl Forge</h1><p>Rolls a whole region from your table library: map, settlements, ports, ships, keyed hexes, powers. Every line cites its book.</p><p><a href="Hexcrawl-Forge-Guide.pdf">Guide (PDF)</a> · <a href="https://github.com/renangrossi/hexgen">Source on GitHub</a></p></header>

<nav class="tabs" role="tablist">
  <button role="tab" data-view="region" aria-selected="true">Region</button>
  <button role="tab" data-view="settlement" aria-selected="false">Settlement</button>
  <button role="tab" data-view="ship" aria-selected="false">Ships</button>
  <button role="tab" data-view="tables" aria-selected="false">Any table</button>
</nav>

<section id="v-region">
  <form class="panel" id="f-region">
    <div class="field"><label for="sys">System</label><select id="sys"><option value="sd">Shadowdark (Western Reaches)</option><option value="ose">Old-School Essentials</option></select></div>
    <div class="field"><label for="w">Width</label><input id="w" type="number" min="6" max="40" value="16"></div>
    <div class="field"><label for="h">Height</label><input id="h" type="number" min="6" max="30" value="12"></div>
    <div class="field"><label for="clim">Climate</label><select id="clim"><option>temperate</option><option>cold</option><option>hot</option><option>dry</option></select></div>
    <div class="field"><span class="lbl">Sea on</span><div class="seas">
      <label><input type="checkbox" id="sea-n">N</label><label><input type="checkbox" id="sea-e">E</label>
      <label><input type="checkbox" id="sea-s">S</label><label><input type="checkbox" id="sea-w" checked>W</label></div></div>
    <div class="field"><label for="seed">Seed</label><input id="seed" type="number" min="0" value="1"></div>
    <div class="field" style="flex:1 1 160px"><label for="rname">Name (optional)</label><input id="rname" type="text" placeholder="rolled if blank"></div>
    <button class="go" type="submit">Generate region</button>
    <button class="ghost" type="button" id="newseed">New seed</button>
  </form>
  <div class="status" id="status">Loading tables…</div>
  <div id="out"></div>
</section>

<section id="v-settlement" hidden>
  <form class="panel" id="f-set">
    <div class="field"><label for="skind">Kind</label><select id="skind"><option>trading post</option><option selected>village</option><option>town</option><option>city</option><option>capital</option><option>fortress</option></select></div>
    <div class="field"><label for="sterr">Terrain</label><select id="sterr"><option>grassland</option><option>forest</option><option>hills</option><option>swamp</option><option>jungle</option><option>desert</option><option>arctic</option></select></div>
    <div class="field"><label for="ssys">Street encounters</label><select id="ssys"><option value="sd">Shadowdark</option><option value="ose">OSE</option></select></div>
    <div class="field"><span class="lbl">Coast</span><div class="seas"><label><input type="checkbox" id="scoast">Has a port</label></div></div>
    <button class="go" type="submit">Roll settlement</button>
  </form>
  <div id="sout"></div>
</section>

<section id="v-ship" hidden>
  <form class="panel" id="f-ship">
    <div class="field"><label for="nships">How many</label><input id="nships" type="number" min="1" max="20" value="3"></div>
    <button class="go" type="submit">Roll ships</button>
  </form>
  <div id="shout"></div>
</section>

<section id="v-tables" hidden>
  <form class="panel" id="f-tab">
    <div class="field" style="flex:1 1 320px"><label for="tq">Table — type to search ids and titles</label><input id="tq" type="text" list="tlist" placeholder="pw.discovery, wwn.p183, sd.enc.forest…"></div>
    <div class="field"><label for="ttimes">Times</label><input id="ttimes" type="number" min="1" max="50" value="3"></div>
    <button class="go" type="submit">Roll</button>
    <button class="ghost" type="button" id="tshow">Show table</button>
    <datalist id="tlist"></datalist>
  </form>
  <div id="tout"></div>
</section>
</div>

<script>
'use strict';
/* ============================================================ dice */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DICE=/^\s*(\d*)d(\d+|00)\s*([+-]\s*\d+)?\s*$/i;
class Dice{
  constructor(seed){this.seed=seed;this.r=mulberry(seed*2654435761>>>0)}
  real(){return this.r()}
  between(lo,hi){return lo+Math.floor(this.r()*(hi-lo+1))}
  roll(e){if(typeof e==='number')return e;const m=DICE.exec(String(e));if(!m)return parseInt(e,10)||0;
    const n=+(m[1]||1),s=m[2]==='00'?100:+m[2],mod=m[3]?+m[3].replace(/\s/g,''):0;let t=0;for(let i=0;i<n;i++)t+=this.between(1,s);return t+mod}
  chance(n,d){return this.between(1,d)<=n}
  pick(a){return a[Math.floor(this.r()*a.length)]}
  shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(this.r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
}
function dieRange(e){const m=DICE.exec(String(e));const n=+(m[1]||1),s=m[2]==='00'?100:+m[2],mod=m[3]?+m[3].replace(/\s/g,''):0;return[n+mod,n*s+mod]}
const LABEL=/^\s*(\d{1,3})(?:\s*[–—-]\s*(\d{1,3}))?\+?\s*$/;
function parseLabel(l,size){const m=LABEL.exec(String(l));if(!m)return null;let lo=+m[1],hi=m[2]!==undefined?+m[2]:lo;
  if((m[1]==='0'||m[1]==='00')&&(size===10||size===100))lo=size;
  if(m[2]!==undefined&&(m[2]==='0'||m[2]==='00')&&(size===10||size===100))hi=size;
  if(hi===0)hi=size;if(hi<lo)hi=lo;return[lo,hi]}

/* ============================================================ registry */
class Registry{
  constructor(data,dice){this.dice=dice;this.T=data.tables;this.extras=data.extras;this.sources=data.sources}
  has(id){return id in this.T}
  get(id){const t=this.T[id];if(!t)throw new Error('no table '+id);
    if(t.d&&!t._rg){const hi=dieRange(t.d)[1];t._rg=t.r.map(r=>parseLabel(r[0],hi))}return t}
  title(id){return this.T[id].t||id}
  cite(id){const t=this.T[id];return t.p?`${t.s} p.${t.p}`:t.s}
  find(p){return Object.keys(this.T).filter(k=>k.startsWith(p)).sort()}
  roll(id,col=null,mod=0,depth=0){
    const t=this.get(id);let n=null,row;
    if(t.d){n=this.dice.roll(t.d)+mod;row=null;
      for(let i=0;i<t.r.length;i++){const g=t._rg[i];if(g&&g[0]<=n&&n<=g[1]){row=t.r[i];break}}
      if(!row)row=n<(t._rg[0]||[1])[0]?t.r[0]:t.r[t.r.length-1];
    }else row=this.dice.pick(t.r);
    const cells=row.slice(1).map(c=>typeof c==='string'?this.expand(c,depth+1):c);
    const names=(t.c||cells.map(()=>null)).slice();
    if(t.c)names.forEach((nm,i)=>{if(nm){const c=t.c.slice(0,i).filter(x=>x===nm).length;if(c)names[i]=nm+' '+(c+1)}});
    const values={};cells.forEach((v,i)=>{values[(names[i])||('c'+i)]=v});
    let text;
    if(col!==null&&col!==undefined){
      if(col in values)text=values[col];else if(/^\d+$/.test(String(col)))text=Object.values(values)[+col];else text='';
    }else text=cells.filter(c=>c!==''&&c!==null).join(' — ');
    return{text:String(text??''),roll:n,table:id,cite:this.cite(id),values};
  }
  text(id,col=null,mod=0){return this.roll(id,col,mod).text}
  expand(s,depth=0){if(depth>8||s.indexOf('{')<0)return s;
    return s.replace(/\{([^{}]+)\}/g,(m,inner)=>{inner=inner.trim();
      if(inner.includes('|'))return this.dice.pick(inner.split('|'));
      if(/^\d*d(\d+|00)([+-]\d+)?$/.test(inner))return String(this.dice.roll(inner));
      const [tid,col]=inner.split('#');if(this.has(tid))return this.roll(tid,col||null,0,depth).text;return m})}
}

/* ============================================================ hex map */
const MOVE={grassland:1,forest:2,jungle:2,swamp:2,hills:2,mountains:3,desert:2,arctic:2,sea:99,lake:99};
const hid=(c,r)=>String(c+1).padStart(2,'0')+String(r+1).padStart(2,'0');
function* neighbors(c,r,w,h){const odd=c&1;for(const[dc,dr]of[[0,-1],[0,1],[-1,-1+odd],[-1,odd],[1,-1+odd],[1,odd]]){const cc=c+dc,rr=r+dr;if(cc>=0&&cc<w&&rr>=0&&rr<h)yield[cc,rr]}}
function cube(c,r){const x=c,z=r-(c-(c&1))/2;return[x,-x-z,z]}
function dist(a,b){const A=cube(...a),B=cube(...b);return Math.max(Math.abs(A[0]-B[0]),Math.abs(A[1]-B[1]),Math.abs(A[2]-B[2]))}
class HexMap{
  constructor(w,h,dice,climate,sea){this.w=w;this.h=h;this.dice=dice;this.climate=climate;this.sea=sea||'';
    this.H=new Map();for(let c=0;c<w;c++)for(let r=0;r<h;r++)this.H.set(c+','+r,{c,r,id:hid(c,r),terrain:null,height:0,wet:0,river:false,river_to:null,road:false,coast:false,settlement:null,contents:[]});
    this.terrain();this.rivers()}
  all(){return[...this.H.values()]}
  at(c,r){return this.H.get(c+','+r)}
  nbrs(x){return[...neighbors(x.c,x.r,this.w,this.h)].map(([c,r])=>this.at(c,r))}
  water(x){return x.terrain==='sea'||x.terrain==='lake'}
  field(scale,oct=3){const tot=new Map();for(const k of this.H.keys())tot.set(k,0);let amp=1;
    for(let o=0;o<oct;o++){const step=Math.max(1.5,scale/2**o),gw=Math.floor(this.w/step)+3,gh=Math.floor(this.h/step)+3;
      const g=[];for(let i=0;i<gw;i++){g.push([]);for(let j=0;j<gh;j++)g[i].push(this.dice.real())}
      for(const x of this.H.values()){const X=x.c/step,Y=(x.r+.5*(x.c&1))/step,i=Math.floor(X),j=Math.floor(Y);let fx=X-i,fy=Y-j;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
        const a=g[i][j]*(1-fx)+g[i+1][j]*fx,b=g[i][j+1]*(1-fx)+g[i+1][j+1]*fx;tot.set(x.c+','+x.r,tot.get(x.c+','+x.r)+amp*(a*(1-fy)+b*fy))}amp*=.5}
    const v=[...tot.values()],lo=Math.min(...v),hi=Math.max(...v);for(const[k,x]of tot)tot.set(k,(x-lo)/(hi-lo||1));return tot}
  terrain(){const S=Math.max(this.w,this.h),Hf=this.field(S/2.5),Wf=this.field(S/3);
    for(const x of this.H.values()){const k=x.c+','+x.r;let edge=1;
      for(const e of this.sea){const d={w:x.c,e:this.w-1-x.c,n:x.r,s:this.h-1-x.r}[e],span=(e==='w'||e==='e')?this.w:this.h;if(d===undefined)continue;edge=Math.min(edge,Math.min(1,d/Math.max(2,span*.22)))}
      x.height=Hf.get(k)*(.35+.65*edge);x.wet=Wf.get(k)}
    const cl=this.climate;
    for(const x of this.H.values()){const h=x.height,wet=x.wet;let t;
      if(h<.22&&this.sea)t='sea';else if(h>.84)t='mountains';else if(h>.68)t='hills';else if(wet>.78&&h<.40)t='swamp';
      else if(wet>.52)t=cl==='hot'?'jungle':'forest';else if(wet<.18)t=(cl==='hot'||cl==='dry')?'desert':'grassland';else t='grassland';
      if(cl==='cold'&&(t==='grassland'||t==='swamp')&&h>.45)t='arctic';if(cl==='dry'&&t==='grassland'&&wet<.35)t='desert';x.terrain=t}
    const edgeHex=x=>(this.sea.includes('w')&&x.c===0)||(this.sea.includes('e')&&x.c===this.w-1)||(this.sea.includes('n')&&x.r===0)||(this.sea.includes('s')&&x.r===this.h-1);
    const seen=new Set(),st=this.all().filter(x=>x.terrain==='sea'&&edgeHex(x));
    while(st.length){const x=st.pop();if(seen.has(x.id))continue;seen.add(x.id);for(const n of this.nbrs(x))if(n.terrain==='sea'&&!seen.has(n.id))st.push(n)}
    for(const x of this.H.values())if(x.terrain==='sea'&&!seen.has(x.id))x.terrain=x.wet>.45?'lake':(x.wet>.3?'swamp':'grassland');
    const basins=this.all().filter(x=>['grassland','forest','swamp','jungle'].includes(x.terrain)&&this.nbrs(x).every(n=>n.height>=x.height)).sort((a,b)=>b.wet-a.wet);
    for(const x of basins.slice(0,Math.max(1,Math.floor(this.w*this.h/160))))x.terrain='lake';
    for(const x of this.H.values())x.coast=!this.water(x)&&this.nbrs(x).some(n=>n.terrain==='sea')}
  rivers(){const springs=this.dice.shuffle(this.all().filter(x=>(x.terrain==='mountains'||x.terrain==='hills')&&x.wet>.35));
    const n=Math.max(1,Math.floor(this.w*this.h/90));let made=0;
    for(const s of springs){if(made>=n)break;let path=[s],cur=s;const seen=new Set([s.id]);
      while(true){const cand=this.nbrs(cur).filter(x=>!seen.has(x.id));if(!cand.length){path=[];break}
        const nx=cand.reduce((a,b)=>b.height<a.height?b:a);path.push(nx);seen.add(nx.id);if(this.water(nx)||nx.river)break;cur=nx;if(path.length>this.w+this.h){path=[];break}}
      if(path.length>=4){for(let i=0;i<path.length-1;i++){const a=path[i];if(!this.water(a)){a.river=true;a.river_to=[path[i+1].c,path[i+1].r]}}made++}}}
  road(a,b){const cost=x=>x.road?1:MOVE[x.terrain]+(x.river?1:0);const key=x=>x.c+','+x.r;
    const g=new Map([[key(a),0]]),came=new Map([[key(a),null]]);let open=[[0,a]];
    while(open.length){open.sort((p,q)=>p[0]-q[0]);const[,cur]=open.shift();if(cur===b)break;
      for(const nb of this.nbrs(cur)){if(this.water(nb)&&nb!==b)continue;const ng=g.get(key(cur))+cost(nb);
        if(!g.has(key(nb))||ng<g.get(key(nb))){g.set(key(nb),ng);came.set(key(nb),cur);open.push([ng+dist([nb.c,nb.r],[b.c,b.r]),nb])}}}
    if(!came.has(key(b)))return[];let cur=b;while(cur){if(!this.water(cur))cur.road=true;cur=came.get(key(cur))}}
}

  sites.forEach((x,i)=>{const size=sizes[i]||'village';const coastal=x.coast||(['town','city','capital'].includes(size)&&M.nbrs(x).some(nb=>nb.terrain==='lake'));x.settlement=settlement(R,sys,size,coastal,x.terrain)});
  const rk=x=>{const i=SIZES.indexOf(x.settlement.size);return i<0?99:i};const ranked=sites.slice().sort((a,b)=>rk(a)-rk(b));
  ranked.forEach((a,i)=>{if(!i)return;const b=ranked.slice(0,i).reduce((p,q)=>dist([a.c,a.r],[q.c,q.r])<dist([a.c,a.r],[p.c,p.r])?q:p);if(a.settlement.size!=='trading post'||R.dice.chance(1,2))M.road(a,b)});
  const land=M.all().filter(x=>!M.water(x)&&!x.settlement);
  for(const x of M.all()){if(x.settlement)continue;x.contents=x.terrain==='sea'?seaHex(R,sys,x,M.nbrs(x).some(n=>!M.water(n))):stock(R,sys,x)}

  for(const x of R.dice.shuffle(land).slice(0,Math.max(2,Math.floor(land.length/14)))){const t=wildTag(R);if(t)x.contents.push(t)}

function settlementBody(s){const o=[];

function settlementH(x){const s=x.settlement;return`<details class="entry" id="hex-${x.id}"><summary>${E(s.name)} <small>${E(s.size)} · hex ${x.id} · ${E(s.terrain)}${s.port?' · port':''}</small></summary>${settlementBody(s)}</details>`}

function svgMap(reg,s=26){const M=reg.M,k=Math.sqrt(3);const cx=c=>1.5*s*c+s+4,cy=(c,r)=>k*s*(r+.5*(c&1))+k*s/2+4;

  for(const x of M.all()){const X=cx(x.c),Y=cy(x.c,x.r);const pts=[0,1,2,3,4,5].map(i=>`${(X+s*Math.cos(Math.PI/3*i)).toFixed(1)},${(Y+s*Math.sin(Math.PI/3*i)).toFixed(1)}`).join(' ');
    const poly=`<polygon points="${pts}" fill="${COLOR[x.terrain]}"><title>${x.id} ${x.terrain}${x.settlement?' — '+E(x.settlement.name):''}</title></polygon>`;
    o.push((x.contents.length||x.settlement)?`<a href="#hex-${x.id}" data-hex="${x.id}">${poly}</a>`:poly);o.push(`<text x="${X.toFixed(1)}" y="${(Y-s*.55).toFixed(1)}" class="hid">${x.id}</text>`)}

  for(const x of M.all())if(x.road)for(const n of M.nbrs(x))if((n.road||n.settlement)&&(n.c>x.c||(n.c===x.c&&n.r>x.r)))o.push(`<line x1="${cx(x.c)}" y1="${cy(x.c,x.r)}" x2="${cx(n.c)}" y2="${cy(n.c,n.r)}" class="road"/>`);
  for(const x of M.all()){const X=cx(x.c),Y=cy(x.c,x.r);
    if(x.settlement){o.push(`<text x="${X}" y="${Y+5}" class="town">${GLYPH[x.settlement.size]||'•'}</text><text x="${X}" y="${(Y+s*.78).toFixed(1)}" class="tname">${E(x.settlement.name)}</text>`)}
    else if(x.contents.some(c=>c.kind==='ruin'))o.push(`<text x="${X}" y="${Y+5}" class="mark">⌂</text>`);else if(x.contents.some(c=>c.kind==='lair'))o.push(`<text x="${X}" y="${Y+5}" class="mark">☠</text>`)}
  return o.join('')+'</svg>'}
function playTables(R,reg){const M=reg.M,sys=reg.sys;const ters=[...new Set(M.all().map(x=>x.terrain))].sort();

  ex.push(full('uvg.p177.general-travel-misfortune-and-misery-a-c','Travel misfortune'),full('oh.quest-archetypes','Quest archetypes'),full('oh.patron','Patron'),full('oh.reward','Reward'),full('oh.acts-of-devotion-the-outcome','Downtime: devotion'),full('oh.combat-training-the-outcome','Downtime: training'),full('oh.magical-study-the-outcome','Downtime: study'));

  const R=new Registry(DATA,new Dice(Math.floor(Math.random()*1e9)));const n=Math.max(1,Math.min(50,+$('ttimes').value||1));
  $('tout').innerHTML=`<div class="result"><h3>${E(R.title(id))} <small>${E(id)} · ${E(R.T[id].d||'pick one')} ${cite(R.cite(id))}</small></h3><ul class="lines">`+Array.from({length:n},()=>{const r=R.roll(id);return`<li><span class="roll">${r.roll??'—'}</span>${E(r.text)}</li>`}).join('')+'</ul></div>'});
$('tshow').addEventListener('click',()=>{if(!DATA)return;const id=findTable($('tq').value);if(!id)return;const R=new Registry(DATA,new Dice(1));const t=R.get(id);
  $('tout').innerHTML=`<div class="result"><h3>${E(R.title(id))} <small>${E(id)} · ${E(t.d||'pick one')} ${cite(R.cite(id))}</small></h3><div class="tw"><table>${t.c?`<tr><th></th>${t.c.map(c=>`<th>${E(c)}</th>`).join('')}</tr>`:''}${t.r.map(r=>`<tr>${r.map((v,i)=>`<td${i?'':' class="n"'}>${E(v??'')}</td>`).join('')}</tr>`).join('')}</table></div></div>`});

(function restore(){const o=store.get('region');if(o){$('sys').value=o.system;$('w').value=o.w;$('h').value=o.h;$('clim').value=o.climate;for(const k of'nesw')$('sea-'+k).checked=o.sea.includes(k);$('seed').value=o.seed;$('rname').value=o.name||''}
  const v=store.get('view');if(v&&$('v-'+v))views(v)})();
fetch('data.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;
  $('tlist').innerHTML=Object.keys(d.tables).sort().map(k=>`<option value="${E(k)}">${E(d.tables[k].t||'')}</option>`).join('');
  $('status').textContent=`${Object.keys(d.tables).length} tables loaded.`;genRegion()})
  .catch(e=>{$('status').textContent='Could not load the table library (data.json): '+e.message+'. Reload the page.'});
</script>
