    rows:
    - - null
      - Excellent °
      - Roll the next weather with advantage.
    - - null
      - Fair
      - No effect.
    - - null
      - Stormy †
      - 'Normal terrain is difficult today: every hex costs 2 MC, roads included. No outdoor rest.'
    - - null
      - Severe ‡
      - Stormy in a harsh climate, right. Terrain is impassable today. Weather event — §9.1.
