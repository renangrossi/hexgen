      - Gain 5 XP and an ally among the nobility
    - - '12'
      - Your prowess attracts a beautiful/handsome suitor that finds your combat skills incredibly alluring. You can enter into marriage, if desired.
      - Gain 5 XP and a marriage partner
    - - '13'
      - You are by far the greatest tournament participant by points. You are awarded incredible prizes for your victory and your reputation greatly increases.
      - Gain 6 XP and 2x rolls on Treasure 4-6
    - - 14+
      - You are challenged to a duel to the death by a randomly created character of your class and level. They place a magnificent prize in escrow with their second, which you can claim if you survive.
      - Gain 6 XP and a 90-100 item from your treasure table
