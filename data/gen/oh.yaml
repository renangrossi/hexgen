      - '3'
      - ''
    - - null
      - Several weeks
      - 3 a week
      - ''
    - - null
      - Short of rations
      - —
      - 'Arrive drained: lose CON equal to half current CON, rounded down, and disadvantage on checks and attacks until a successful rest.'
    - - null
      - Scavenge
      - INT
      - One character checks for the group. On a success nobody arrives drained.
    note: 'source: WRG:45|SR:14'
  oh.hot:
    title: Hot
    page: null
    cols:
    - Event
    - What it does
    - Spread
    rows:
    - - '2'
      - Wildfire
      - 'CON in a burning hex or 1d4. Spread grows by 1 each day. Burnt ground after: no forage. *Swamp:* peat fire, the ground gives way, DEX or fall. *Sea:* lightning fire aboard.'
      - '1'
    - - '3'
      - Lightning storm
      - 'DEX or 1d6, disadvantage in metal armour. Mounts bolt on a failed WIS. Dry ground may catch: Wildfire on a 1-in-6.'
      - '1'
    - - '4'
      - Heat wave
      - 'CON or 1 damage and −1 to checks. Heavy armour: disadvantage. Forage DC +3. *Sea:* becalmed, no sailing.'
      - '2'
    - - '5'
      - Flash flood
      - Rivers impassable, fords gone. +1 MC. 1d4 rations spoil. *Desert:* the wadis run.
      - '2'
    - - '6'
      - Windstorm
      - Dust storm, gale or blowdown. No ranged attacks. +1 MC. Navigation DC +3. No fire, tents lost.
      - '2'
    - - '7'
      - Thunderstorm
      - Downpour. Navigation DC +3. No fire or outdoor rest without shelter. *Sea:* squalls, +1 MC.
      - '2'
    - - '8'
      - Hailstorm
      - DEX or 1 damage. Glass and flasks may break. Shelter prevents it. No hunting.
      - '1'
    - - '9'
      - Ground gives way
      - Mudslide, washout, bog collapse or dune slip. Road gone, +1 MC. DEX or lose a piece of gear. *Sea:* cliff fall, shore path gone.
      - '1'
    - - '10'
      - Swarm
      - 'Midges, locusts or jellyfish at sea. Disadvantage on every check. No rest. Locusts: no forage, 1d4 rations eaten.'
      - '1'
    - - '11'
      - Collapse
      - Treefall, sinkhole, rockfall or sand slide. DEX or 1d6. The track is blocked. *Sea:* rogue wave, DEX or overboard.
      - '1'
    - - '12'
      - Twister
      - DEX or 2d6. Mounts and 1d4 rations lost. *Sea:* waterspout, the vessel takes damage.
      - '1'
    die: 2d6
    note: 'source: TT:20|NEW'
  oh.cold:
    title: Cold
    page: null
    cols:
    - Event
    - What it does
    - Spread
    rows:
    - - '2'
      - Avalanche
      - DEX or 2d6 and buried; STR to dig out, 1 damage a round. Pass shut. *Glacier:* serac collapse. *Lowland:* drifts bury the road. *Sea:* the vessel founders under ice.
      - '1'
    - - '3'
      - Thundersnow
      - DEX or 1d6. Navigation DC +3.
      - '1'
    - - '4'
      - Cold snap
      - CON or 1 damage. No outdoor rest without a fire. Rivers freeze hard enough to walk.
      - '2'
    - - '5'
      - Freezing rain
      - Ice on everything. +1 MC. DEX each hex or fall for 1d4. *Swamp:* chill rain, no fire can be lit.
      - '2'
    - - '6'
      - Ice gale
      - No ranged attacks. +1 MC. Navigation DC +3. No fire, tents lost.
      - '2'
    - - '7'
      - Blizzard
      - Navigation DC +3. +1 MC. CON or 1 damage at night without a fire. *Sea:* snow squalls, +1 MC.
      - '2'
    - - '8'
      - Rime squall
      - 'DEX or 1 damage. Gear ices over: −1 to checks until thawed at a fire.'
      - '1'
    - - '9'
      - Freezing fog
      - No ranged attacks. Navigation DC +3. Either side may be surprised. +1-in-6 on the night’s encounter checks.
      - '2'
    - - '10'
      - Thin ice
      - 'A frozen river or lake that will not hold. DEX or fall in: CON or 1d6. *Glacier:* a snow bridge over a crevasse. *Sea:* pack ice closes, no sailing.'
      - '1'
    - - '11'
      - Ice jam
      - A river backs up and bursts. As Flash flood, Hot 5.
      - '1'
    - - '12'
      - Killing cold
      - CON or 1d6 each night without a fire. Water and rations freeze. No forage.
      - '2'
    die: 2d6
    note: 'source: TT:20|NEW'
  oh.fair-weather-events:
    title: Fair-weather events
    page: null
    cols:
    - Event
    - What it does
    - Spread
    rows:
    - - 2–3
      - Thaw
      - Rivers swollen, fords gone. +1 MC at crossings.
      - '2'
    - - 4–5
      - Haze
      - Heat haze, mirage or sea haze. Navigation DC +3.
      - '2'
    - - 6–8
      - Fog bank
      - No ranged attacks. Either side may be surprised. Escape is easier.
      - '2'
    - - 9–10
      - Still air
      - 'Sound carries: neither side can be surprised. *Sea:* becalmed, no sailing.'
      - '2'
    - - 11–12
      - Bloom
      - Rain in the night. Forage DC −3, the game returns.
      - '2'
    die: 2d6
    note: 'source: TT:20|NEW'
  oh.troubles:
    title: Troubles
    page: null
    cols:
    - Trouble
    - Effect
    rows:
    - - '1'
      - Smoke and fire
      - '1d6: on 1–3 the crossing costs +1 MC; on 4–6 side edges are impassable until the next long rest.'
    - - '2'
      - Bad weather
      - '1d6: 1–2 must camp; 3–4 wind scatters one exposed mundane item; 5–6 fog adds +1 MC and a 50% chance of becoming lost.'
    - - '3'
      - Spoiled food
      - Half the rations are lost, rounded up.
    - - '4'
      - Lost
      - '+1 MC delay. 1d6: on 1–2 return to the previous hex; on 3–6 enter a random adjacent hex.'
    - - '5'
      - Camp disease
      - 'Two random characters: CON DC 12. Failure causes −1 to checks until treated or after 3 days of rest.'
    - - '6'
      - Mosquito swarm
      - 'Everyone: CON DC 12. Failure causes −1 to checks while in Forest, Jungle or Swamp.'
    - - '7'
      - Terrain injury
      - A random character takes 1d4 damage and loses 1 MC/day until treated or after 3 days of rest.
    - - '8'
      - Unholy site
      - WIS DC 12. Failure causes −1 to attacks until blessed or treated.
    - - '9'
      - Magic drain
      - 'Each spellcaster: CON DC 12. Failure loses one lowest-tier spell slot until a safe rest.'
    - - '10'
      - Dead end
      - The route is blocked. Backtracking costs the previous hex's MC and needs a new route.
    die: d10
    note: 'source: TT:18'
  oh.wilderness:
    title: Wilderness
    page: null
    cols:
    - Hazard
    - Effect
    rows:
    - - '2'
      - Cursed ritual site
      - Perception or Arcana to notice. If not avoided, a Weird monster with a thematic resistance appears. If defeated, treasure plus an extra discovery.
    - - '3'
      - Trouble
      - → §10.1
    - - '4'
      - Hard to navigate
      - Terrain counts as difficult. Roll another event; not this one or Shortcut.
    - - '5'
      - Mosquito swarm
      - −1 to checks in Forest, Jungle or Swamp. Ignore if rain or cold makes it implausible.
    - - '6'
      - Landslide
      - Route blocked. Detour, +1 MC, then roll another event.
    - - '7'
      - Muddy terrain
      - Terrain counts as difficult. Foraging costs double — 8.2.
    - - '8'
      - Hunter's trap
      - DEX check or take damage and be held until freed.
    - - '9'
      - Quicksand
      - STR or DEX to escape. Carried load may be lost.
    - - '10'
      - Shortcut
      - Terrain counts as normal. Roll another event; not this one or Hard to Navigate.
    - - '11'
      - Flood
      - The crossing is impassable or dangerous. Wait, detour, or make a STR check to cross.
    - - '12'
      - Toll taker
      - Someone claims the right of passage. Pay, negotiate, evade or fight.
    die: 2d6
    note: 'source: TT:21'
  oh.the-three-columns:
    title: The three columns
    page: null
    cols:
    - Column
    - Effect
    rows:
    - - null
      - Movement
      - Restricts or prevents movement. Costs time and torches. May trap the party.
    - - null
      - Damage
      - Deals damage once or every round. At 0 HP roll a death timer.
    - - null
      - Weaken
      - Weakens, confuses or impairs. Often limits the senses.
    - - null
      - Doubles
      - Combine all three hazards on that row into one.
    note: 'source: GC:17'
