  oh.quest-source:
    title: Quest source
    page: null
    cols:
    - It arrives as
    - What to do
    rows:
    - - '1'
      - A settlement offers it
      - Someone in 15.1 has a problem. Roll the patron in 19.3.
    - - '2'
      - A rumour
      - Roll one in §20 — 20.1 or 20.2. The rumour names the place; 19.3 says what is in it.
    - - '3'
      - Trouble is stirring
      - → 19.2. The trouble is the objective, and its urgency is the deadline.
    - - '4'
      - A clue inside treasure
      - 'A map, a ledger, a name — §22.1. The site is already placed: use that hex.'
    - - '5'
      - Family lore
      - The personal table in 19.3. Nobody pays for this one.
    - - '6'
      - An obligation
      - Carousing or downtime — §17 — left a debt, an oath or an enemy. Roll 1–5 again for the shape it takes.
    die: 1d6
    note: 'source: SD:124|SD:96|WRG:50'
  oh.type-of-trouble:
    title: Type of trouble
    page: null
    cols:
    - It is a…
    - Roll again inside it
    rows:
    - - '1'
      - Cult
      - '1d6: 1 worship of a harmful being · 2 sacrifices of life or valuables · 3 puritan and dogmatic · 4 aberrant and warped · 5 tyrannical and violent · 6 detached from reality'
    - - '2'
      - Monster
      - '1d6: 1 hag coven of three · 2 purple worm · 3 vampire · 4 aboleth · 5 doppelganger · 6 dragon'
    - - '3'
      - Monster horde
      - '1d6: 1 orcs · 2 undead · 3 bandits · 4 demons · 5 natural creatures · 6 aberrant things'
    - - '4'
      - Disaster
      - '1d6: 1 earthquake · 2 flood · 3 fire or volcano · 4 wind · 5 supernatural · 6 manufactured'
    - - '5'
      - Disease
      - '1d6: 1 rat plague · 2 crops destroyed · 3 livestock dead · 4 undead contagion · 5 spores · 6 magical radiation'
    - - '6'
      - External faction
      - '1d4: 1 attacked by rivals · 2 trade embargo · 3 besieged by enemies · 4 outside spies fomenting unrest'
    - - '7'
      - Internal faction
      - '1d6: 1 criminals · 2 a serial killer · 3 a religious leader · 4 mob rebellion · 5 a corrupt official · 6 military coup'
    - - '8'
      - Supernatural threat
      - '1d6: 1 undead haunting · 2 an unhinged wizard · 3 a dimensional rift · 4 an eldritch being or patron rising · 5 a demon or devil · 6 an angered god'
    - - '9'
      - Military threat
      - '1d6: 1 skirmish · 2 siege · 3 razings · 4 a warlord raising an army · 5 mercenary threat · 6 war'
    - - '10'
      - Power change
      - '1d4: 1 a good leader falls · 2 a bad leader rises · 3 heirs vie for power · 4 a leadership vacuum'
    die: 1d10
    note: 'source: WRG:49'
  oh.location:
    title: Location
    page: null
    cols:
    - Settlement
    - Band — 15.1
    rows:
    - - '1'
      - A village
      - Village
    - - '2'
      - A town
      - Town. Reroll if there is none.
    - - '3'
      - A city
      - City. Reroll if there is none.
    - - '4'
      - A city-state
      - The largest city you have. Reroll if there is none.
    die: 1d4
    note: 'source: WRG:48'
  oh.urgency:
    title: Urgency
    page: null
    cols:
    - It is…
    - Symptoms
    rows:
    - - 2–6
      - 1d4 weeks away
      - Discomfort, portents, denial.
    - - 7–9
      - 1d8 days away
      - Arguments, speculation, preparations.
    - - 10–11
      - 1d12 hours away
      - Mass hysteria, overt danger, chaos.
    - - '12'
      - Already happened
      - Devastation, mourning, change.
    die: 2d6
    note: 'source: WRG:49'
  oh.quest-archetypes:
    title: Quest archetypes
    page: null
    cols:
    - Quest
    - Objective
    rows:
    - - '1'
      - Cleanse an infested dungeon
      - Kill a set number of lesser and greater creatures. Track proof.
    - - '2'
      - Monster lair
      - A dungeon of 1d6+8 areas. Defeat a creature named before departure.
    - - '3'
      - Purify a temple
      - Destroy 1d4+1 idols. Each empty room raises the chance of finding the next.
    - - '4'
      - Rescue a prisoner
      - Find the prisoner, defeat the guard, make a release check.
    - - '5'
      - Recover a stolen item
      - Capture enemies alive for information. Follow clues to a secret room.
    - - '6'
      - Undead dungeon of riches
      - An extra undead encounter in every area. Boss at the end.
    - - '7'
      - Recover the map
      - Get 2 clues, locate the hex, dig with the right tool.
    - - '8'
      - Wizard's tower
      - 2–4 floors. Recover a magic item or defeat the threat.
    - - '9'
      - Ritual site
      - Interrupt the ritual, defeat the cult leader, rescue survivors.
    - - '10'
      - Dragon egg hunt
      - Catacombs. Find 1d3+1 eggs. Face the dragons guarding them.
    - - '11'
      - Race for the lost relic
      - 'Three linked sites: a map or key, a clue, a final creature lair.'
    - - '12'
      - Stomp of elemental evil
      - 10+1d10 areas. Elemental boss in the final area.
    - - '13'
      - Kobold slave masters
      - A large dungeon. Free the captives, defeat the leader.
    - - '14'
      - Dark waters
      - A flooded ruin or open dungeon. Defeat the final threat.
    - - '15'
      - Two-level catacombs
      - A boss with dark abilities. Reward includes scrolls.
    - - '16'
      - Three-level catacombs
      - 3 clues on level two, the boss on level three.
    - - '17'
      - Test of traps
      - Beat the traps, recover a relic. The boss guards the vault.
    - - '18'
      - The cure
      - Two ingredients in separate places. Deadline, and a return to the patron.
    - - '19'
      - Crypts of Damnation
      - A very large Ancient Crypt. → §22
    - - '20'
      - Hunt the fugitive wizard
      - Keep, Town or City only. Three-level catacomb; the wizard is lowest.
