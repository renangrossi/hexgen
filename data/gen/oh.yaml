  oh.magical-study-the-outcome:
    title: Magical study · the outcome
    page: null
    cols:
    - What happened
    - Benefit
    rows:
    - - '1'
      - A miscast spell hurts innocent people, and you are arrested. Your allies must pay 10 gp to release you.
      - Gain 2 XP
    - - '2'
      - You trap yourself in a pocket dimension for 1d4+1 days. You break a bargain with an imp to escape.
      - Gain 2 XP and an imp rival
    - - '3'
      - You purchase a bag of pipe weed that was just oregano. Lose 20% of your remaining gold pieces.
      - Gain 3 XP
    - - '4'
      - Your magical talents attract a like-minded soul that wishes to learn how to cast spells like you do.
      - Gain 3 XP and an apprentice
    - - '5'
      - You break a magical portal that was best left sealed. A horde of tiny demons is released, and they raze a few buildings. Authorities banish you and you can never show your face here again.
      - Gain 3 XP, banished, the local area is damaged
    - - '6'
      - You borrow some study materials from a local mage guild and then accidentally destroy them with your experiments. They insist that you repay them for the full cost of what you borrowed.
      - Gain 4 XP and a debt equal to half of your remaining gp
