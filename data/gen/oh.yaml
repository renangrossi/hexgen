  oh.riding:
    title: Riding
    page: null
    cols:
    - Rule
    - Detail
    rows:
    - - null
      - Mounted
      - 6 MC a day. Everyone needs a mount.
    - - null
      - Wagon
      - One per mount, 120 gp. 4 MC a day. That mount carries no rider; the wagon adds +15 gear slots.
    - - null
      - Flying
      - Difficult and impassable hexes cost 1. Cannot end the day in impassable terrain or on water. One rider.
    - - null
      - Load
      - The rider and what they carry fill 10 of the mount’s slots.
    - - null
      - Training
      - 'Any rarity but common needs it to ride. Legendary: caught wild, trained from youth.'
    - - null
      - Feeding
      - Grazes free in terrain it knows (a camel in the desert). Elsewhere 1 ration a day — 8.1.
    - - null
      - Morale
      - 'Under duress or startled: morale check on the rider’s CHA. Personality, below.'
    - - null
      - In a fight
      - 'Acts on the rider’s turn: rider or mount takes the action. Mounting or dismounting uses all movement. Saddle: ADV to stay on.'
    note: 'source: WR:114|WR:109'
