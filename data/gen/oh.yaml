  oh.patron:
    title: Patron
    page: null
    cols:
    - Who
    - Reward
    rows:
    - - '1'
      - Farmer
      - Lower pay. Provisions before departure.
    - - '2'
      - Merchant
      - May add a gem or jewellery.
    - - '3'
      - Necromancer
      - May offer rare jewellery. Reputational risk.
    - - '4'
      - Local service
      - '1d6: 1–2 tavern keeper; 3–4 arcane shop; 5–6 alchemist. Reroll if absent.'
    - - '5'
      - Noble
      - Town or City. Larger reward, social access.
    - - '6'
      - Ruler
      - Town or City. High reward, political fallout if failed.
    die: 1d6
    note: 'source: TT:55'
  oh.family-lore:
    title: Family lore
    page: null
    cols:
    - Personal side quest
    rows:
    - - '1'
