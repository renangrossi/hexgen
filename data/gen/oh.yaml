  oh.personality:
    title: Personality
    page: null
    cols:
    - Demeanor
    - Behaviour
    rows:
    - - 0–4
      - Horrid
      - DISADV on morale. Stubborn, mean.
    - - 5–7
      - Ornery
      - Tolerates a familiar rider. Sassy, rude.
    - - 8–9
      - Reliable
      - ADV on morale. Protective, patient.
    - - 10+
      - Lovely
      - Immune to morale. Loyal, intelligent.
    die: 2d6
    note: 'source: WR:115'
    review: 2 results uncovered
  oh.hot:
    title: Hot
    page: null
    cols:
    - Event
    - What it does
    - Spread
    rows:
    - - '2'
      - Wildfire
      - 'CON in a burning hex or 1d4. Spread grows by 1 each day. Burnt ground after: no forage. *Swamp:* peat fire, the ground gives way, DEX or fall. *Sea:* lightning fire aboard.'
      - '1'
    - - '3'
      - Lightning storm
      - 'DEX or 1d6, disadvantage in metal armour. Mounts bolt on a failed WIS. Dry ground may catch: Wildfire on a 1-in-6.'
      - '1'
    - - '4'
      - Heat wave
      - 'CON or 1 damage and −1 to checks. Heavy armour: disadvantage. Forage DC +3. *Sea:* becalmed — Calm, 23.8.'
      - '2'
    - - '5'
      - Flash flood
      - Rivers impassable, fords gone. +1 MC. 1d4 rations spoil. *Desert:* the wadis run.
      - '2'
    - - '6'
      - Windstorm
      - Dust storm, gale or blowdown. No ranged attacks. +1 MC. Navigation DC +3. No fire, tents lost. *Sea:* a Gale — 23.8.
      - '2'
    - - '7'
      - Thunderstorm
      - Downpour. Navigation DC +3. No fire or outdoor rest without shelter. *Sea:* squalls, +1 MC.
      - '2'
    - - '8'
      - Hailstorm
      - DEX or 1 damage. Glass and flasks may break. Shelter prevents it. No hunting.
      - '1'
    - - '9'
      - Ground gives way
      - Mudslide, washout, bog collapse or dune slip. Road gone, +1 MC. DEX or lose a piece of gear. *Sea:* cliff fall, shore path gone.
      - '1'
    - - '10'
      - Swarm
      - 'Midges, locusts or jellyfish at sea. Disadvantage on every check. No rest. Locusts: no forage, 1d4 rations eaten.'
      - '1'
    - - '11'
      - Collapse
      - Treefall, sinkhole, rockfall or sand slide. DEX or 1d6. The track is blocked. *Sea:* rogue wave, DEX or overboard.
      - '1'
    - - '12'
      - Twister
      - DEX or 2d6. Mounts and 1d4 rations lost. *Sea:* waterspout, the vessel takes damage.
      - '1'
    die: 2d6
    note: 'source: TT:20|NEW'
  oh.cold:
    title: Cold
    page: null
    cols:
    - Event
    - What it does
    - Spread
    rows:
    - - '2'
      - Avalanche
      - DEX or 2d6 and buried; STR to dig out, 1 damage a round. Pass shut. *Glacier:* serac collapse. *Lowland:* drifts bury the road. *Sea:* the vessel founders under ice.
      - '1'
    - - '3'
      - Thundersnow
      - DEX or 1d6. Navigation DC +3.
      - '1'
    - - '4'
      - Cold snap
      - CON or 1 damage. No outdoor rest without a fire. Rivers freeze hard enough to walk.
      - '2'
    - - '5'
      - Freezing rain
      - Ice on everything. +1 MC. DEX each hex or fall for 1d4. *Swamp:* chill rain, no fire can be lit.
      - '2'
    - - '6'
      - Ice gale
      - No ranged attacks. +1 MC. Navigation DC +3. No fire, tents lost. *Sea:* a Gale — 23.8.
      - '2'
    - - '7'
      - Blizzard
      - Navigation DC +3. +1 MC. CON or 1 damage at night without a fire. *Sea:* snow squalls, +1 MC.
      - '2'
    - - '8'
      - Rime squall
      - 'DEX or 1 damage. Gear ices over: −1 to checks until thawed at a fire.'
      - '1'
    - - '9'
      - Freezing fog
      - No ranged attacks. Navigation DC +3. Either side may be surprised. +1-in-6 on the night’s encounter checks.
      - '2'
    - - '10'
      - Thin ice
      - 'A frozen river or lake that will not hold. DEX or fall in: CON or 1d6. *Glacier:* a snow bridge over a crevasse. *Sea:* pack ice closes, no sailing.'
      - '1'
    - - '11'
      - Ice jam
      - A river backs up and bursts. As Flash flood, Hot 5.
      - '1'
    - - '12'
      - Killing cold
      - CON or 1d6 each night without a fire. Water and rations freeze. No forage.
      - '2'
    die: 2d6
    note: 'source: TT:20|NEW'
  oh.fair-weather-events:
    title: Fair-weather events
    page: null
    cols:
    - Event
    - What it does
    - Spread
    rows:
    - - 2–3
      - Thaw
      - Rivers swollen, fords gone. +1 MC at crossings.
      - '2'
    - - 4–5
      - Haze
      - Heat haze, mirage or sea haze. Navigation DC +3.
      - '2'
    - - 6–8
      - Fog bank
      - No ranged attacks. Either side may be surprised. Escape is easier.
      - '2'
    - - 9–10
      - Still air
      - 'Sound carries: neither side can be surprised. *Sea:* Calm — 23.8.'
      - '2'
    - - 11–12
      - Bloom
      - Rain in the night. Forage DC −3, the game returns.
      - '2'
    die: 2d6
    note: 'source: TT:20|NEW'
  oh.strange-skies:
    title: Strange skies
    page: null
    cols:
    - Event
    - What it does
    - Spread
    rows:
    - - '1'
      - The weather turns
      - 'The region’s pattern shifts. d6: 1–3 wetter, Stormy on 2–5; 4–6 drier, Stormy only on 2–3. Lasts d6: 1–2 a week, 3 a month, 4 a year, 5 a decade, 6 for good.'
      - All
    - - '2'
      - Strange rain
      - 'From a clear sky. d12: 1 frogs, 2 snakes, 3 locusts (no forage), 4 blood, 5 fish (a ration each), 6 flowers, 7 crops double this year, 8 crops fail, 9 slime for 1d4 hours, 10 it vanishes as it
        lands, 11 weak holy (1–3) or unholy water, 12 rust: metal armour −1 AC, metal weapons −1 damage until mended.'
      - '2'
    - - '3'
      - A wind from nowhere
      - '1d24 hours. It carries d8: 1 spice, 2 the sea, 3 a slaughterhouse, 4 fine ash, 5 whispers in no known tongue, 6–8 nothing.'
      - '3'
    - - '4'
      - Comet
      - '1d6 days, by night (1–4) or day and night. d6: 1 just a comet, 2 an old house will end, 3 a birth foretold, 4 an ancient evil wakes in a site within 1d6 hexes — §21, 5 all damage +1 (1–4) or −1
        while it shows, 6 reactions −1 while it shows.'
      - All
    - - '5'
      - A star goes out or is born
      - '1–3 out, 4–6 born; 1d6 weeks. d6: 1 a power of Law or Chaos dies or rises, 2 a god dies or is born, 3 out: an outsider joins the encounters; born: summoning fails 1-in-6, 4 Turn Undead −1 (out)
        or +1, 5 one kind of monster fades or swarms, 6 nothing.'
      - All
    - - '6'
      - Meteors
      - '1d4 nights. d6: 1 the year’s dead rise as zombies, 2 a sickness from the stars spreads, 3 fire falls: 3d6 in the strike hex, Wildfire on 1–4 in 6, 4 a stone cocoon cracks — something from beyond,
        peaceful 1–2 in 6, 5–6 starmetal falls within 1d6 hexes: 1d4 × 100 gp a half-pound.'
      - All
    - - '7'
      - The sky changes colour
      - '1d12 hours. d6: 1–2 ill omen, a natural 20 counts as a 1; 3–4 the beasts panic, Hunt with advantage; 5–6 babies born now bear the colour.'
      - All
    - - '8'
      - The sun goes dark
      - '1d20 minutes. d6: 1 mundane fires go out, relight 1–3 in 6; 2 1d10−1 outsiders cross into the world; 3 bound undead walk free until it ends; 4 spellcasting checks +1 (1–3) or −1; 5 priest spells
        of tier 4+ fail; 6 just an eclipse.'
      - All
    - - '9'
      - Blood moon
      - 'Tonight. d6: 1 wounds taken tonight heal only by magic, 2 a werebeast hunts: it is tonight’s encounter, 3 the spirits answer: one more question to any divination, 4–6 just an eclipse.'
      - All
    - - '10'
      - Earthquake
      - 'd12: 1–6 a tremor, 7–8 things fall, 9–10 DEX DC 12 or prone, 11 DEX DC 15, roofs fall, fires, 12 DEX DC 18, a river moves a hex. Then d6: 1–2 nothing, 3 something imprisoned walks free, 4 a lost
        tomb opens — §21, 5 a gate to the Plane of Earth, 6 a rich vein of ore.'
      - 1d6
    - - '11'
      - Twisters
      - '1d12 funnels, 4d20 minutes. d6: 1–3 as Twister, Hot 12; 4 air elementals, hostile; 5 a gate to the Plane of Air, anyone caught is taken; 6 they drain the colour from the land, 1d12 hours (1-in-6
        for good).'
      - '1'
    - - '12'
      - Shapes in the clouds
      - 'd6: 1 a person or creature, 2 a scene from history, 3 a scene still to come, 4 words in a known tongue, 5 runes in an unknown one, 6 the party.'
      - '2'
    - - '13'
      - City in the clouds
      - 'd6: 1–2 inhabited — cloud giants, bird-folk or a people sworn never to touch ground; 3–4 abandoned, but something lairs there; 5–6 an illusion. 1-in-6 it is gone in 1d6 days.'
      - '3'
    - - '14'
      - Unnatural days
      - '1d6 days. One (1–3), two (4–5) or three (6) of these, d10: 1 birds fly backwards, 2 prey hunts predator, 3 rain falls up, 4 coloured rain, 5 water will not boil, 6 fire gives no heat, 7 beasts
        speak, 8 the entrails read wrong, 9 livestock born monstrous, 10 peasants debate philosophy.'
      - 1d6
    - - '15'
      - Rainbow without rain
      - '1d20 minutes. d6: 1–3 just a rainbow; 4 a fey offers the way to its gold, for a bargain; 5 a bridge to another world, guarded 1–2 in 6; 6 a sign from the gods, toward something sought (1–3) or
        not yet known.'
      - '1'
    - - '16'
      - Aurora
      - 'By night, 3d20 minutes. d6: 1 it is alive, an elemental; 2 faint music; 3 a gate for anyone who can fly into it; 4 spells cast under it roll maximum on every die; 5–6 just lights.'
      - All
    - - '17'
      - Corpse-lights
      - 'Cold fire on masts, spires and spear-points, 1d20 hours. d6: 1–4 harmless; 5 a being, talking in flickers; 6 the dead stir: undead join the encounters while it lasts.'
      - '2'
    - - '18'
      - Fog from elsewhere
      - '1d20 hours. Navigation DC +3, no ranged attacks. d6: 1 just fog; 2 creatures from another terrain’s table; 3 thick as wool, every hex costs double; 4 it drains life, mist things hunt in it; 5 a
        road to another world, 1-in-6 an hour for the lost; 6 the dead in it rise unless burned within the hour.'
      - '2'
    - - '19'
      - Ball lightning
      - '1d10 globes drift near. A touch is 2d6, DEX DC 12 to dodge. Drawn to d6: 1 metal, 2 tall things, 3 magic, 4 chaotic creatures, 5 lawful ones, 6 anything.'
      - '1'
    - - '20'
      - Magic ebbs or floods
      - '1d24 hours. d8 whose: 1–3 wizards, 4–6 priests, 7–8 both. d6: 1–3 ebb, spellcasting checks at disadvantage; 4–6 flood, at advantage.'
      - All
    die: d20
    note: 'source: ITW:157-165'
  oh.cause:
    title: Cause
    page: null
    cols:
    - Why the sky is strange
    rows:
    - - 1–4
      - No reason. It happens.
    - - 5–6
      - It comes back. 1–3 in 6 a sage can say when.
    - - '7'
      - The wall to an elemental plane has thinned.
    - - 8–9
