  oh.combat-training-the-outcome:
    title: Combat training · the outcome
    page: null
    cols:
    - What happened
    - Benefit
    rows:
    - - '1'
      - You are charged with disturbing the peace and arrested. Your allies must pay 10 gp to release you.
      - Gain 2 XP
    - - '2'
      - You are terrified by a vicious opponent and need 1d4+1 days to recover your will to adventure.
      - Gain 2 XP
