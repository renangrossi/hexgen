      - You channel magic in a new and exciting way that opens your mind to a new way of altering reality. You record your experiments in your spellbook.
      - Gain 4 XP and a new 1st level spell
    - - '8'
      - You channel magical energy in an impressive way that mystifies your colleagues and awes laymen.
      - Gain 4 XP and a luck token
    - - '9'
      - You find two magical scrolls hidden within an otherwise mundane account of an ancient feud between two wizards. You are able to copy both of them into your spellbook before anyone notices.
      - Gain 5 XP and two new 1st level spells
    - - '10'
      - You tap into another plane of existence and commune with an immortal elemental entity.
      - Gain 5 XP and a luck token
    - - '11'
      - Your talent for magical research attracts the attention of a local wizard of some repute. He offers you a safe place to rest and study in town.
      - Gain 5 XP and a mage ally
    - - '12'
      - Your talent awes a beautiful/handsome librarian. They are drawn to your magical power. You can enter into marriage, if desired.
      - Gain 5 XP and a marriage partner
    - - '13'
      - Your studies open up your eyes to new ways of bending reality and place you on the cutting edge. You record your experiments in your spellbook.
      - Gain 6 XP and a new spell (best level)
    - - 14+
      - Your magical experiments push the boundaries of the known canon and lead you into innovative new techniques. Create a new spell and work with the GM to determine its level and exact function.
      - Gain 6 XP and create your own unique spell
    die: 1d8
    note: 'source: GC:37'
