  oh.navigation:
    title: Navigation
    page: null
    cols:
    - DC
    - When
    - What a failure costs
    rows:
    - - null
      - ('—', 'dw')
      - A road, river or coast runs the whole way.
      - —
    - - null
      - '9'
      - Open country, unknown hex. The default.
      - Roll 1d6 for the edge. They enter that hex instead and pay its MC. Generate it if unknown.
    - - null
      - '12'
      - Open sea, no land in sight — Sight, §2.
      - Drift instead of the edge — 23.8.
    - - null
      - '+3'
      - Travelling in darkness.
      - As open country.
    - - null
      - '+3'
      - Stormy weather — §1.
      - The drift costs the whole day. Make camp on arrival — §8.
    - - null
      - '+3'
      - Hard to navigate terrain — modifiers, above.
      - They drift twice. Roll 1d6 for the hex they enter, then 1d6 again from that hex for the one after it. If the second roll gives water or impassable terrain they stop in the first.
    - - null
      - '+3'
      - A hazard has taken the landmarks — §10.3.
      - As open country.
    note: 'source: SD:94|NEW'
