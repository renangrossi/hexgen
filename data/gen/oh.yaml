      - At the start of the day. It cannot be taken back.
    - - null
      - Budget
      - '×1.5: 6 MC on foot or by wagon, 9 mounted, 1.5 × the boat’s Speed, rounded down.'
    - - null
      - Encounters
      - +1-in-6 on today’s checks — §6.
    - - null
      - Food
      - No foraging or hunting today — 8.2, 8.3.
