    page: null
    cols:
    - Event
    - What happens
    rows:
    - - '3'
      - Signs of land
      - Buoys, drifting coconuts, floating logs, birds, a scent on the air. The nearest land is a day’s sail off.
    - - '4'
      - Trouble aboard — the boat
      - A broken part, fire, a leak, no powder left, rats, shipworms, a torn sail. Roll the boat column in 23.6. Repair as 23.3.
    - - '5'
      - Trouble aboard — the crew
      - Famine, madness, mutiny, sabotage, scurvy, a drunk or a dead crewman, someone overboard. Roll the crew column in 23.6. A C boat — 23.2 — that drops below four crew cannot move.
    - - '6'
      - Benign shallow water
      - Basking shark, eels, jellyfish, manatee, porpoises, sea birds, seals, a shoal of fish, a turtle. No threat, and a free Fish check — §8.2.
    - - '7'
      - Vessel sighted
      - Corsairs, fishers, haulers, merchants, navy, pirates, slavers, smugglers, whalers — or a ghost ship. Build it in 23.7, then roll reaction — 6.1.
    - - '8'
      - Natural hazard
      - A freak wave, gas, reefs, a rock, a sand bar, a strong current, a submarine volcano, a whirlpool, a wreck. Roll it in 23.6; the boat is attacked at its AC for 2d6.
    - - '9'
      - Clear sailing
      - Nothing. Make the distance.
    - - '10'
      - Island
      - Optional landing. Roll its terrain in §3 (reroll 01–09), then its feature in §4 and a point of interest in §13.3.
    - - '11'
      - Benign deep water
      - Albatross, dolphins, flying fish, manta ray, orca, sail fish, a turtle, a shark, a whale. Taking one is a Fish check — §8.2.
    - - '12'
      - Weather turns
      - 'Roll a weather event — 9.1: Hot in summer, Cold otherwise. A U boat — 23.2 — now checks its 1-in-6.'
    - - '13'
      - Sea folk
      - Mermaids, tritons, sahuagin, octomen, sea-elves, sea-goblins, sea-tortles, shark men. Roll the Sea folk column in 23.6, then reaction — 6.1. They know this water better than you do.
    - - 14–15
      - Weak winds
      - The crossing costs one extra day. A boat of Speed 8 or more is unaffected.
    - - '16'
      - Pirates
      - They give chase. Beat their boat’s Speed with yours, or fight — 23.3.
    - - 17–18
      - Dangerous creature
      - A dragon or a dragon turtle, a hydra, a kraken, a megashark, a sea serpent, a giant whale, spider crabs. Roll it in 23.6, and stat it from Sea & Deep Water — §12. On a lake or a river roll that
        water’s own d100 instead — below. The boat is in it too — 23.3.
    die: 3d6
    note: 'source: SEA:51|TT:32|WR:118|SD:172'
