      - A giant catfish† threatens to overturn boats from below
    - - 04-05
      - Two warring giant octopi threaten all creatures nearby
    - - 06-07
      - A merfolk archmage is furious at the annoying intrusion
    - - 08-09
      - A plesiosaurus tries to drag a PC into the depths
    - - 10-11
      - A giant crab flails its claws into nearby boats and creatures
    - - 12-13
      - A drifting mass of water weeds entraps all it touches
    - - 14-15
      - A canoe with 10 wild-eyed cultists speeds toward the PCs
    - - 16-17
      - 2d8 waterlogged zombies bob to the water’s surface
    - - 18-19
      - A sudden waterspout plows through all in its path
    - - 20-21
      - 1d4 hippogriffs swoop in from above in to carry off a victim
    - - 22-23
      - A clot of 2d4 lampreys (giant leeches) writhes in the water
    - - 24-25
      - Two peasant divers compete to reach a sunken treasure
    - - 26-27
      - 2d4 dire condors† swoop in to steal valuable gear and flee
    - - 28-29
      - 2d6 sirens draw a hapless boat of fishermen toward them
    - - 30-31
      - A wraith hovers over a small, rocky island it can’t leave
    - - 32-33
      - A freshwater shark circles the PCs, looking for an opening
    - - 34-35
      - A roper on an underwater ridge grabs at passing creatures
    - - 36-37
      - The ribcage of a dead sea dragon drifts on a colliding path
    - - 38-39
      - 2d4 blue-clad elves shoot bows from an agile rowboat
    - - 40-41
      - A battered canoe with 2d4 shadows chases down the PCs
    - - 42-43
      - A giant frog swims up behind a spear-fishing kobold
    - - 44-45
      - Underwater nets with barbs entangle PCs or their vessel
    - - 46-47
      - An aquatic giant anaconda slithers through the water
    - - 48-49
      - An ogre floats by clinging to the broken mast of a ship
    - - 50-53
      - A shell-clad knight on a hippopotamus fights 2d4 merfolk
    - - 54-55
      - A cloud of magical, sleep-inducing fog rolls on the water
    - - 56-57
      - 1d4 piranha swarms chew at passing boats like termites
    - - 58-59
      - A hippopotamus appears with gold rings on its tusks
    - - 60-61
      - A patrolling longboat of 2d12 nords† cruises by to observe
    - - 62-63
      - A lone, whistling fisherman paddles his boat into view
    - - 64-65
      - 2d6 sahuagin trail PCs cautiously, deciding if to attack
    - - 66-67
      - Large, soapy bubbles drift up from beneath the water
    - - 68-69
      - A bobbing urn pops open, disgorging a scarab swarm
    - - 70-71
      - 1d6 rusty animated armors try to clamber out of the water
    - - 72-73
      - A boat race has turned into a pileup of brawling peasants
    - - 74-75
      - The Silver Strings, a vain group of bards†, sails by smugly
    - - 76-77
      - A brass gong hangs over the water on a telescoping pole
    - - 78-79
      - A singular, jet-black crocodile named Inktooth swims by
    - - 80-81
      - A passing albatross drops an ochre jelly onto the PCs
    - - 82-83
      - A chatty, floating skeleton of a pirate has no idea it’s dead
    - - 84-85
      - A sea hag disguised as a drowning woman calls for help
    - - 86-87
      - A regal kobold sorcerer riding a giant frog approaches
    - - 88-89
      - 2d6 vultures dive bomb a spinning, waterlogged treant
    - - 90-91
      - A family of halflings† aboard a small sloop wave cheerfully
    - - 92-93
      - A surge of iridescent water heals boats and PCs 3d8 HP
    - - 94-95
      - The Seaweed Devil (vrock) drifts on a weed-covered raft
    - - 96-97
      - The Wandering Merchant swims by in a lazy backstroke
    - - 98-99
      - Roll two encounters and combine the results (reroll 98-99)
    - - '00'
      - A fiery meteorite hits the water; it’s a LV 10+ treasure roll
    die: d100
