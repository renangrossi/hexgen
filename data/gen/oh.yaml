  oh.acts-of-devotion-the-outcome:
    title: Acts of devotion · the outcome
    page: null
    cols:
    - What happened
    - Benefit
    rows:
    - - '1'
      - You violate local laws in an act of piety and are arrested. Your allies must pay 10 gp to release you.
      - Gain 2 XP
    - - '2'
      - You follow a vision quest for 1d4+1 days. You return with reinforced faith and a very empty stomach.
      - Gain 2 XP
    - - '3'
      - You were tricked by a charlatan preying upon the faithful. Lose 15% of your remaining gold pieces.
      - Gain 3 XP
    - - '4'
      - You meet a passionate, but misguided soul. They convert to your faith with vigor and excitement. You worry their fanaticism will get them in trouble.
      - Gain 3 XP and an erratic, fanatical ally
    - - '5'
      - The spiritual force of the celebration grows out of control. Laws are broken and property is damaged. The local authorities fine you 10% of your wealth.
      - Gain 3 XP, the local area is damaged
    - - '6'
      - You get carried away and make lavish promises to please the celebrants. You have second thoughts when the furor dies down and escape from the crowd, but they remember what you promised.
      - Gain 4 XP and a debt equal to half of your remaining gp
    - - '7'
      - You fill a crowd of commoners with great religious vigor. They find their daily existence unsatisfactory and decide to pursue spiritual aims instead. Their lord is not pleased with this change.
      - Gain 4 XP, 2d8 peasant allies, and a noble enemy
    - - '8'
      - You channel the power of your deity and perform dazzling acts of faith in front of the crowd.
      - Gain 4 XP and a luck token
    - - '9'
      - You convince several agents of a powerful villain to abandon their former master and choose a new path forward in their life. Of course, the villain is very upset when they learn of these defections.
      - Gain 5 XP and a villain becomes your rival
    - - '10'
      - You are struck by a wild prophetic vision from your deity. This greatly deepens your personal faith.
      - Gain 5 XP and a luck token
    - - '11'
      - Your devotion aligns with that of a local noble. They invite you to join them for a day of hunting. Out in the wilds, you form a close personal bond.
      - Gain 5 XP and an ally among the nobility
    - - '12'
      - Your faith attracts a beautiful/handsome congregant that finds your devotion intoxicating. You can enter into marriage, if desired.
      - Gain 5 XP and a marriage partner
    - - '13'
      - Your celebration is attended by devotees from far away temples. They become convinced that you are the next great religious leader of your sect.
      - Gain 6 XP and 4d8 devoted acolytes
    - - 14+
      - Your celebration attracts the attention of a wealthy priest. They offer gifts to aid you in the completion of your spiritual mission.
      - Gain 6 XP and 2x rolls on Treasure 4-6
