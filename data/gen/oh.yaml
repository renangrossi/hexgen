  oh.modifiers:
    title: Modifiers
    page: null
    cols:
    - Condition
    - MC
    - Detail
    rows:
    - - null
      - Road on the edge used
      - '1'
      - Replaces the terrain cost.
    - - null
      - River crossing, no bridge
      - '2'
      - 'Replaces the terrain cost: difficult. 1 with a boat. In flood, roll 1d6. On 1–2: STR or DEX DC 12, failure sweeps that character and one item to the next hex.'
    - - null
      - Muddy terrain
      - '2'
      - Counts as difficult. Foraging costs double — 8.2.
    - - null
      - Shortcut
      - '1'
      - Counts as normal.
    - - null
      - Hard to navigate
      - '2'
      - Counts as difficult.
    - - null
      - Deep Chasm
      - blocked
      - Blocks the two edges it touches. Go around or find a bridge.
