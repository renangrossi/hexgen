    - - '22'
      - Lesser Ant Lions
      - M
      - 1d3
      - '3'
      - '14'
      - '15'
      - 1 bite +3 (1d8 + drag)
      - Always fights. It cannot leave the pit.
    - - '23'
      - Lionesses
      - M
      - 1d4+1
      - '4'
      - '13'
      - '20'
      - 2 claw +3 (1d6)
      - 1–2 they let the party pass · 3–4 they follow at a hundred paces for a day · 5–6 they hunt.
