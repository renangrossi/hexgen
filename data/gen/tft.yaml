    - Foe
    - Type
    - No.
    - LV
    - AC
    - HP
    - Attack
    - Reactions
    rows:
    - - '4'
      - Steppe Lion
      - M
      - '1'
      - '6'
      - '13'
      - '30'
      - 2 claw +5 (1d10)
      - 1–2 it watches from the grass and lets the party pass · 3–4 it follows for a day · 5–6 it hunts.
    - - '5'
      - Cheetahs
      - M
      - 1d3
      - '3'
      - '13'
      - '14'
      - 1 rend +3 (1d8)
