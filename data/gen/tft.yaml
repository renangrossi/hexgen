    - - '13'
      - Prairie Rats
      - V
      - 2d6
      - '0'
      - '11'
      - '1'
      - 1 bite +1 (1)
      - 1–4 they vanish down the holes · 5–6 they swarm what is already on the ground.
    - - '14'
      - Grass Adders
      - V
      - 2d6
      - '1'
      - '12'
      - '5'
      - 1 bite +1 (1d4 + venom)
      - 1–3 it is gone before anyone draws · 4–5 it holds its ground and strikes only if stepped over · 6 it strikes.
    - - '15'
      - Steppe Hares
      - V
      - 2d6
      - '0'
      - '12'
      - '1'
      - 1 kick +1 (1)
      - 1–6 they flee. The question is only what you catch.
    - - '16'
      - Carrion Vultures
      - V
      - 1d6+2
      - '1'
      - '12'
      - '5'
      - 1 beak +1 (1d4)
      - 1–4 they circle and wait, following the party for a day and staying with it · 5–6 they come down and settle within near, attacking the moment any character is wounded.
    - - '17'
      - Steppe Ponies
      - V
      - 1d6
      - '1'
      - '11'
      - '6'
      - 1 hoof +1 (1d4)
      - 1–5 the band scatters · 6 the lead mare stands over a foal and kicks.
    - - '18'
      - Jackals
      - M
      - 1d6+2
      - '2'
      - '12'
      - '10'
      - 1 bite +2 (1d6)
