  ss.p57.disposition:
    title: Disposition
    die: d20
    page: 57
    rows:
    - - 1–2
      - Hostile. Locals seem very unfriendly toward visitors, and would likely make out-of-towners feel unwelcome. This could manifest as coldness, passive-aggressiveness, or even violence.
    - - 3–6
      - Unfriendly. Locals don’t care much for visitors, looking upon them with contempt, fear, or suspicion.
    - - 7–14
      - Neutral. Locals are standoffish, or perhaps hard on the outside, but can be friendly if you get to know them.
    - - 15–18
      - Friendly. Locals are generally friendly, welcoming, and slow to take offense.
    - - 19–20
      - Open. The locals actively enjoy visitors, and their culture incorporates this. Just about anyone is welcome.
  ss.p57.law-enforcement:
    title: Law Enforcement
    die: d20
    page: 57
    rows:
    - - 15–18
      - Sheriff. A single, officially sanctioned sheriff looks to maintaining order within the village. If they require additional help, they request it from the villagers, who may assist in a temporary
        capacity. (+1 to crime roll)
    - - 19–20
      - Sheriff and Deputies. A sheriff and a handful of deputies, who are officially sanctioned authorities, maintain a firm hold on the village. They maintain civility in an official capacity. (+2 to
        crime roll)
    review: 14 results uncovered
  ss.p57.leadership:
    title: Leadership
    die: d6
    page: 57
    rows:
    - - '1'
      - No Leader. The village operates with no leadership, which could lead to unresolved disputes.
    - - '2'
      - Natural Village Elder. The village recognizes a wise individual, and informally acknowledges them as an authority figure.
    - - '3'
      - External Ruler. The village owes fealty to a ruler who is located outside the village itself.
    - - '4'
      - Local Council. Prominent members of the community were chosen to lead the village collectively.
    - - '5'
      - Single, Elected Leader. The locals democratically voted for their current leader.
