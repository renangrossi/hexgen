  ss.p251.beneath-the-surface-awareness:
    title: Beneath the Surface - Awareness
    die: d12
    page: 251
    rows:
    - - '1'
      - Utterly Oblivious. The public has not seen, or heard, any hint of whatever is going on. It will go unchecked until something triggers a change.
    - - '2'
      - Single, Subtle Occurrence. Someone has noticed some kind of evidence, but doesn’t quite know what to make of it. They just know it’s strange.
    - - '3'
      - Disparate, Subtle Occurrences. A few people have passively encountered some evidence of what’s going on, though they are not aware of one another, and are not sure about what they’ve encountered.
    - - '4'
      - Many Subtle Occurrences. A fair amount of people have encountered something related to what’s going on and, while firm conclusions have not been drawn, there may be rumors.
    - - '5'
      - Single Occurrence. Someone has noticed something, and has formed some ideas. They have started to ask questions, or poke around a bit.
    - - '6'
      - Disparate Occurrences. A few people have noticed evidence, and are beginning to ask serious questions.
    - - '7'
      - Many Occurrences. A fair amount of people have noticed evidence, and are beginning to ask serious questions. Some may even have found one another and pooled their knowledge.
    - - '8'
      - Single, Direct Occurrence. Someone has had a direct, first-hand experience involving the issue, and is trying to deal with it somehow.
    - - '9'
      - Disparate, Direct Occurrences. A few people have had direct, first-hand experiences involving the issue, and word is starting to spread. Claims have become difficult to dismiss.
    - - '10'
      - Many Direct Occurrences. A fair amount of people have had direct, first-hand experiences involving the issue. Talk seems to be all over the place, and some of the witnesses have grouped together.
    - - '11'
      - Willfully Ignorant. The public is fully aware of most, or all, of the issue, but deliberately avoids addressing it or dealing with it in any way.
    - - '12'
      - Actively Aware. The public is fully aware, and actively addressing whatever is going on.
  ss.p297.location-in-relation-to-settlement:
    title: Location in Relation to Settlement
    die: d20
    page: 297
    rows:
    - - 1–3
      - Remote. The fortress is located a significant distance away from the nearest settlement.
    - - 4–7
      - Outskirts. The fortress is located on the very fringes of the settlements’ occupied land, perhaps within farming country, or the stretch of land between the settlement proper and the wilderness.
    - - 8–14
      - Edge of Settlement. The fortress is located on the outer border of the settlement proper, perhaps connected to, or surrounded by, its border wall, if it possesses one.
    - - 15–19
      - Central. The fortress is located in the middle of an established settlement.
    - - '20'
      - Prominent. The fortress is not only located in a central location, but is highly visible, as if it is (or was) being showcased or featured. The settlement was probably built around it.
  ss.p297.age:
    title: Age
    die: d20
    page: 297
    rows:
    - - '1'
      - New. The fortress was completed within the past 20 years. (+4 to condition roll) (-5 to residents roll)
    - - 2–3
      - Recent. The fortress was completed between 20 and 100 years ago. (+2 to condition roll) (-5 to residents roll)
    - - 4–8
      - Old. The fortress was completed between 100 and 200 years ago. (+0 to condition roll)
    - - 9–17
      - Very Old. The fortress was completed between 200 and 500 years ago. (-2 to condition roll)
    - - 18–20
      - Ancient. The fortress was completed more than 500 years ago. (-4 to condition roll)
  ss.p298.condition:
    title: Condition
    die: d20
    page: 298
    rows:
    - - 1–2
      - Ruin or Bare Bones. The majority of the structure is exposed to the elements,ruin and damages are no longer repairable; a rebuild would be the only option. If under construction, it is a long way
        from completion. Residence within the fortress would be incredibly uncomfortable, if even possible. (When building your keep, -2 to number of rooms roll) (-5 to furnishings roll)
    - - 3–6
      - Poor or Incomplete. The fortress is in disrepair, with loose stones or timbers, gaps, holes, rot, or other issues that might adversely affect the structure’s integrity. The exterior is not completely
        intact. If under construction, it may be nearing completion, or up to a few years from being finished. Residence within the fortress would prove inconvenient, at best. (When building your keep,
        -1 to number of rooms roll) (-2 to furnishings roll)
    - - 7–14
      - Average. The fortress is usable, sound, and habitable, though minor issues may be present, or a good clean may be needed. If under construction, the basics are complete and allow residents to, at
        least, live and function adequately. Further work or repairs should take no more than a year. (When building your keep, +0 to number of rooms roll)
    - - 15–19
      - Strong. The fortress is well-maintained and presents no obvious vulnerabilities. If the fortress is of a significant enough age, doors, timbers, fixings or other elements may have been added, updated,
        or replaced. It is likely kept relatively clean. If under construction, the fortress is very nearly complete, perhaps waiting on some superficial or decorative elements, and completion is likely
        within the month. The residents are able to live comfortably. (When building your keep, +1 to number of rooms roll)
    review: 1 results uncovered
  ss.p298.environment:
    title: Environment
    die: d10
    page: 298
    rows:
    - - '1'
      - Coastal. The fortress is near a large body of water, such as a lake or ocean.
    - - '2'
      - Forest. The fortress is nestled among the trees.
    - - '3'
      - Mountains. The fortress is found on stony passes or soaring peaks.
    - - '4'
      - Plains. The fortress is in the wide open fields.
    - - '5'
      - River. The fortress is near a steadily flowing stream, or other watercourse.
    - - '6'
      - Swamp. The fortress is in, or near, a vast area of stagnant water.
    - - '7'
      - Underground. The fortress is within a large network of caves.
    - - '8'
      - Valley. The fortress is found within, or on the edge of, an area of recessed elevation in relation to the landscape around it.
    - - '9'
      - Tundra. The fortress is in a very cold environment.
    - - '10'
      - Desert. The fortress is in a dry and arid environment, likely covered with vast sand dunes.
  ss.p299.expense:
    title: Expense
    die: d20
    page: 299
    rows:
    - - 1–2
      - Paltry. The fortress was built on a shoestring budget, barely sufficient to build even the most basic and rudimentary version, possibly cutting corners by necessity. (-5 to furnishings roll)
    - - 3–8
      - Modest. The fortress was constructed with a small budget, enough to build something simple, but functional. (-2 to furnishings roll)
    - - 9–15
      - Moderate. The fortress was built with a medium budget, perhaps allowing for a small comfort or two. (+0 to furnishings roll)
    - - 16–19
      - Significant. The fortress was built with a large budget, allowing for high-quality materials and some luxury elements. (+2 to furnishings roll)
    - - '20'
      - Extravagant. Little or no expense was spared in the construction. Materials are of top-quality, and the fortress feels grand and splendid. (+5 to furnishings roll)
  ss.p299.primary-building-materials:
    title: Primary Building Materials
    die: d20
    page: 299
    rows:
    - - 1–4
      - Brick. Man-made blocks, comprised of mud, clay, or sand, mixed with a binding material such as straw, baked hard.
    - - 5–8
      - Timber. Hewn logs and planks, milled to fit together tightly.
    - - 9–18
      - Stone. Rough-cut or smoothed and shaped, typically built on and around a timber frame and mortared together.
    - - '19'
      - Salvage. Found materials, such as repurposed stone from crumbled ruins, or timbers from wrecked ships.
    - - '20'
      - Unique Materials. Roll on the unique building materials table. If your result conflicts with your environment or campaign setting, reroll. If none work, use ‘Salvage’.
  ss.p299.unique-building-materials:
    title: Unique Building Materials
    die: d6
    page: 299
    rows:
    - - '1'
      - Bone. The fortress could be located in a place with plentiful (or, even, constantly replenishing) dead, or in some form of natural graveyard where bone is an abundant resource.
    - - '2'
      - Coral. If the fortress is located somewhere tropical, coral could be a potential replacement for stone (especially if the fortress - or the settlement it is in - is underwater!).
    - - '3'
      - Crystal. Those mining deep in the earth (or on alien planes) might find crystal in great enough abundance that it could be used to build large structures.
    - - '4'
      - Living Plant. Certain fantastic cultures are known to build their structures amongst, or even inside, living plants, such as great trees. Whether the plants are trained into shape by natural, or
        magical, means depends on the builders.
    - - '5'
      - Ice. Ice is an infinite resource in the frozen tundra; huge blocks could be cut and shaped to build a great fortress in such a location. While it might not be quite as tough as stone, repairs and
        replacements are far simpler.
    - - '6'
      - Magic. How prevalent is magic in your world? The background of your builders will determine what kind of methods they would have had at their disposal. Magic could have been utilized either to generate
        the materials for the fortress, assemble it or, perhaps, keep it all held together.
  ss.p300.resource-origin:
    title: Resource Origin
    die: d20
    page: 300
    rows:
    - - 1–7
      - Locally Made/Harvested [Preserved Surroundings]. Building materials were sourced from the site of the structure itself, and from nearby areas, but sustainably, without depleting any harvesting locations.
    - - 8–10
      - Locally Made/Harvested [Stripped Surroundings]. Building materials were sourced from the site of the structure itself, and from nearby areas, entirely depleting the harvesting locations (natural
        surroundings needed for the structure, natural defenses, etc. are unaffected).
    - - 11–12
      - Partially Local, Partially Imported. Building materials that were unable to be obtained locally were purchased and brought in from an outside source.
    - - 13–14
      - Imported. Building materials were purchased and brought in from an outside source in their entirety.
    - - '15'
      - Partially Salvaged. Some new materials were obtained locally, but a significant portion was salvaged from ruins and other destroyed structures.
    - - '16'
      - Entirely Salvaged. Building materials were all salvaged from various demolished structures.
    - - '17'
      - Partially Stolen. Building materials were gathered illicitly over time, perhaps by hijacking ships and other cargo transports, or commandeering materials from a quarry not under the builders’ control.
    - - '18'
      - Completely Stolen. Building materials were looted from one or more rightful owners, either openly or covertly.
    - - '19'
      - Partial Magic. Standard building materials were partially augmented by magic. Mundane materials may have been acquired or even created by magic.
    - - '20'
      - Completely Magic. Magic was used to either acquire an entire slew of mundane building materials, or create fantastical ones.
  ss.p300.reason-for-construction:
