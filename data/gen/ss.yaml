  ss.p217.priority-approach:
    title: Priority Approach
    die: d8
    page: 217
    rows:
    - - '1'
      - Peaceable (Strong). An agreeable stance is taken, preferring to avoid conflict whenever possible, through negotiating and dealing for the best nonaggressive outcome.
    - - 2–4
      - Peaceable (Moderate). An agreeable stance is taken unless heavily provoked, when an aggressive response is carefully deliberated. Deals and negotiations are preferred, but shows of force, or use
        of leverage, are not completely unheard of.
    - - 5–7
      - Aggressive (Moderate). A defensive stance is taken, though opportunity is provided for good faith. If that opportunity is squandered, dealings can become much more difficult. Shows of force are
        typically relied upon but peaceful or, at least, agreeable resolutions are usually considered.
    - - '8'
      - Aggressive (Strong). A defensive stance is taken, assuming and preparing for conflict at all times. Negotiation is considered only if the offer is extremely appealing. More often than not, the preference
        is to use ultimatums or physical force.
  ss.p217.priority-success:
    title: Priority Success
    die: d20
    page: 217
    rows:
    - - '1'
      - Failing. The leadership has been unsuccessful in achieving anything meaningful in relation to their priority. Every success that furthers the priority is not the doing of the leadership, and likely
        came about in spite of the leadership’s actions.
    - - 2–4
      - Mediocre. The leadership has made small steps in realizing its priority, achieving, perhaps, a single milestone.
    - - 5–14
      - Successful. The leadership has been successful at pursuing its priority, achieving several of its overall goals.
    - - 15–19
      - Very Successful. The leadership has made great strides at achieving its initial vision, and looks like their success will continue.
    - - '20'
      - Incredibly Successful. The leadership has gone above and beyond in pursuit of its priority, achieving more than it ever thought possible.
  ss.p218.lifestyle:
    title: Lifestyle
    die: d20
    page: 218
    rows:
    - - 1–2
      - Humble. The leader requires only what is necessary to live and function basically. Minimal attention is paid to their comfort. (-6 to residence roll)
    - - 3–10
      - Respectable. The leader’s lifestyle is unassuming, but comfortable, appropriate to one in their position. (+0 to residence roll)
    - - 11–15
      - Distinguished. The leader aspires to quality and high-functionality, but without concern for needless luxury or vanity. (+0 to residence roll)
    - - 16–17
      - Exquisite. The leader quietly enjoys the luxuries afforded to one in their lofty position, and presents a refined, well-maintained appearance. (+1 to residence roll)
    - - 18–19
      - Luxurious. The leader takes unrestrained advantage of the comforts and luxuries available to one in their position, and presents a striking, or flamboyant, appearance. (+2 to residence roll)
    - - '20'
      - Ostentatious. The leader revels in comfort and luxury, probably to excess, or endeavours to project such an image. They aim to inspire awe and jealousy in all who see them. (+3 to residence roll)
