  ss.p25.opportunities:
    title: Opportunities
    die: d6
    page: 25
    rows:
    - - '1'
      - Political Intrigue. A locally-known noble has gone missing recently. Perhaps they were traveling through and never made it to their destination? Perhaps no one even saw them leave at all...
    - - '2'
      - Missing Person. A local has gone missing, possibly a child, and rumors abound. Some talk of monsters, but their whispers are quickly dismissed as fairy tales. Others have theories, but none have
        yielded fruit.
    - - '3'
      - Monster. A monster has been causing trouble for the locals. Someone in the trading post is asking for help to deal with it.
    - - '4'
      - Guard Duty. The local constabulary are in need of more hands for an upcoming event, and capable adventurers are prime candidates.
    - - '5'
      - Transportation. A visitor feels they’ve outstayed their welcome, or urgently needs to leave, for some reason. They need help leaving and getting to their destination.
    - - '6'
      - Acquisition. Rumours abound that an item of value is hidden nearby, perhaps one tied to the trading post’s history. Several locals are interested in acquiring it, but not all for the same reason.
  ss.p25.danger-level:
    title: Danger Level
    die: d20
    page: 25
    rows:
    - - 1–2
      - Ever-Present. The trading post is constantly in peril. Encountering some form of hardship or adversity, when in the area, is almost guaranteed. It is never safe to go anywhere alone. Preparation
        and caution (even in and around the trading post) are critical.
    - - 3–6
      - Frequent. Traveling near the trading post and not encountering danger or hazards is a rarity. Preparation and caution are strongly advised.
    - - 7–14
      - Common. Danger or hazards are commonplace. Preparation and caution are advised.
    - - 15–18
      - Uncommon. Danger or hazards are not encountered often, though preparation is encouraged.
    - - 19–20
      - Rare. This trading post is built in a place known to be extremely safe; danger or hazards are a rarity.
  ss.p25.danger-type:
    title: Danger Type
    die: d10
    page: 25
    rows:
    - - 1–2
      - Suspicious Locals. Outsiders are often considered untrustworthy, and may be prime suspects in the event of crime.
    - - 3–4
      - Raids. The trading post is often raided by nearby groups of bandits, or packs of marauding creatures.
    - - 5–6
      - Monster. The trading post is terrorized by a monster that roams the local area.
    - - 7–8
      - Environmental. The environment in which the trading post exists is hazardous. It could be subject to frequent earthquakes, volcanoes, floods, mudslides, avalanches, frequent storms, or the like.
    - - 9–10
      - Cult. There is a cult within the trading post. The cult may be known, and present a direct form of threat, or they may be unknown, and the dangers they present may seem to stem from another source,
        or be unrelated.
  ss.p49.age:
    title: Age
    die: d20
    page: 49
    rows:
    - - 1–5
      - Recent. The village was established within the past year. Those within the village are newly settled. (-5 to population density roll) (-4 to hardship likelihood roll)
    - - 6–10
      - Established. The village has been settled for a few years. They have been able to successfully sustain themselves, and the families have started to grow. (-2 to population density roll) (-2 to hardship
        likelihood roll)
    - - 10–14
      - Mature. The village has been around close to a decade or so. Production has been honed, and practices are optimized. Children born in the settlement may be old enough to start to lend a hand. (+0
        to population density roll) (+0 to hardship likelihood roll)
    - - 15–18
      - Old. The village was founded decades ago. Production has reached peak performance, with the elder members of the community being old hands at the work. There are many adults in the village who were
        born there. (+0 to population density roll) (+2 to hardship likelihood roll)
    - - 19–20
      - Ancient. The village was established near to, or more than, a century ago. (+0 to population density roll) (+4 to hardship likelihood roll)
  ss.p50.hardship-likelihood:
    title: Hardship Likelihood
    die: d20
    page: 50
    rows:
    - - 1–2
      - No Hardship. The village has been lucky, and nothing has troubled it so far.
    - - 3–6
      - One Hardship. The village has experienced one notable time of difficulty.
    - - 7–14
      - Two Hardships. The village has gone through a couple of hardships.
    - - 15–18
      - Three Hardships. The village has experienced three difficult situations.
    - - 19–20
      - Four Hardships. The village has been beset by four trying times.
  ss.p51.hardship-type:
    title: Hardship Type
    die: d8
    page: 51
    rows:
    - - '1'
      - 'Plague. The community fell victim to disease. Modified attributes: population density'
    - - '2'
      - 'Bandits on the Road. On the way to or from market, the village’s caravan was set upon by bandits. Modified attributes: population wealth'
    - - '3'
      - 'Raid. The village was raided by marauders. Modified attributes: size, population wealth, population density'
    - - '4'
      - 'Famine / Food Shortage. If the village normally produces some kind of food, it did not produce. If they typically get their food from the market, they had difficulties doing so for a time. Modified
        attributes: population density'
    - - '5'
      - 'Harsh Weather. The region was beset by nature’s wrath. Modified attributes: condition, size'
    - - '6'
      - 'Inter-Community Conflict/Violence. A conflict between members of the community broke out and split the village, with dire consequences. Modified attributes: population density, disposition'
    - - '7'
      - 'Loss of Community Leader. A key member of the community died or went missing. Modified attributes: disposition'
    - - '8'
      - 'Victim of War. The village was struck by the ravages of war (passing or foraging armies, collateral battle damage, disease from war-related issues such as camp hygiene or illness from dead bodies).
        Modified attributes: condition, size, population density'
  ss.p51.hardship-outcome:
    title: Hardship Outcome
    die: d10
    page: 51
    rows:
    - - 1–2
      - 'Catastrophic Losses. The village’s losses were brutal, and excruciatingly difficult, or even impossible, to recover from. Modifier: -5 to roll(s) to hardship type ‘Modified attributes.’'
    - - 3–4
      - 'Terrible Losses. The village’s losses were crushing, and incredibly difficult to recover from. Modifier: -4 to roll(s) to hardship type ‘Modified attributes.’'
    - - 5–6
      - 'Heavy Losses. The village’s losses were awful, and recovery is proving difficult. Modifier: -3 to roll(s) to hardship type ‘Modified attributes.’'
    - - 7–8
      - 'Moderate Losses. The village’s losses were rough but recovery is likely, though may be tough. Modifier: -2 to roll(s) to hardship type ‘Modified attributes.’'
    - - 9–10
      - 'Minimal Losses. The village’s losses were as little as could have been hoped for, and recovery should be very possible, or even inevitable. Modifier: -1 to roll(s) to hardship type ‘Modified attributes.’
        O pt io n: At t r ib u t e S pec if ic O u t c o m es As written, a hardship outcome roll modifies all the attributes affected by one hardship type. If you’d like an additional layer of granularity,
        you could roll on the hardship outcome table for each individual attribute within a given hardship type. Exploring why some attributes were affected more or less than others could provide interesting
        story opportunities.'
