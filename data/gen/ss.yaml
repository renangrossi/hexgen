  ss.p54.resource:
    title: Resource
    die: d10
    page: 54
    rows:
    - - '1'
      - 'Crops. The village is surrounded by fields or orchards that produce wheat, barley, grapes, vegetables, fruit, etc. These are harvested in their raw forms, and the excess is sold or traded. Location(s):
        farm(s), mill(s) and/or storage locations (silos or barns).'
    - - '2'
      - 'Dairy. Pastures contain cows, goats, or sheep for milk, or chickens (or similar) for eggs. Additional animals may also be bred for sale. Due to milk’s tendency to spoil quickly, it might only be
        sold at nearby towns or markets. If the produce needs to travel longer distances, perhaps the village makes butter, cream, or cheese instead. Location(s): cellar, creamery, field/barn/coop'
    - - '3'
      - 'Herbs. Herbs grown in the village are used for alchemy, medicine or, simply, cooking, and are typically tended by an individual, due to their more specialized, and potentially dangerous, nature.
        The individual may have had some degree of medical, or arcane, training. Note: Unless the village is extremely small, it is unlikely that herbs are a village’s sole focus. Location: herbalist’s
        hut and gardens'
    - - '4'
      - 'Fishing. The villagers utilize the bounty of the nearest stream, river, lake, or ocean. The village’s proximity to neighboring settlements dictates how the fish can be sold. If remote, the fish
        might be dried and salted; if nearby, they could be sold fresh. Location(s): fisherman’s stand, wharf/pier'
    - - '5'
      - 'Livestock (Labor). Animals are bred here to perform a particular job. These include plough and war horses, donkeys, cattle, and oxen. The breeding and raising of these animals can be a long process,
        so trade is likely seasonal, and the animals expensive. Location(s): stable or barn'
    - - '6'
      - 'Livestock (Meat and Hides). Animals are raised to be slaughtered for meat, including cattle, pigs, and sheep. Some may be kept to feed the village, but excess animals (live or butchered) would
        be sold or traded. Location(s): barn or pens, small butcher’s shop'
    - - '7'
      - 'Livestock (Shearing): Llamas, sheep, goats, and/or yaks are shorn in the village, the wool bundled and taken to market. The village may also produce its own woolen goods for sale. Location(s):
        shearing shed, storage, fields/barn, small stall/shop'
    - - '8'
      - 'Logging and Lumber. Trees are planted and harvested, sustainably. Harvested trees are handtrimmed of branches, and logs are used, traded, and sold. Villagers may also process wood to craft wooden
        goods. Location(s): logging camp, carpenters workshop'
    - - '9'
      - 'Mining. Raw metal ores are excavated from the ground, cleaned and sorted, and then used, traded, or sold. It is possible the mine is owned by a noble or kingdom, who sends transport to pick up
        excavated materials. Ores may be processed in the village and turned into metal goods. Location(s): foreman’s station, mine, smithy'
    - - '10'
      - 'Quarrying and Masonry. Stone is removed from the landscape in either raw, unrefined pieces, or cut into blocks for various purposes. It is possible the quarry is owned by a noble or kingdom, who
        sends transport to pick up excavated materials. A local mason may build using the excavated stone. Location(s): mason or foreman’s station O pt io nal R es o u r c e (You may choose this if it appeals
        to you and/or makes sense for your village.) Ice. Keeping certain items cold is a necessity, and a village with access to ice would be in a great position to store meat, fish and dairy products.
        If your village is located in a very cold region, it may even be possible to collect and sell this valuable resource to those in warmer climes. Ice would likely be cut in huge blocks in the mountains
        or frozen lakes. It would be transported insulated in a material such as straw or sawdust (or kept cool by the regular addition of fresh snow). At the destination, it would be placed in an insulated
        ice house, dug into the earth, and kept raised off the ground. From here, ice could be sold or used. Location: ice house'
