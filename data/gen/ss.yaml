  ss.p142.priority:
    title: Priority
    die: d6
    page: 142
    rows:
    - - '1'
      - Control. The city has established itself as a power in the region, establishing a network of patrolled roads, but also military presence, in other local settlements. The city itself is a strong
        and formidable presence. (+3 to law enforcement roll)
    - - '2'
      - Trade. The city was made to move goods. Coin flows from hand to hand, and the city wholeheartedly encourages this. It likely collects a tax from any trade, but the benefits should far outweigh the
        costs. (+1 to population wealth roll)
    - - '3'
      - Enlightenment. The leadership prides itself on its intelligence and wisdom, typically making choices that preserve their society and reinforce the community’s access to knowledge and culture. (When
        rolling districts, choose ‘Scholar District’ as one of them)
    - - '4'
      - Entertainment. Whatever this place was before the city was founded properly, it was known for fun. Perhaps it was a place of grandiose performances, raucous pubs, or dancing and festivities. On
        the other hand, maybe it became known for more disreputable pursuits, such as underground fighting or gambling, among many other possibilities. (When rolling for additional locations in your districts,
        manually select one place you would consider an entertainment venue for each).
    - - '5'
      - Production. This settlement was built around producing a particular good or resource. This could be raw materials, like crops or mining ore, but could also be the manufacture of a certain product
        or products. (For your first roll on the outside the city table, roll a d10, rerolling any results 1-4).
    - - '6'
      - Faith. The city is a nexus for the faithful. For one reason or another, folk may undertake pilgrimages here. There are likely at least a few places of worship, perhaps many more than usual. The
        city may have been founded around the site of a miracle or visitation. It could be the holding place of a special artifact, or the residence of a particular person of religious import. The city
        may be dominated by a single faith or, perhaps, multiple faiths are represented here. (When rolling districts, choose ‘Temple District’ as one of them).
  ss.p142.age:
    title: Age
    die: d10
    page: 142
    rows:
