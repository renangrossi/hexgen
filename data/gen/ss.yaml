  ss.p56.population-density:
    title: Population Density
    die: d20
    page: 56
    rows:
    - - 1–2
      - Skeleton. There are only enough people here for the village to function at its most basic level. (+2 to crime roll)
    - - 3–6
      - Sparse. People are living here, but not many. They are able to handle all tasks that need doing but, perhaps, with some difficulty. (+1 to crime roll)
    - - 7–14
      - Populous. There are enough people here for the village to manage all tasks without difficulty. (+0 to crime roll)
    - - 15–18
      - Dense. The village seems to have a large amount of people for its size. There are many hands available to help with any work that needs doing. (-1 to crime roll)
    - - 19–20
      - Congested. The village has as many people in it as it can hold, and camps may be cropping up on the outskirts. There are plenty of hands available to help with work but, unless the work is very
        large-scale (such as quarrying), there may be at least some idle people. (-2 to crime roll)
  ss.p56.demographics:
    title: Demographics
    die: d20
    page: 56
    rows:
