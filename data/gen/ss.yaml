    - - '4'
      - Innocuous. The fortress’ construction had little impact on its surroundings, causing no trouble, but also not any great benefit.
    - - '5'
      - Beneficial. The fortress proved a boon to the local area, perhaps serving as a compromise to a pre-existing issue, or demonstrating some small, positive impact.
    - - '6'
