    - - '2'
      - Enemy - Friendly. Relations are civil enough, but there is a fundamental and irreconcilable rivalry, or difference of opinion, that prevents any real alliance.
    - - '3'
      - Ally - With Reservations. The entity is considered a friend, but treated with care, possibly not fully trusted. They could be a friend yet to truly prove their loyalty, or one who is unpredictable
