  ss.p221.infiltration-depth:
    title: Infiltration Depth
    die: d20
    page: 221
    rows:
    - - 1–10
      - 'General. Goals: Gathering general intelligence involving identification of key places, figures, routines and infrastructure. Repercussions: Individual - revelation of identity National - diplomatic
        tension, divulging information about discovered spy’s efforts.'
    - - 11–15
      - 'Deep. Goals: Ingratiating selves with individual targets, monitoring and noting relationships and actively guarded information. Repercussions: Individual - revelation of identity, imprisonment/ransom
        or attempts to turn operative National - diplomatic tension, divulging information about discovered spy’s efforts, difficult negotiations.'
    - - 16–19
      - 'Immersed. Goals: Establishing and building deeper connections with key figures. Repercussions: Individual - mortal peril or possible attempts to turn operative National - ultimatums, deals highly
