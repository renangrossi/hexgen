      - Administration. This district has a focus on government and civil matters.
    - - '2'
      - Arcane. This district has a focus on magical matters.
    - - '3'
      - Botanical. This district has a focus on nature.
    - - '4'
      - Craft. This district has a focus on the creation of different goods.
    - - '5'
      - Docks. This district has a focus on all naval and seafaring matters. (reroll if your city is not adjacent to water)
    - - '6'
      - Industrial. This district has a focus on large-scale production facilities.
    - - '7'
      - Market. This district has a focus on the sale of practical goods.
    - - '8'
      - Merchant. This district has a focus on business and non-essential goods.
    - - '9'
      - Scholar. This district has a focus on education and the pursuit of knowledge.
    - - '10'
      - Slums. This district is an area where those with lesser means might live. (roll a d4 on district condition) (-1 to quality rolls for locations in this district)
    - - '11'
      - Temple. This district has a focus on religion and/or spiritual enlightenment.
    - - '12'
      - 'Upper Class. This district is an area where those with greater means might live. (+3 to its district condition roll) (+3 to quality rolls for locations in this district) T ip: U s ing t h e F o
        llo w ing T ab les We suggest that when rolling on a table in this general district information section, roll for all your districts at once. This will reduce the need for backtracking.'
