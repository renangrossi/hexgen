    - - '16'
      - Drain, with Grating. A drain pipe emerges somewhere in the landscape outside the fortress. Its opening is covered by metal grating.
    - - '17'
      - Drain, Blocked. A drain pipe emerges somewhere in the landscape outside the fortress. Its final several yards are entirely filled with large stones to allow water to easily pass, but not intruders.
    - - '18'
      - Drain, Blocked, with Grating. A drain pipe emerges somewhere in the landscape outside the fortress. Its final several yards are entirely filled with large stones to allow water to easily pass, but
        not intruders. Its mouth is also covered with metal grating.
    - - '19'
      - Old, Forgotten Tunnel. A tunnel was dug out of the fortress quite some time ago, but has since fallen into disrepair. There is a possibility that no one knows about it. Use of the tunnel might risk
        collapse or cave-in.
    - - '20'
      - Maintained Tunnel. A tunnel leads out of the fortress, which is well-maintained and in good repair. It shows signs of recent (but not heavy) use.
  ss.p301.local-impact:
