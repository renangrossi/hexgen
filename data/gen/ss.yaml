    - - '1'
      - One.
    - - '2'
      - Two.
    - - '3'
      - Three.
    - - '4'
      - Four. S ignif ic ant C o nnec t io ns It would be realistic to think that a capital would have far more than four connections to outside entities. We have limited to four for the purposes of keeping
        things manageable. These 1-4 connections are intended to be the significant ones that would potentially have the most tangible effect on the capital, or be the source of major plot points. It is
        actually very likely that your capital has a dozen or more minor connections and relationships, but we will leave those up to you.
  ss.p220.connection-relation:
