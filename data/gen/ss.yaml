  ss.p249.recent-history:
    title: Recent History
    die: d20
    page: 249
    rows:
    - - '1'
      - A known thief was found dead, and on display, in the market square. The murderer has not been found.
    - - '2'
      - Passionate protests against a leadership decision took place recently, but fell silent extremely quickly. Why?
    - - '3'
      - A particularly odd fashion trend has been adopted by the wealthiest citizens of the capital.
    - - '4'
      - A contingent of soldiers from a known enemy (if no known enemies, unknown) country have deserted their commanders and come to the capital, forswearing past allegiances and seeking citizenship. How
        have they been received? What are they doing now?
    - - '5'
      - Questions have been asked about the legitimacy of the leadership, as well as their fitness for the role. The detractors are gaining momentum, though no one has yet been able to prove the truth either
        way, or determine whether there are ulterior motives at play.
    - - '6'
      - Refugees have traveled a great distance to seek sanctuary in the capital. How has the capital received them? Are the nobility and common folk divided, or united, in their opinion of the situation?
    - - '7'
      - Graffiti has been appearing across the capital, advertising some kind of underground competition. The competition is a legal gray area, but the promise of glory is an enticing prize for even some
        of the most upstanding citizens.
    - - '8'
      - A feud between two of the capital’s nobles, or major figures, came to blows very publicly, leaving each party dissatisfied and, possibly, looking to exact revenge.
    - - '9'
      - A well-known, well-liked nobleman was recently unexpectedly stripped of his rank and title. Were the leadership’s grievances justified, or is there more going on than meets the eye?
    - - '10'
      - A shipment of fresh produce arrived at market from a neighboring city. To all intents and purposes, the contents seemed perfectly fine initially but, as more and more people have fallen ill, it
        is now clear the crates were infected with a terrible disease.
    - - '11'
      - A block of buildings caught fire in the district with the lowest district condition, devastating multiple businesses and/or residences.
    - - '12'
      - The owner of a bank & exchange (if one is present, a shop if not) has discovered a tunnel entrance down in their cellar that they swear wasn’t there before. Where did it come from?
    - - '13'
      - The highest quality tavern in the city experienced a particularly nasty bar brawl, and everyone is talking about it. What happened? How did it end?
    - - '14'
      - The district with the most housing recently assembled its own private security force, acting independently from the watch. Why did they deem it necessary? How has local law enforcement and leadership
        responded?
    - - '15'
      - A public building, in a key location, has collapsed, and an investigation is underway to determine the cause.
    - - '16'
      - 'A local tavernkeep is starting something called ‘Smashy Hour’, a controlled and sanctioned weekly bar-brawl. The event is in partnership with a local furniture maker, who supplies old stock to
        be used as make-shift weapons. Guards are, so far, not getting involved, so long as the chaos stays contained. The only rule: don’t destroy the tavern.'
    - - '17'
      - Someone within the city has been breeding chickens, and numbers are getting out of control. The streets are filled with poultry, and no one knows where they’re coming from, or who started breeding
        them.
    - - '18'
      - Leadership delegates were invited to an extremely important-sounding summit, hosted by a foreign power. This was months ago, and the delegates have not been heard from since they left the capital.
    - - '19'
      - Someone in the capital has developed new urban farming practises, which have been slowly catching on.
    - - '20'
      - A deity has made a physical appearance in the city.
