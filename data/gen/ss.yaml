  ss.p144.outside-the-city:
    title: Outside the City
    die: d20
    page: 144
    rows:
    - - 1–4
      - None. If you have any remaining rolls to make on this table, proceed with them.
    - - 5–6
      - Farming [Agriculture]. A group of farms, providing food for the city, are found on the nearest hospitable land under its control.
    - - 7–8
      - Farming [Livestock]. A group of farms, providing livestock for the city, are found on the nearest hospitable land under its control.
    - - 9–10
      - Resource Harvesting. Depending on the landscape and available resources (trees, minerals, ore, stone, etc.), a logging camp, mine, or quarry, belonging to the city, has been built nearby to harvest
        them, which it then uses or sells.
    - - 11–12
      - Barrows. An area devoted to burial sites.
    - - '13'
      - Caravan Community. A nomadic group of people have taken to living on the surrounding land nearby. Does the city’s leadership have an issue with this? What about its residents?
    - - '14'
      - Event Grounds. Tended grounds for games, duels, ceremonies, or other events.
    - - '15'
      - Family Estate. A wealthy family’s large estate is situated in the neighboring countryside.
    - - '16'
      - Hermit’s Cottage. A hermit lives near the city limits, beneath the notice of most of the inhabitants. They keep to themselves, but who are they? What do they gain by their close proximity?
    - - 17–18
      - Makeshift Settlement. A large mass of hovels, lean-tos, tents, and other improvised shelters have been built in the shadow of the city’s walls. Why? Do the leaders and residents care?
    - - '19'
      - Medical Camp. A set of makeshift or, depending on the nature of what is being treated, permanent structures have been erected to tend to, or even quarantine, the sick or injured.
    - - '20'
      - Prison. Some sort of structure out here has been designated for holding prisoners or captives (for whatever reason) either temporarily or, perhaps, much longer term.
  ss.p145.stewardship:
    title: Stewardship
    die: d20
    page: 145
    rows:
    - - '1'
      - Neglected. All of the fundamental elements of the city are being ignored, or are unable to be addressed. (-7 to general condition roll) (-13 to population wealth roll) (-9 to law enforcement roll)
    - - 2–4
      - Minimal. The fundamental elements of the city are being tended to, but at the bare minimum. This may be because of inexperienced leadership, misplaced priorities, lack of resources, or simple laziness,
        to name a few possible reasons. (-4 to general condition roll) (-6 to population wealth roll) (-5 to law enforcement roll)
    - - 5–10
      - Passing. The city’s fundamental elements are taken care of to a serviceable degree, though an inequality of attention is noticeable, and some areas seem to take priority over others. It could be
        that resources are not plentiful enough to cover everything, but those in charge are doing the best they can. (-1 to general condition roll) (-3 to population wealth roll) (-2 to law enforcement
        roll)
    - - 11–16
      - Adequate. The city’s fundamental elements are all taken care of relatively competently, but some room for improvement still exists. Lack of capital, or involvement in more pressing matters such
        as external conflicts or disaster management, are possible explanations. (+0 to general condition roll) (+0 to population wealth roll) (+0 to law enforcement roll)
    - - 17–19
      - Managed. The city’s fundamental elements are all accounted for and well attended to. Whoever is responsible is doing an admirable job. (+1 to general condition roll) (+3 to population wealth roll)
        (+4 to law enforcement roll)
    - - '20'
      - Disciplined. The city’s fundamental elements are firmly in hand, providing what it needs to perform at peak functionality. There is little to no room for improvement. Whoever is managing things
        is doing so expertly. (+5 to general condition roll) (+6 to population wealth roll) (+8 to law enforcement roll)
  ss.p146.general-condition:
    title: General Condition
    die: d20
    page: 146
    rows:
    - - '1'
      - Squalid. The city is in a deplorable state. Things are falling apart, filthy and, to anyone who doesn’t live there, seems positively unlivable. Most of the buildings, if not all, are likely a disgrace,
        or in terrible need of help. (-2 to district condition rolls)
    - - 2–4
      - Dilapidated. Things are dirty and in a widespread state of disrepair, though some token effort may have been made at cleanliness. Streets are probably packed dirt or broken stone. They may be uneven,
        rutted or muddy. Structures have likely received similar low levels of care, though there could be some disparity. (-1 to district condition rolls)
    - - 5–12
      - Decent. The city is passable. While not offensive to the senses of one that is well traveled, it could still be off-putting to those with lofty expectations. Structures may not be aesthetically
        pleasing, but are generally functional. (+0 to district condition rolls)
    - - 13–19
      - Impressive. The city is well taken care of, and cleanliness is clearly a priority. Structures are maintained, though signs of wear may still be apparent. It feels lived-in, but of a respectable
        quality in every regard. (+1 to district condition rolls)
    - - '20'
      - Magnificent. The city is incredible. Cleanliness, maintenance and structural integrity are all of the highest standard. Loving attention seems to have been lavished on as many aspects as is possible.
        (+2 to district condition rolls)
  ss.p146.environment:
    title: Environment
    die: d10
    page: 146
    rows:
    - - '1'
      - Coastal. The city is near a large body of water, such as a lake or ocean.
    - - '2'
      - Forest. The city is nestled among the trees.
    - - '3'
      - Mountains. The city is found on stony passes or soaring peaks.
    - - '4'
      - Plains. The city is in the wide open fields.
    - - '5'
      - River. The city is near a steadily flowing stream, or other watercourse.
    - - '6'
      - Swamp. The city is in, or near, a vast area of stagnant water.
    - - '7'
      - Underground. The city is within a large network of caves.
    - - '8'
      - Valley. The city is found within, or on the edge of, an area of recessed elevation in relation to the landscape around it.
    - - '9'
      - Tundra. The city is in a very cold environment.
    - - '10'
      - Desert. The city is in a dry and arid environment, likely covered with vast sand dunes. W at er Regardless of environment, one critical element to any settlement is water. The fact that the place
        exists is evidence that they are getting water somehow, but what that might be may not be obvious. This can be a creative challenge for you. Perhaps your settlement is in a desert, or deep in a
        forest. Perhaps they have deep wells? Maybe they actually purchase water from elsewhere? Or it could even be that it’s generated magically. Either way, a plentiful source of water is an important
        thing to think about.
  ss.p147.fortification:
    title: Fortification
    die: d20
    page: 147
    rows:
    - - '1'
      - Unfortified. The city is exposed on all sides, save for any barriers created by the presence of buildings or natural land formations. (-5 to disposition roll)
    - - 2–8
      - Lightly Fortified. The city has bare-bones fortifications which are a minimal obstacle for enemy forces, but are adequate to deter wild animals. A simple gate, which can be barred in the evenings,
        sits astride the main road. (+1 to disposition roll)
    - - 9–15
      - Fortified. The city is surrounded by a substantial wall of wood or stone. The wall is able to be patrolled by guards on a raised walkway. Visitors to the city pass through a main gate that can be
        barred in the evenings. A few watch towers may be placed around the city, though are likely sporadic. (+3 to disposition roll)
    - - 16–19
      - Heavily Fortified. The city is surrounded by a heavy wall of wood or stone, with several watchtowers built along its length. The gate is double-thickness and reinforced with metal bands. There are
        additional watchtowers built at various points throughout the surrounding countryside. (+5 to disposition roll)
    - - '20'
      - Extremely Fortified. The city is surrounded by an imposing wall of wood or stone, with many fullystaffed watchtowers at regular intervals along its length. The gate is double-thickness, reinforced
        with metal bands, augmented with a portcullis, and is always manned. A supplementary wall of wood or stone encompasses the surrounding countryside, with its own watchtowers. Nothing goes in or out
        without the watch’s knowledge or permission. (+7 to disposition roll)
  ss.p147.market-square:
    title: Market Square
    die: d6
    page: 147
    rows:
    - - 1–2
      - Tight. Only room for a few vendor stalls.
    - - 3–4
      - Ample. Room for a fair number of vendor stalls.
    - - 5–6
      - Spacious. Room for lots of vendor stalls.
  ss.p147.vendor-stall-acquisition:
    title: Vendor Stall Acquisition
    die: d4
    page: 147
    rows:
    - - '1'
      - First Come, First Served - No Fee. Merchants line up prior to market day. Those at the front of the line are given the spaces. No fees are charged.
    - - '2'
      - First Come, First Served - Fee. Merchants line up prior to market day. Those at the front of the line are given first pick of the available stall spaces, provided they can pay the fee for the day.
    - - '3'
      - Lease. Merchants pay in advance (sometimes far in advance) for the right to a space in the market square.
    - - '4'
      - Bid. Prior to market day, the spaces are auctioned off.
  ss.p147.merchant-overflow:
    title: Merchant Overflow
    die: d4
    page: 147
    rows:
    - - '1'
      - Banned. Excess vendors are not allowed to set up stalls outside the town. City guards will enforce this. (+1 to law enforcement roll)
    - - '2'
      - Unpatrolled. Excess vendors are allowed to set up stalls but, as the city watch do not patrol or monitor these areas, the risk is higher. The spaces available are unkempt.
    - - '3'
      - Monitored. Excess vendors are allowed to set up stalls, and the city watch patrols through regularly, but the areas themselves are less-maintained and traffic is lighter.
    - - '4'
      - Encouraged. Excess vendors are encouraged to set up stalls outside the city, if they are unable to get a spot in the square. There are maintained areas available for use, and are provided on a first-come,
        first-served basis. When in use by vendors, this area is regularly patrolled, if law enforcement personnel can be spared.
  ss.p148.underground-passages:
    title: Underground Passages
    die: d20
    page: 148
    rows:
    - - 1–8
      - None. There are no significant passages underneath the city.
    - - 9–14
      - Sewers. A network of drains, pipes, and trenches lies beneath the city. Base the sewer’s condition upon that of the settlement, if they were built concurrently. They may pre-date the current city.
    - - 15–17
      - Natural Caves. Below the city, natural cave systems can be found that may, or may not, have been discovered yet.
    - - 18–19
      - Tunnels. A series of tunnels exist beneath the city. This could be for maintenance, defensive, or clandestine purposes and may, or may not, have been purpose-built for the current settlement. They
        could potentially have been dug by enemy forces, either recently or long ago.
    - - '20'
      - Forgotten Crypts. Old burial chambers and tombs are housed deep beneath the city, likely unknown to the general populace.
  ss.p149.population-density:
    title: Population Density
    die: d20
    page: 149
    rows:
    - - 1–2
      - Skeleton. The city only has enough people to function at its most basic level. (-2 to night activity roll)
    - - 3–6
      - Sparse. Folk live in the city, but it would never be called bustling. Walking down the street, you’ll typically only see a few people. (-1 to night activity roll)
    - - 7–14
      - Populous. A moderate amount of people live in the city. Walking through the streets, you will see plenty of people, but never so many that it would feel cramped. (+0 to night activity roll)
    - - 15–18
      - Dense. There is a large amount of people living in the city. There are few, if any, vacant buildings. In high traffic areas, one generally has elbow room, but not much more. (+1 to night activity
        roll)
    - - 19–20
      - Crowded. The city is filled with jostling throngs. Practically all structures are occupied. Some may even camp outside the walls. Moving about can be difficult, and bumping into other people is
        typical in higher traffic areas. (+2 to night activity roll)
  ss.p149.demographics:
    title: Demographics
    die: d20
    page: 149
    rows:
    - - 1–2
      - Only One. 100% primary race.
    - - 3–6
      - Only Two. 60% primary race, 40% secondary race.
    - - 7–14
      - Normal Distribution. 50% primary race, 25% secondary race, 15% tertiary race, 10% other.
    - - 15–17
      - Wide Distribution. 20% primary race. All others reasonably well represented.
    - - 18–19
      - High and Low. 80% primary race, 20% secondary race.
    - - '20'
      - Ever-Changing. No discernible distribution. Racial representation lacks any sense of numerical dominance.
  ss.p150.population-wealth:
    title: Population Wealth
    die: d20
    page: 150
    rows:
    - - 1–2
      - Destitute. Nearly everyone in the city consistently lacks the barest essentials of what they need to survive. (-2 to general crime roll)
    - - 3–6
      - Impoverished. Around half of the city struggles to carve out even a meager existence. (-1 to general crime roll)
    - - 7–14
      - Average. Most of the city’s population have enough to live a modest life. Those without are a minority. (+0 to general crime roll)
    - - 15–17
      - Prosperous. The majority have enough to live a good life and, of them, a fair amount can even live comfortably. (-1 to general crime roll)
    - - 18–19
      - Wealthy. Nearly everyone has what they need to live comfortably, many are able to live well, and some are very prosperous. (-2 to general crime roll)
    - - '20'
      - Affluent. The entire city is able to live comfortably, with a significant portion living in luxury. (-3 to general crime roll)
  ss.p150.visitor-traffic:
    title: Visitor Traffic
    die: d20
    page: 150
    rows:
    - - 1–2
      - Mostly Locals. On any given day, there are typically a few from outside the city, though not enough to impact congestion. (+0 to night activity roll)
    - - 3–6
      - Groups. There are generally a fair amount of visitors to the city. May slightly increase congestion. (+1 to night activity roll)
    - - 7–12
      - Crowds. A noticeable amount of people come through the city on a regular basis. Congestion is increased. (+2 to night activity roll)
    - - 13–17
      - Droves. Large groups of people regularly frequent the city. Congestion is significantly increased. (+3 to night activity roll)
    - - 18–19
      - Masses. Huge groups of people always seem to be visiting. Congestion could cause difficulties if the city is unable to cope with very large amounts of people. (+4 to night activity roll)
    - - '20'
      - Multitudes. Massive groups of people throng the streets, likely spilling out onto the roads outside the city. Congestion is an ever-present reality and a regular issue. (+5 to night activity roll)
  ss.p151.disposition:
    title: Disposition
    die: d20
    page: 151
    rows:
    - - 1–2
      - Hostile. Locals seem very unfriendly toward visitors, and would likely make out-of-towners feel unwelcome. This could manifest as coldness, passive-aggressiveness, or even violence.
    - - 3–6
      - Unfriendly. Locals don’t care much for visitors, looking upon them with contempt, fear, or suspicion.
    - - 7–14
      - Neutral. Locals are standoffish, or perhaps hard on the outside, but can be friendly if you get to know them.
    - - 15–18
      - Friendly. Locals are generally friendly, welcoming, and slow to take offense.
    - - 19–20
      - Open. The locals actively enjoy visitors, and their culture incorporates this. Just about anyone is welcome.
  ss.p151.night-activity:
    title: Night Activity
    die: d20
    page: 151
    rows:
    - - '1'
      - Dark. By the time the sun goes down, the streets are nearly empty and the city closes up. All is quiet and peaceful. If the city has a gate, it is closed and barred. Guards may, or may not, allow
        night travelers inside.
    - - 2–3
      - Quiet. Everything is closed except for inns and taverns, which remain open until around midnight. Late guests would have to wake an innkeeper to get a room. If the city has a gate, it is closed
        and barred. Guards will usually let visitors in, but will discourage wandering.
    - - 4–12
      - Slow. Almost everything is closed except for taverns, which may be open until early morning, and inns, which stay open perpetually. If the city has a gate, it is closed, but guards will generally
        be ready to open it, as needed.
    - - 13–17
      - Active. Inns and taverns remain open perpetually. Some shops and services may be open, catering to late travelers or night owls. A fair amount of establishments may still be closed. If the city
        has a gate, it is kept open, but guarded, ready to be closed, if needed.
    - - 18–19
      - Lively. There is little difference between day and night traffic. There are always people on the streets, and it may seem like no one ever sleeps. Most shops and services remain open constantly.
        If the city has a gate, it remains open and is only closed under the most dire of circumstances.
    - - '20'
      - Raucous. When the day ends, the city truly comes to life. Inns and taverns have customers coming and going at all hours. Parties, and other commotion, can often be heard. One might expect things
        to close down after dark but, in this city, there are locations that only open in the evenings. There is likely a sort of ‘night market’ throughout the city, with goods, services, or curiosities
        of all kinds available for those keep alternative hours (or scoff at the need for sleep).
  ss.p152.leadership-crime-levels-low-can-be-extre:
    title: Leadership crime levels low can be extremely challenging.
    die: d100
    page: 152
    rows:
    - - 1–15
      - Elected Council. Prominent members of the community were chosen to lead the city collectively.
      - Roll below to see what the city has to maintain order and uphold the law.
    - - 16–30
      - Mayor. The locals democratically voted for their current leader.
      - 'Modified by: priority (control), stewardship, merchant overflow (banned), leadership (military officer)'
    - - 31–45
      - Hereditary. A non-elected leader is in power, by
      - ''
    cols:
    - Leadership
    - crime levels low can be extremely challenging.
    review: 55 results uncovered
  ss.p153.general-crime:
    title: General Crime
    die: d20
    page: 153
    rows:
    - - 1–2
      - Dangerous. The streets are crawling with crime. Having things stolen is the least of folks’ worries. Vandalism and muggings are a daily occurrence, and discoveries of bodies are not what one would
        call ‘rare’. (Roll on organized crime table) (+4 to urban encounter rolls)
    - - 3–6
      - Frequent. The streets are unsafe, and a purse in plain sight is almost sure to be stolen. Vandalism and muggings are fairly regular. It’s dangerous to travel alone. (Roll on organized crime table)
        (+4 to urban encounter rolls)
    - - 7–14
      - Common. Most are used to hearing about some sort of trouble every day or two. Everyone knows someone who’s been a victim of crime, either a theft or, sometimes, even a mugging, or worse. (Roll on
        organized crime table) (+3 to urban encounter rolls)
    - - 15–18
      - Uncommon. Theft or mild violence happens from time to time. Best to keep an eye out, just in case. (+2 to urban encounter rolls)
    - - 19–20
      - 'Infrequent. Most don’t believe there is any crime, and certainly haven’t experienced any. (+1 to urban encounter rolls) U r b an E nc o u nt er s Urban encounters are intended to happen in-game
        while players are in your settlement and, as such, are not intended to be planned as part of game preparation or world building. The table for these can be found in Appendix B: Encounters (p. 442).'
  ss.p153.organized-crime:
    title: Organized Crime
    die: d20
    page: 153
    rows:
    - - 1–2
      - Completely Secret. The organization has operated incognito, beneath any form of public notice. Any contacts with public officials are dealt with through redundant channels, always maintaining multiple
        degrees of separation. Remaining unknown is of paramount importance.
    - - 3–6
      - Whispers. There are hushed rumors of criminal organization, but most folks keep these suspicions to themselves, for fear of ridicule, or reprisal. The organization has a few operatives within the
        city and they work hard to keep a very low profile.
    - - 7–14
      - Talk. Enough incidents have occurred that most folk don’t have trouble believing there is an organized criminal element in the city. They operate quietly but ambitiously, carrying out frequent high-profile
        jobs. They could also have ties to government officials, or may even attempt to control elements of the city itself.
    - - 15–18
      - Barely Hidden. The organization is a looming shadow within the city. None are entirely sure where it is based, or who their operators are, but it’s clear that the organization is real. Obstacles
        that would be contrary to the ‘hypothetical’ organization’s interests are quickly resolved. Bodies are found, messages sent and, one way or another, their will is always made known.
    - - 19–20
      - Open. Though key members may be unknown, the presence of the organization is common knowledge and, though it may not have been fully proved, it’s clear they have a direct hand in running the city.
        They operate with impunity, with little fear of reprisal or repercussion, likely taking no steps to mask their presence to ensure compliance, such as with a sigil on a sealed envelope. How did it
        get to this point? How do the people of the city feel about this?
  ss.p154.number-of-districts:
    title: Number of Districts
    die: d20
    page: 154
    rows:
    - - 1–2
      - '2'
    - - 3–10
      - '3'
    - - 11–15
      - '4'
    - - 16–19
      - '5'
    - - '20'
      - 6 M o r e D is t r ic t s ? When designing this material, we found 6 districts to be a good maximum, without crossing the line into potentially being overwhelming. However, if you are someone who
        yearns for an added workload or, perhaps, just really, really likes districts (or numbers higher than 6…), there is nothing stopping you from adding more districts. Simply print as many additional
        copies of pages 3 and 4 of the Cities settlement sheet at the back of this book as you need to aid you in the hyper-districtification of your settlement.
