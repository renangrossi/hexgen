  ss.p12.origin:
    title: Origin
    die: d8
    page: 12
    rows:
    - - '1'
      - Accidental. The trading post came about due to an accident, such as a caravan breaking down or mistaken directions. What was set up to deal with the accident eventually became the trading post.
    - - '2'
      - Business Venture. The trading post was established by a wealthy entrepreneur specifically to be a trading post from the start.
    - - '3'
      - Crossroads. The trading post is at the intersection of more than one major trade route.
    - - '4'
      - Military Outpost. The trading post was built on the remnants of an old fortress or watchtower, the structures of which have long since fallen down or been repurposed by the locals.
    - - '5'
      - No Man’s Land. The trading post was established as a neutral place where opposing forces could purchase wares, without encroaching on enemy territory.
    - - '6'
      - Native. The trading post was started by someone native to the area, who saw potential in trade with passersby.
    - - '7'
      - Overnight Stop. The trading post was originally a single, large house for overnight stays for weary travelers, which soon grew, along with the demand for accommodations.
    - - '8'
      - Wilderness Expert. The trading post was started when a trapper, hunter or guide set up a camp, in order to aid those passing through the area.
  ss.p13.specialty:
    title: Specialty
    die: d6
    page: 13
    rows:
    - - '1'
      - Atypical Shipping Methods. This trading post is known for having unique and effective ways to move goods.
    - - '2'
      - 'Food & Drink. This trading post is known for [d6]: 1-3: excellent and unique food. 4-6: plentiful and varied high-quality beverages.'
    - - '3'
      - Hospitality. The main inn here is particularly good, offering excellent service, comfortable rooms, and good food. (If you roll for the inn’s quality using the quality table found in step 3, ignore
        results that would make it ‘poor’)
    - - '4'
      - Information. This trading post is known as a source for reliable information. They may not know everything, but your chances of finding solid gossip, lore, news, or an intriguing tidbit here is
        good.
    - - '5'
      - Purchasing Connections. This trading post is known for having folks who can find things. If they don’t have (or know about) what you’re looking for, they can direct you to someone who does.
    - - '6'
      - 'Unscrupulous Contractors. This trading post is known for having people who can get just about anything done, if the coin is right. (Free Location: Service - Hired Help [Roll 1d10]): 1: Brutes &
        Brawlers, 2: Cloak & Dagger, 3: Bows & Slings, 4: Scribes & Clerks, 5: Guides & Trackers, 6: Caravan & Mount, 7: Arcane Academics, 8: Magic Mercenaries, 9: Priestly Guidance, 10: Hands of the Divine'
  ss.p13.age:
    title: Age
    die: d20
    page: 13
    rows:
    - - 1–3
      - Recent. The trading post was established within the past year. (-1 to visitor traffic roll)
    - - 4–8
      - Established. The trading post has been around for at least a couple of years. (+0 to visitor traffic roll)
    - - 9–13
      - Mature. The trading post was originally built decades ago. (+1 to visitor traffic roll)
    - - 14–17
      - Old. The trading post was built around a hundred years ago. (+2 to visitor traffic roll)
    - - 18–19
      - Ancient. The trading post was built hundreds of years ago. (+3 to visitor traffic roll)
    - - '20'
      - Unknown. No one really knows when the trading post was established. (+4 to visitor traffic roll)
  ss.p14.condition:
    title: Condition
    die: d20
    page: 14
    rows:
    - - 1–2
      - Ramshackle. A few of the buildings look to be falling down. There are no formal roads, only trodden paths. (-6 to population wealth roll)
    - - 3–6
      - Poor. The buildings and surroundings are rough and dirty. Roads are uneven dirt and dust. (-3 to population wealth roll)
    - - 7–14
      - Fair. The buildings are clean and sparsely decorated. Roads are flattened earth, possibly with gravel. (+0 to population wealth roll)
    - - 15–18
      - Good. Most of the structures are exceptionally well kept and moderately decorated. Roads are cobblestone or, perhaps, cheap brick. (+3 to population wealth roll)
    - - 19–20
      - Immaculate. The shops and houses are spotless, and well-adorned with tasteful decorations. Roads are made of fine, smooth, well-placed flagstones. (+6 to population wealth roll)
  ss.p14.visitor-traffic:
    title: Visitor Traffic
    die: d20
    page: 14
    rows:
    - - 1–2
      - Vacant. No one seems to be visiting this place. (+0 to size roll) (+2 to crime roll)
    - - 3–6
      - Groups. Visitors are a rarity, though a few might be around. (+1 to size roll) (+1 to crime roll)
    - - 7–14
      - Crowds. It is typical to see some new visitors most days. (+2 to size roll) (+0 to crime roll)
    - - 15–18
      - Droves. There are lots of new faces on a regular basis. (+3 to size roll) (-1 to crime roll)
    - - 19–20
      - Masses. New people are everywhere, coming and going at all times. (+4 to size roll) (-2 to crime roll)
  ss.p15.size:
    title: Size
    die: d20
    page: 15
    rows:
    - - 1–2
      - Very Small. Up to 20 standing structures.
    - - 3–6
      - Small. Up to 40 standing structures.
    - - 7–14
      - Medium. Up to 60 standing structures.
    - - 15–18
      - Large. Up to 80 standing structures.
    - - 19–20
      - Very Large. Up to 100 standing structures.
  ss.p15.environment:
    title: Environment
    die: d10
    page: 15
    rows:
    - - '1'
      - Coastal. The trading post is near a large body of water, such as a lake or ocean.
    - - '2'
      - Forest. The trading post is nestled among the trees.
    - - '3'
      - Mountains. The trading post is found on stony passes or soaring peaks.
    - - '4'
      - Plains. The trading post is in the wide, open fields.
    - - '5'
      - River. The trading post is near a steadily flowing stream, or other watercourse.
    - - '6'
      - Swamp. The trading post is in, or near, a vast area of stagnant water.
    - - '7'
      - Underground. The trading post is within a large network of caves.
    - - '8'
      - Valley. The trading post is found within, or on the edge of, an area of recessed elevation in relation to the landscape around it.
    - - '9'
      - Tundra. The trading post is in a very cold environment.
    - - '10'
      - Desert. The trading post is in a dry and arid environment, likely covered with vast sand dunes.
