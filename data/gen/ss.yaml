  ss.p308.magical-properties:
    title: Magical Properties
    die: d10
    page: 308
    rows:
    - - '1'
      - Flying. The fortress can be, or is always, airborne. The magic is likely sustained by a ritual, enchanted object, or individual, who may or may not command the fortress
    - - '2'
      - Dreamer. The fortress is mentally tethered to the imagination of a mortal mind. While they dream, the fortress appears nearby. If the individual dies, the fortress transfers to another.
    - - '3'
      - Spells of Binding. Magic augmented the building process to more-thoroughly bind the materials together, strengthening the overall structure exponentially.
    - - '4'
      - Speech. The fortress itself is sentient, and is able to communicate telepathically to those it chooses. Any excesses of personality are at the discretion of the GM!
    - - '5'
      - Exuding Presence. The fortress exudes an unseen aura which influences the emotional state of visitors, both friend or foe.
    - - '6'
      - Desecrated Ground. The bodies of the fallen tend to rise and turn against their living comrades.
    - - '7'
      - Deceptive. The fortress appears differently to onlookers outside of its walls than to those inside them.
    - - '8'
      - Nexus. Magic here seems to be more potent and effective, but the veil between worlds also seems thin. Otherworldly entities may be drawn to magic used here which resonates with their home plane.
    - - '9'
      - Teleportation. The fortress can magically change location instantly, blinking out of one place and into another.
    - - '10'
      - Phasing. The fortress can shift from one plane of existence to another, but always remains in the same physical location.
  ss.p308.unknown-origin:
    title: Unknown Origin
    die: d4
    page: 308
    rows:
    - - '1'
      - Extraplanar. The fortress popped into existence instantaneously.
    - - '2'
      - Unseen Hands. The fortress was built without anyone ever seeing a builder. It seemed to grow, unobserved, each day until it was finished.
    - - '3'
      - Stranger. Someone integral to the inception of the fortress was unknown to anyone else involved.
    - - '4'
      - No Records. The fortress was built by people who are no longer around, and no records give clues as to who they were.
  ss.p308.intriguing-purpose:
    title: Intriguing Purpose
    die: d6
    page: 308
    rows:
    - - '1'
      - Protection. The fortress was built to keep something safe. Whatever that something is, it is no secret that it resides in the fortress.
    - - '2'
      - Hiding. The fortress was built to keep something from being found.
    - - '3'
      - Hint. The fortress was built to act as a clue to some greater mystery.
    - - '4'
      - Instruction. The fortress was built with a lesson in mind, to teach those who would look upon it.
    - - '5'
      - Imprisonment. The fortress was built to prevent something from getting into others’ hands, or from being unleashed on the wider world.
    - - '6'
      - Connection. The fortress was built to accommodate a magical or extraplanar portal.
  ss.p308.catastrophic-event:
    title: Catastrophic Event
    die: d6
    page: 308
    rows:
    - - '1'
      - Natural Disaster. A major storm, earthquake, or other calamity struck this place.
    - - '2'
      - Battle. This was the site of a brutal, devastating conflict.
    - - '3'
      - Genocide. An attempt was made to wipe a people, or creature, from existence here.
    - - '4'
      - Betrayal. A significant trust was broken here.
    - - '5'
      - Curse. The fortress, or the area in general, was placed under a vindictive spell.
    - - '6'
      - Summoning. A terrible creature, or otherworldly being, was summoned to this plane from within the fortress, and may remain nearby.
  ss.p309.miraculous-event:
    title: Miraculous Event
    die: d8
    page: 309
    rows:
    - - '1'
      - Found Anew. Something (or someone) of incredible significance was rediscovered here.
    - - '2'
      - Salvation. Someone in dire peril was saved here.
    - - '3'
      - Odds Defied. Victory was snatched from the jaws of defeat here, when all hope seemed lost.
    - - '4'
      - Divine Intervention. A god made their will known directly here.
    - - '5'
      - Sacrifice. Someone gave up something very dear to them here, in service to a higher cause.
    - - '6'
      - Prophecy Fulfilled. Events previously foretold saw their culmination here.
    - - '7'
      - Death Refused. Someone, who should have died, managed to retain their grasp on life here.
    - - '8'
      - Quest Accomplished. A great mission was concluded here.
  ss.p309.bizarre-location:
    title: Bizarre Location
    die: d8
    page: 309
    rows:
    - - '1'
      - Abyss or Chasm. The fortress is built on a platform suspended directly over a deep hole or crevasse.
    - - '2'
      - Sky. The fortress is built in such a way as to allow it to float, or hover in mid-air, above ground level (you decide how high). It could be on something like a cloud, or a manufactured platform,
        suspended by magic or technology.
    - - '3'
      - Active Volcano. The fortress is built on, or even inside, an active volcano. Assume that the fortress is built from materials, and has the resources, that would allow it exist here.
    - - '4'
      - Beneath the Surface. The fortress is located under some kind of environment where one might not think a fortress could be, such as underwater, under sand, or even soil or mud. There may, or may
        not, be something keeping the surrounding material out of the immediate fortress (such as a bubble keeping water out of an underwater fortress).
    - - '5'
      - Mobile. The fortress is built in such a way as to allow it to move. It could be on wheels, organic legs, the back of a massive beast, a manufactured platform, or magical landmass, to name a few
        options.
    - - '6'
      - Nested Environment. The fortress is built within a separate environment that exists within the primary environment. This nested environment may be contained within a physical barrier, such as a
        dome or bubble. In any case, there are discernible borders between it and the primary environment.
    - - '7'
      - Beast Colony. The fortress is built in the midst of a colony of uncivilized creatures or animals.
    - - '8'
      - Unnatural Object. The fortress is built upon, or around, a strange, foreign item, that has, perhaps, fallen from the heavens or from another plane of existence.
