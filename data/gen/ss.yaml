  ss.p211.environment:
    title: Environment
    die: d10
    page: 211
    rows:
    - - '1'
      - Coastal. The capital is near a large body of water, such as a lake or ocean.
    - - '2'
      - Forest. The capital is nestled among the trees.
    - - '3'
      - Mountains. The capital is found on stony passes or soaring peaks.
    - - '4'
      - Plains. The capital is in the wide open fields.
    - - '5'
      - River. The capital is near a steadily flowing stream, or other watercourse.
    - - '6'
      - Swamp. The capital is in, or near, a vast area of stagnant water.
    - - '7'
      - Underground. The capital is within a large network of caves.
    - - '8'
      - Valley. The capital is found within, or on the edge of, an area of recessed elevation in relation to the landscape around it.
    - - '9'
      - Tundra. The capital is in a very cold environment.
    - - '10'
      - Desert. The capital is in a dry and arid environment, likely covered with vast sand dunes. W at er Regardless of environment, one critical element to any settlement is water. The fact that the place
        exists is evidence that they are getting water somehow, but what that might be may not be obvious. This can be a creative challenge for you. Perhaps your settlement is in a desert, or deep in a
        forest. Perhaps they have deep wells? Maybe they actually purchase water from elsewhere? Or it could even be that it’s generated magically. Either way, a plentiful source of water is an important
        thing to think about.
