  ss.p227.pursuit-of-culture:
    title: Pursuit of Culture
    die: d20
    page: 227
    rows:
    - - 1–10
      - Moderate. Culture is viewed as passingly important. Most enjoy cultural activities, but they do not dominate to the detriment of other aspects of life.
    - - 11–16
      - Keen Interest. Interest is deep and far-reaching, but not overwhelming. Many folks incorporate some aspect of cultural endeavor into their daily life.
    - - 17–19
      - Obsession. Interest is pervasive, and talk of the culture seeps into regular conversation frequently. The pursuit of culture tends to dominate many aspects of daily life.
    - - '20'
      - Rabid Fanaticism. The pursuit of culture has overrun the capital and, even to visitors, is likely inescapable. Local speech is dominated by it, and events honoring it are ongoing. It seems to be
        represented, in some way, almost everywhere one looks.
  ss.p228.population-density:
    title: Population Density
    die: d20
    page: 228
    rows:
    - - 1–2
      - Skeleton. The capital only has enough people to function at its most basic level. (-2 to night activity roll)
    - - 3–6
      - Sparse. Folk live in the capital, but it would never be called bustling. Walking down the street, you’ll typically only see a few people. (-1 to night activity roll)
    - - 7–14
      - Populous. A moderate amount of people live in the capital. Walking through the streets, you will see plenty of people, but never so many that it would feel cramped. (+0 to night activity roll)
    - - 15–18
      - Dense. There is a large amount of people living in the capital. There are few, if any, vacant buildings. In high traffic areas, one generally has elbow room, but not much more. (+1 to night activity
        roll)
    - - 19–20
      - Crowded. The capital is filled with jostling throngs. Practically all structures are occupied. Some may even camp outside the walls. Moving about can be difficult, and bumping into other people
        is typical in higher traffic areas. (+2 to night activity roll)
  ss.p228.demographics:
    title: Demographics
    die: d20
    page: 228
    rows:
    - - '1'
      - Only One. 100% primary race.
    - - 2–4
      - Only Two. 60% primary race, 40% secondary race.
    - - 5–12
      - Normal Distribution. 50% primary race, 25% secondary race, 15% tertiary race, 10% other.
    - - 13–17
      - Wide Distribution. 20% primary race. All others reasonably well represented.
    - - 18–19
      - High and Low. 80% primary race, 20% secondary race.
    - - '20'
      - Ever-Changing. No discernible distribution. Racial representation lacks any sense of numerical dominance.
  ss.p229.population-wealth:
    title: Population Wealth
    die: d20
    page: 229
    rows:
    - - 1–2
      - Destitute. Nearly everyone in the capital consistently lacks the barest essentials of what they need to survive. (-2 to general crime roll)
    - - 3–6
      - Impoverished. Around half of the capital struggles to carve out even a meager existence. (-1 to general crime roll)
    - - 7–14
      - Average. Most of the capital’s population have enough to live a modest life. Those without are a minority. (+0 to general crime roll)
    - - 15–17
      - Prosperous. The majority have enough to live a good life and, of them, a fair amount can even live comfortably. (-1 to general crime roll)
    - - 18–19
      - Wealthy. Nearly everyone has what they need to live comfortably, many are able to live well, and some are very prosperous. (-2 to general crime roll)
    - - '20'
      - Affluent. The entire capital is able to live comfortably, with a significant portion living in luxury. (-3 to general crime roll)
  ss.p229.visitor-traffic:
    title: Visitor Traffic
    die: d20
    page: 229
    rows:
    - - '1'
      - Mostly Locals. On any given day, there are typically a few from outside the capital, though not enough to impact congestion. (+0 to night activity roll)
    - - 2–3
      - Groups. There are generally a fair amount of visitors to the capital. May slightly increase congestion. (+1 to night activity roll)
    - - 4–10
      - Crowds. A noticeable amount of people come through the capital on a regular basis. Congestion is increased. (+2 to night activity roll)
    - - 11–17
      - Droves. Large groups of people regularly frequent the capital. Congestion is significantly increased. (+3 to night activity roll)
    - - 18–19
      - Masses. Huge groups of people always seem to be visiting. Congestion could cause difficulties if the capital is unable to cope with very large amounts of people. (+4 to night activity roll)
    - - '20'
      - Multitudes. Massive groups of people throng the streets, likely spilling out onto the roads outside the capital. Congestion is an ever-present reality and a regular issue. (+5 to night activity
        roll)
  ss.p230.disposition:
    title: Disposition
    die: d20
    page: 230
    rows:
    - - 1–2
      - Hostile. Locals seem very unfriendly toward visitors, and would likely make out-of-towners feel unwelcome. This could manifest as coldness, passive-aggressiveness, or even violence.
    - - 3–6
      - Unfriendly. Locals don’t care much for visitors, looking upon them with contempt, fear, or suspicion.
    - - 7–14
      - Neutral. Locals are standoffish, or perhaps hard on the outside, but can be friendly if you get to know them.
    - - 15–18
      - Friendly. Locals are generally friendly, welcoming, and slow to take offense.
    - - 19–20
      - Open. The locals actively enjoy visitors, and their culture incorporates this. Just about anyone is welcome.
  ss.p230.night-activity:
    title: Night Activity
    die: d20
    page: 230
    rows:
    - - '1'
      - Dark. By the time the sun goes down, the streets are nearly empty and the city closes up. All is quiet and peaceful. If the capital has a gate, it is closed and barred. Guards may, or may not, not
        allow night travelers inside.
    - - 2–3
      - Quiet. Everything is closed except for inns and taverns, which remain open until around midnight. Late guests would have to wake an innkeeper to get a room. If the capital has a gate, it is closed
        and barred. Guards will usually let visitors in, but will discourage wandering.
    - - 4–9
      - Slow. Almost everything is closed except for taverns, which may be open until early morning, and inns, which stay open perpetually. If the capital has a gate, it is closed, but guards will generally
        be ready to open it, as needed.
    - - 10–14
      - Active. Inns and taverns remain open perpetually. Some shops and services may be open, catering to late travelers or night owls. A fair amount of establishments may still be closed. If the capital
        has a gate, it is kept open, but guarded, ready to be closed, if needed.
    - - 15–18
      - Lively. There is little difference between day and night traffic. There are always people on the streets, and it may seem like no one ever sleeps. Most shops and services remain open constantly.
        If the capital has a gate, it remains open and is only closed under the most dire of circumstances.
    - - 19–20
      - Raucous. When the day ends, the capital truly comes to life. Inns and taverns have customers coming and going at all hours. Parties, and other commotion, can often be heard. One might expect things
        to close down after dark but, in the capital, there are locations that only open in the evenings. There is likely a sort of ‘night market’ throughout the capital, with goods, services, or curiosities
        of all kinds available for those keep alternative hours (or scoff at the need for sleep).
  ss.p231.law-enforcement-if-general-crime-is-high:
    title: Law Enforcement If general crime is higher than ‘Infrequent’ (a roll of 1-14), roll
    die: d20
    page: 231
    rows:
    - - '1'
      - None. If not openly opposed by the collective population, crime can easily run amok. This could manifest itself in subtle or obvious ways. (-5 to general crime roll)
      - 'on the succeeding table to establish your additional organized crime presence. Modified by: leadership (underworld or criminal enterprise), population wealth, law enforcement'
    - - 2–8
      - City Watch. Run by a single captain, the watch has sufficient strength to cover key points, as well establish a patrol once or twice a day. (-3 to general crime roll)
      - d20 Crime 1-2 Dangerous. The streets are crawling with crime. Having things stolen is the least of folks’ worries. Vandalism and muggings are a daily occurence, and
    - - 9–13
      - Robust City Watch. Run by a captain and two sergeants, the watch are able to place extra support at key points, as well as establish three or four patrols a day. (-1 to general crime roll)
      - discoveries of bodies are not what one would call ‘rare’. (Roll on organized crime table) (+5 to urban encounter rolls) 3-6 Frequent. The streets are unsafe, and a purse in plain sight is almost
        sure to be stolen. Vandalism
    - - 14–20
      - Extensive City Watch. Run by a captain and several sergeants, all key points are thoroughly guarded. The city perimeter is patrolled constantly, and city patrols happen regularly. (+0 to general
        crime roll) U t ilit ies and P u b lic S er v ic es Depending on the level of sophistication and organization in your capital, you may decide to have representations of public services and the like,
        such as fire-fighters or hospitals. If the city watch is robust enough, there could be physical offices in different districts. On the other hand, if there appears to be little-or-no city watch
        presence, consider the possibility of private militias or enforcement groups.
      - 'and muggings are fairly regular. It’s dangerous to travel alone. (Roll on organized crime table) (+4 to urban encounter rolls) 7-14 Common. Most are used to hearing about some sort of trouble every
        day or two. Everyone knows someone who’s been a victim of crime, either a theft or, sometimes, even a mugging, or worse. (Roll on organized crime table) (+3 to urban encounter rolls) 15-18 Uncommon.
        Theft or mild violence happens from time to time. Best to keep an eye out, just in case. (+2 to urban encounter rolls) 19-20 Infrequent. Most don’t believe there is any crime, and certainly haven’t
        experienced any. (+1 to urban encounter rolls) U r b an E nc o u nt er s Urban encounters are intended to happen in-game while players are in your settlement and, as such, are not intended to be
