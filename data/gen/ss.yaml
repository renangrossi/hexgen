  ss.p16.demographics:
    title: Demographics
    die: d20
    page: 16
    rows:
    - - 1–5
      - Only One. 100% primary race.
    - - 6–10
      - Only Two. 60% primary race, 40% secondary race.
    - - 10–14
      - Normal Distribution. 50% primary race, 25% secondary race, 15% tertiary race, 10% other.
    - - 15–17
      - Wide Distribution. 20% primary race. All others reasonably well represented.
    - - 18–19
      - High and Low. 80% primary race, 20% secondary race.
    - - '20'
      - Ever-Changing. No discernible distribution. Racial representation lacks any sense of numerical dominance.
  ss.p17.law-enforcement:
    title: Law Enforcement
    die: d20
    page: 17
    rows:
    - - 1–2
      - None. This could be good or bad, depending on one’s point of view. Good, if the folk here are just that. Bad when mob justice is carried out on a petty thief. (-8 to crime roll)
    - - 3–6
      - Sheriff. A single sheriff and a deputy keep things civil. (-4 to crime roll)
    - - 7–14
      - Small Local Watch. A sheriff, a deputy, and a handful of volunteer residents make up a token watch presence. (+0 to crime roll)
    - - 15–18
      - Well-Equipped. Law enforcement is very common. (+4 to crime roll)
    - - 19–20
      - Overwhelming Presence. Law enforcement is always around in public, no matter what. (+8 to crime roll)
  ss.p17.leadership:
    title: Leadership
    die: d20
    page: 17
    rows:
    - - '1'
      - No Leader. The trading post operates with no leadership, which could lead to unresolved disputes.
    - - 2–4
      - Hereditary. A non-elected leader is in power, by virtue of their bloodline.
    - - 5–7
      - Merchant Monarch. The wealthiest shop owner in the trading post leads by default.
    - - 8–10
      - Underworld or Criminal Enterprise. A criminal, or group of criminals, either publicly, or privately, controls the trading post.
    - - 11–13
      - 'Oligarchy. A few individuals hold sway, collectively, over the trading post. [Roll1d4]: 1: merchants (plutocracy); 2: mages (magocracy); 3: priests (theocracy); 4: other small group.'
    - - 14–16
      - Local Council. Prominent members of the community were chosen to lead the trading post collectively.
    - - 17–19
      - Single, elected leader. The locals democratically voted for their current leader.
    - - '20'
      - Anarcho-Syndicalist Commune. The members of the trading post take turns as a sort of executive officer for the week.
  ss.p18.population-wealth:
    title: Population Wealth
    die: d20
    page: 18
    rows:
    - - 1–2
      - Destitute. Most of the population consistently lacks the barest essentials of what they need to survive. (-4 to crime roll) (-2 to quality rolls)
    - - 3–6
      - Impoverished. Around half of the population struggles to carve out even a meager existence. (-2 to crime roll) (-1 to quality rolls)
    - - 7–14
      - Average. Most of the population have enough to live a modest life. (+0 to crime roll) (+0 to quality rolls)
    - - 15–17
      - Prosperous. Most of the population has enough to live a good life and, of them, a fair amount can even live comfortably. (-1 to crime roll) (+0 to quality rolls)
    - - 18–19
      - Wealthy. Nearly everyone has what they need to live comfortably, many are able to live well, and some are very prosperous. (-2 to crime roll) (+2 to quality rolls)
    - - '20'
      - Affluent. Nearly everyone is able to live comfortably, with a significant portion living in luxury. (-4 to crime roll) (+3 to quality rolls) All M inu s es ? The minuses to crime on this table represent
        reasons why there might be more crime, based on population wealth. If wealth is low, crime is likely due to desperation. If wealth is high, it’s likely due to greed.
  ss.p18.crime:
    title: Crime
    die: d20
    page: 18
    rows:
    - - 1–2
      - Regular. The streets are crawling with criminals, and a purse unstowed is almost sure to be snatched. (+4 to urban encounter rolls)
    - - 3–6
      - Common. Most are used to hearing about trouble every day or two. Everyone knows someone who’s been a victim of crime. (+3 to urban encounter rolls)
    - - 7–14
      - Average. Theft or mild violence can happen from time to time. Best to keep an eye out. (+2 to urban encounter rolls)
    - - 15–18
      - Uncommon. Some in the trading post have run into a pickpocket or heard about a robbery but, when they do, it’s a noteworthy occurrence. (+1 to urban encounter rolls)
    - - 19–20
      - 'Rare. Most in the trading post have had no personal experience of crime, and know few people that have. (+0 to urban encounter rolls) U r b an E nc o u nt er s Urban encounters are intended to
        happen in-game while players are in your settlement and, as such, are not intended to be planned as part of game preparation or world building. The table for these can be found in Appendix B: Encounters
        (p. 442).'
