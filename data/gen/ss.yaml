  ss.p21.services:
    title: Services
    die: d100
    page: 21
    rows:
    - - 1–8
      - Barber. Provides grooming services, such as haircuts or shaves.
    - - 9–16
      - Bathhouse. Provides spaces for bathing.
    - - 17–24
      - Doctor/Apothecary. Provides medical care.
    - - 25–32
      - House of Leisure. Provides entertainment and/or relaxation (GM may decide what kind).
    - - 33–44
      - Inn. Provides accommodation, as well as a place to have a bath and a decent meal.
    - - 45–52
      - Club. Provides entertainment via comedic, dramatic or musical performance.
    - - 53–60
      - Soothsayer. Provides magical prediction and prophecy - sayers of sooth!
    - - 61–68
      - Stable. Provides boarding accommodation for mounts, as well as selling carts, animals, and their tack.
    - - 69–80
      - Tavern. Provides food and drink.
    - - 81–82
      - Hired Help - Brutes and Brawlers. Thugs, ruffians and muscle.
    - - 83–84
      - Hired Help - Cloak and Dagger. Assassins, thieves and spies.
    - - 85–86
      - Hired Help - Bows and Slings. Archers and ranged attack specialists.
    - - 87–88
      - Hired Help - Scribes and Clerks. Masters of history, literature, mathematics and/or business.
    - - 89–90
      - Hired Help - Guides and Trackers. Scouts, rangers and wilderness experts.
    - - 91–92
      - Hired Help - Caravan and Mount. Specialists in transportation and journeys to various locations as well as expedition organization and management.
    - - 93–94
      - Hired Help - Arcane Academics. Experts in matters of magic and lore (may also be natural magic or something else; it need not be exclusively arcane).
    - - 95–96
      - Hired Help - Magic Mercenaries. Specialists trained the use of arcane or non-divine magic in combat and practical mission scenarios.
    - - 97–98
      - Hired Help - Priestly Guidance. Sages offering counsel in all matters of religion and the divine.
    - - 99–100
      - Hired Help - Hands of the Divine. Specialists trained in the use of divine magic in combat and practical mission scenarios.
  ss.p21.hired-help-size:
    title: Hired Help Size
    die: d12
    page: 21
    rows:
    - - 1–6
      - Individual Person. The hired help is a single person hiring out their services.
    - - 7–10
      - Team. The hired help is a team of individuals who work together.
    - - 11–12
      - Guild. An organized guild is hiring out their services. When hired, a portion of the guild’s members handle the job, not the entire guild (unless the job is very large).
  ss.p22.quality:
    title: Quality
    die: d12
    page: 22
    rows:
    - - 1–4
      - Poor. The location is a substandard version of what is typically expected. Its offerings are likely limited, or of bad quality. The location itself may be in disrepair, dirty, or have any number
        of other issues present.
    - - 5–10
      - Good. The location is a standard version of what is typically expected. Its offerings are likely not terrible, but often not particularly remarkable either (though sometimes there may be exceptions).
        The location itself is likely in a serviceable state, though probably not flawless.
    - - 11–12
      - Fine. The location is an exceptional version of what is typically expected. Its offerings are likely extensive, or of surpassing quality. The location itself is likely remarkable in some way (or,
        possibly, many ways) such as being very clean or well-built.
