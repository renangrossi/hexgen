      - Age How old is the capital? It may have been built up gradually
    - - '2'
      - Holy City. The site was of religious significance, and was settled with the intent of growing it into a capital.
      - over decades, even centuries, or its inception could have been a monumental effort over a shorter period of time. The older a capital is, the more time people have had to find it, join it, and settle
