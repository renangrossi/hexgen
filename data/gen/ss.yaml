      - Back Door, Blocked. A small, rear-access door was built into the exterior wall. For security reasons, it has been blocked from the inside.
    - - '12'
      - Back Door, Exposed. A small, rear-access door was built into the exterior wall. The door may still be in regular use, and no attempt has been made to disguise or conceal it. It may be guarded.
    - - '13'
      - Back Door, Hidden. A small, rear-access door was built into the exterior wall. The door may be used infrequently, and has been intentionally obscured or covered. It may also be guarded.
    - - '14'
