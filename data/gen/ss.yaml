  ss.p444.urban-encounters:
    title: Urban Encounters
    die: d20
    page: 444
    rows:
    - - '1'
      - Alms for the Poor. The party is asked for money by a beggar who is not actually in need.
    - - '2'
      - Bait-and-Switch. A person, posing as a victim or someone in need of help, asks the party for aid and lures them into a vulnerable position where a trap is sprung.
    - - '3'
      - Boisterous Drunk. A weaving drunk approaches and challenges someone in the party to a one-onone duel (the drunk sets the terms).
    - - '4'
      - Disturbance of the Peace. A wide-eyed figure shouts at anyone who will listen (and a large number of people who will not) about their many, specific grievances against the ruling powers.
    - - '5'
      - Distraction. A charming stranger attempts to distract the party while a thief tries to steal their belongings.
    - - '6'
      - Graffiti. Someone has been painting inflammatory images or slogans on a victim’s home, place of business or in a public place.
    - - '7'
      - Grifter. An individual approaches the party and suggests they partake in a simple game (such as following a ball placed under one of three cups, which are then moved around) and proposes a wager.
        The game is rigged, either with specialized equipment, sleight of hand, or a well-placed distraction.
    - - '8'
      - Hand it Over. Thugs accost the party, demanding valuables be handed over.
    - - '9'
      - Impersonating an Officer. One or more persons approach the party claiming to be law enforcement, accusing them of breaking a law but confiding that they won’t take them in (if the price is right,
        naturally). More committed swindlers may even have a fake holding cell, or other elaborate equipment, to help sell the deception.
    - - '10'
      - Mugging. The party sees an individual or small group being threatened, beaten, and robbed.
    - - '11'
      - Murder. The party witnesses a murder take place, or happens upon a freshly slain victim.
    - - '12'
      - Rare Opportunity. Someone in the settlement is selling counterfeit items, while an accomplice, claiming to know the item’s true value, offers a large amount of money. The seller talks to the party
        privately, expressing doubts about the potential ‘buyer’ and offers them a better deal if they’d like to buy it now.
    - - '13'
      - Robbery in Progress. The party sees a thief or thieves exiting a building nearby with stolen goods in-hand.
    - - '14'
      - Snake-Oil Salesman. A merchant offers the party a great deal on what they claim is an exceptional item. At least, it would be a great deal if the item was genuine...
    - - '15'
      - Sticky Fingers. A thief attempts to reach their hand into the pocket or pack of a party member. If caught, the thief tries to run.
    - - '16'
      - Stop, Thief! The party witnesses a thief pickpocket someone, but no law enforcement is around to handle the situation.
    - - '17'
      - Street Fight. The party is embroiled in, or comes upon, a group of people in a violent altercation.
    - - '18'
      - They Went Thataway! The party hears a scream from nearby, and comes across a battered and groaning figure on the ground. A retreating form can be seen rounding a corner.
    - - '19'
      - Thief in Need. A pursued thief runs into the party, asking for help or protection, in return for a cut of their plunder.
    - - '20'
      - Toss and Burn. A lit torch is thrown into a nearby establishment, causing commotion and panic.
  ss.p445.rumors:
    title: Rumors
    die: d100
    page: 445
    rows:
    - - 1–2
      - Misfortune has fallen upon a prominent figure residing near to, but outside the bounds of, the settlement (stripped of title, robbed, murdered, lost at cards, etc).
    - - 3–4
      - Neighboring cities are preparing to go to war with one another.
    - - 5–6
      - A local noble has just married the heir of a wellloved (or greatly-loathed) family.
    - - 7–8
      - An increase in taxes is about to implemented, to pay for an expensive and ambitious project.
    - - 9–10
      - Taxes have not been collected in quite some time, and no one has seen the collector for weeks.
    - - 11–12
      - A well-known local has been seen stepping out with someone outside their usual circle, and there is the possibility that romance is on the cards.
    - - 13–14
      - A strange beggar has been seen telling any who will speak with them, predictions about their future, and some have come true.
    - - 15–16
      - A local official has been skimming from the settlement’s coffers.
    - - 17–18
      - A grain shortage is imminent, the wisest in the settlement are filling their storage sheds before the price jumps.
    - - 19–20
      - A local residence is haunted by a mischievous spirit.
    - - 21–22
      - A local has been selling orphans into slavery.
    - - 23–24
      - A particular vegetable sold by a traveling merchant is claimed to bear superior nutritional value to all other vegetables.
    - - 25–26
      - Someone in the settlement is running a secret underground fighting pit.
    - - 27–28
      - Research has come to light that gnomes are actually another form of elf, simply lacking the trait responsible for typical elven height.
    - - 29–30
      - A monstrous beast prowls outside the settlement at night, always slinking in the shadows. It’s said to have glowing red eyes and a taste for blood.
    - - 31–32
      - Overuse of healing potions can cause addiction. After a certain point, the body begins to shut down unless imbibed frequently.
    - - 33–34
      - Someone in the settlement hosts a secret highstakes gambling table.
    - - 35–36
      - A tavernkeep in the settlement is actually a famous ex-adventurer trying to keep a low profile.
    - - 37–38
      - A local, who lives modestly, has recently inherited a vast fortune.
    - - 39–40
      - A storm’s a-brewin’.
    - - 41–42
      - A local blacksmith has been working on a new forging technique that would make the current methods obsolete.
    - - 43–44
      - A local official has been taking bribes.
    - - 45–46
      - There is a door in the settlement leading to a realm with thousands of other doors to other planes. The last person to go through it hasn’t been seen since.
    - - 47–48
      - A local eatery has established an exclusive, secret location where only a select few are able to eat. It is by invitation only, and the offerings are of a quality surpassing the finest food and
        drink otherwise available in this corner of the world.
    - - 49–50
      - Information has come to light that will tarnish the legacy of a well-loved, long-dead hero.
    - - 51–52
      - A thief with a romantic streak has been stealing into the rooms of their targets in the dead of night. They take nothing, wake no one, and leave behind a love letter and flower.
    - - 53–54
      - An expedition into dwarven ruins found evidence of a ritual predating living memory. Findings suggest dwarves used to be quite tall (which made cave-living difficult) and lacked facial hair. Elves
        were short (and possessed long, luxurious beards). It seems the dwarves performed a ritual to steal the elves’ shortness. It worked, and they took the beards too.
    - - 55–56
      - A local tavern, that has just raised its prices, has been watering down their beverages to stretch their supply.
    - - 57–58
      - A member of the local leadership is romantically involved with someone of criminal repute.
    - - 59–60
      - A member of the local leadership is involved in private dealings with an outside entity.
    - - 61–62
      - A tax collector has been charging more than necessary, and has engaged the services of ruffians to ‘encourage’ those who are uncooperative.
    - - 63–64
      - An abandoned building in the settlement’s worst area is the home to strange creatures.
    - - 65–66
      - The settlement has recently experienced a lot of bad weather, which is divine punishment for some wrongdoing.
    - - 67–68
      - The settlement has experienced a stretch of unusually perfect weather, the result of a dark ritual that must soon be paid for.
    - - 69–70
      - The settlement’s defenses have a fatal flaw.
    - - 71–72
      - A recent disease outbreak was caused by magical meddling.
    - - 73–74
      - Someone in the settlement is selling illicit goods or using objectionable materials.
    - - 75–76
      - A well-known, well-liked local whom everyone thought was born and raised in the settlement may actually be of foreign stock.
    - - 77–78
      - The settlement is considering ditching traditional gold and silver currency in favour of governmentcreated promissory notes.
    - - 79–80
      - A portion of taxes collected are being used for nefarious purposes.
    - - 81–82
      - Someone in the settlement has opened a gateway to another plane and lacks the knowledge to close it.
    - - 83–84
      - (Village Only) A new power is claiming rights of fealty over the village, at the culmination of a long conflict.
    - - 85–86
      - (Not Village) A few of the guards have been charging traveling merchants more than usual for entrance into the settlement.
    - - 87–88
      - (City/Capital Only) A local shop or service owner who is not part of a guild is stealing trade secrets from those who are.
    - - 89–90
      - (City/Capital Only) A nearby nation or powerful entity has spies in the city.
    - - 91–92
      - (Capital Only) A foreign power has spies in the capital.
    - - 93–94
      - (Capital Only) Two noble families are feuding due to foolish decisions made by their children.
    - - 95–96
      - (Capital Only) The leadership is just a puppet of another entity.
    - - 97–98
      - (Capital Only) The person within the leadership with the most power may themselves be an agent of outside forces.
    - - 99–100
      - (Capital Only) An underground rebellion is forming to overthrow the leadership, threatening the security of the entire region.
