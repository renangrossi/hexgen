  ss.p23.fervency-of-local-following:
    title: Fervency of Local Following
    die: d20
    page: 23
    rows:
    - - 1–3
      - Unseen. To those outside the following, it is not clear that the group exists.
    - - 4–7
      - Quiet. Adherents to the faith are inconspicuous, unless one knows what to look for (perhaps particular gestures, items of clothing, or phrases).
    - - 8–12
      - Subtle. Followers of the faith may be identifiable, but remain very reserved.
    - - 13–16
      - Moderate. The pious are confident and unafraid to display their faith openly, but do not encroach upon the wider populus uncalled for.
    - - 17–19
      - Fervent. Followers are outspoken, with little or no fear of reproach. They may sing or speak to the masses.
    - - '20'
      - Zealous. Adherents are utterly and unthinkingly devout, forcing their doctrine upon their surroundings and peers, or taking actions that further their cause regardless of personal cost. Though typically
        seen as negative, this could also be a positive, such as a church of light rising up in an evil kingdom, helping those in need, even if it puts themselves in peril. V is ib ilit y What is shown
        above represents what can be seen by an outsider visiting the trading post. Each and every person who holds a faith will express it in their own way, but what is represented here is generally how
        bold that show of faith is. The overall degree of veneration may be quiet, but there may be a few adherents that, while very passionate, may keep it quiet when in public. Why would they do this?
        That’s part of your trading post’s story.
  ss.p23.alignment-of-the-faith:
    title: Alignment of the Faith
    die: d10
    page: 23
    rows:
    - - '1'
      - Evil
    - - 2–5
      - Neutral
    - - 6–10
      - Good
  ss.p24.recent-history-regularly-frequented-bord:
