    - - '2'
      - Glory. Prestige and triumph.
    - - '3'
      - Refuge. Welcome and safety.
    - - '4'
      - Fear. Dread and insignificance.
    - - '5'
      - Grace. Beauty and elegance.
    - - '6'
      - Wealth. Luxury and opulence.
    - - '7'
      - Piety. Righteousness and ascendence.
    - - '8'
      - Practicality . Utility and function.
