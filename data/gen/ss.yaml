      - Throughout history, the peoples of the world have continuously learned, adapted, and changed their minds about how to plan and structure the places in which they are going to live. You can consider
        this when thinking about your capital’s layout. Older cities may be more disorganized, developing organically with little thought given to creating
    - - '5'
