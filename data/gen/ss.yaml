  ss.p235.district-entry:
    title: District Entry
    die: d12
    page: 235
    rows:
    - - 1–3
      - Open. Entrance to the district is unrestricted. (+0 to district crime roll)
    - - 4–6
      - Lightly Guarded. The district entrance has a token guard presence. (+1 to district crime roll)
    - - 7–9
      - Guarded. The district entrance has a strong guard presence. (+2 to district crime roll)
    - - 10–11
      - Gated & Guarded. The district entrance is barred by a gate with guards. (+3 to district crime roll)
    - - '12'
      - Gated & Guarded with Toll. The district entrance is barred by a guarded gate, and a fee is charged for entry or exit (or both), which may be based on personage, method of transport, or goods being
        transported. (+4 to district crime roll) [Reroll if ‘Slums’ or ‘Upper Class’ District]
  ss.p235.district-crime:
    title: District Crime
    die: d20
    page: 235
    rows:
