  ss.p213.stewardship:
    title: Stewardship
    die: d20
    page: 213
    rows:
    - - '1'
      - Neglected. All of the fundamental elements of the capital are being ignored, or are unable to be addressed. (-7 to general condition roll) (-13 to population wealth roll) (-9 to law enforcement
        roll)
    - - 2–4
      - Minimal. The fundamental elements of the capital are being tended to, but at the bare minimum. This may be because of inexperienced leadership, misplaced priorities, lack of resources, or simple
        laziness, to name a few possible reasons. (-4 to general condition roll) (-6 to population wealth roll) (-5 to law enforcement roll)
    - - 5–10
      - Passing. The capital’s fundamental elements are taken care of to a serviceable degree, though an inequality of attention is noticeable, and some areas seem to take priority over others. It could
        be that resources are not plentiful enough to cover everything, but those in charge are doing the best they can. (-1 to general condition roll) (-3 to population wealth roll) (-2 to law enforcement
        roll)
    - - 11–16
      - Adequate. The capital’s fundamental elements are all taken care of relatively competently, but some room for improvement still exists. Lack of resources or involvement in more pressing matters,
        such as external conflicts or disaster management, are possible explanations. (+0 to general condition roll) (+0 to population wealth roll) (+0 to law enforcement roll)
    - - 17–19
      - Managed. The capital’s fundamental elements are all accounted for and well attended to. Whoever is responsible is doing an admirable job. (+1 to general condition roll) (+3 to population wealth
        roll) (+4 to law enforcement roll)
    - - '20'
      - Disciplined. The capital’s fundamental elements are firmly in hand, providing what it needs to perform at peak functionality. There is little to no room for improvement. Whoever is managing things
        is doing so expertly. (+5 to general condition roll) (+6 to population wealth roll) (+8 to law enforcement roll)
  ss.p214.general-condition:
    title: General Condition
    die: d20
    page: 214
    rows:
    - - '1'
      - Squalid. The capital is in a deplorable state. Things are falling apart, filthy and, to anyone who doesn’t live there, seems positively unlivable. Most of the buildings, if not all, are likely a
        disgrace, or in terrible need of help. (-2 to district condition rolls)
    - - 2–4
      - Dilapidated. Things are dirty and in a widespread state of disrepair, though some token effort may have been made at cleanliness. Streets are probably packed dirt or broken stone. They may be uneven,
        rutted or muddy. Structures have likely received similar low levels of care, though there could be some disparity. (-1 to district condition rolls)
    - - 5–12
      - Decent. The capital is passable. While not offensive to the senses of one that is well traveled, it could still be off-putting to those with lofty expectations. Structures may not be aesthetically
        pleasing, but are generally functional. (+0 to district condition rolls)
    - - 13–19
      - Impressive. The capital is well taken care of, and cleanliness is clearly a priority. Structures are maintained, though signs of wear may still be apparent. It feels lived-in, but of a respectable
        quality in every regard. (+1 to district condition rolls)
    - - '20'
      - Magnificent. The capital is incredible. Cleanliness, maintenance and structural integrity are all of the highest standard. Loving attention seems to have been lavished on as many aspects as is possible.
        (+2 to district condition rolls)
  ss.p214.fortification:
    title: Fortification
    die: d20
    page: 214
    rows:
    - - '1'
      - Unfortified. The capital is exposed on all sides, save for any barriers created by the presence of buildings or natural land formations. There may still be gates across main thoroughfares, but no
        fortification of substance surrounds the city. (-5 to disposition roll)
    - - 2–8
      - Lightly Fortified. The capital has bare-bones fortifications which are a minimal obstacle for enemy forces, but are adequate to deter wild animals. A simple gate, which can be barred in the evenings,
        sits astride the main road. (+1 to disposition roll)
    - - 9–15
      - Fortified. The capital is surrounded by a substantial wall of wood or stone. The wall is able to be patrolled by guards on a raised walkway. Visitors to the capital pass through a main gate that
        can be barred in the evenings. A few watch towers may be placed around the city, though are likely sporadic. (+3 to disposition roll)
    - - 16–19
      - Heavily Fortified. The capital is surrounded by a heavy wall of wood or stone with several watchtowers built along its length. The gate is double-thickness and reinforced with metal bands. There
        are additional watchtowers built at various points throughout the surrounding countryside. (+5 to disposition roll)
    - - '20'
      - Extremely Fortified. The capital is surrounded by an imposing wall of wood or stone, with many fully-staffed watchtowers at regular intervals along its length. The gate is double-thickness, reinforced
        with metal bands, augmented with a portcullis, and is always manned. A supplementary wall of wood or stone encompasses the surrounding countryside, with its own watchtowers. Nothing goes in or out
        without the watch’s knowledge or permission. (+7 to disposition roll)
  ss.p215.market-square:
    title: Market Square
    die: d6
    page: 215
    rows:
    - - 1–2
      - Tight. Only room for a few vendor stalls.
    - - 3–4
      - Ample. Room for a fair number of vendor stalls.
    - - 5–6
      - Spacious. Room for lots of vendor stalls.
  ss.p215.vendor-stall-acquisition:
    title: Vendor Stall Acquisition
    die: d6
    page: 215
    rows:
    - - '1'
      - First Come, First Served - No Fee. Merchants line up prior to market day. Those at the front of the line are given the spaces. No fees are charged.
    - - '2'
      - First Come, First Served - Fee. Merchants line up prior to market day. Those at the front of the line are given first pick of the available stall spaces, provided they can pay the fee for the day.
    - - '3'
      - Lease. Merchants pay in advance (sometimes far in advance) for the right to a space in the market square.
    - - '4'
      - Bid. Prior to market day, the spaces are auctioned off.
    - - '5'
      - Sponsored Referral Only - No Fee. A stall may only be acquired if the vendor is sponsored by a citizen of the capital. The sponsor assumes responsibility for the vendor. The space is granted once
        proof of sponsorship is submitted and approved.
    - - '6'
      - Sponsored Referral Only - Fee. A stall may only be acquired once the vendor pays a fee, and the vendor is sponsored by a citizen of the capital. The sponsor assumes responsibility for the vendor.
        The space is granted once payment and proof of sponsorship is submitted and approved.
  ss.p215.overflow:
    title: Overflow
    die: d4
    page: 215
    rows:
    - - '1'
      - Banned. Excess vendors are not allowed to set up stalls outside the town. City guards will enforce this. (+1 to law enforcement roll)
    - - '2'
      - Unpatrolled. Excess vendors are allowed to set up stalls but, as the city watch do not patrol or monitor these areas, the risk is higher. The spaces available are unkempt.
    - - '3'
      - Monitored. Excess vendors are allowed to set up stalls, and the city watch patrols through regularly, but the areas themselves are less-maintained and traffic is lighter.
    - - '4'
      - Encouraged. Excess vendors are encouraged to set up stalls outside the capital, if they are unable to get a spot in the square. There are maintained areas available for use, and are provided on
        a first-come, first-served basis. When in use by vendors, this area is regularly patrolled, if law enforcement personnel can be spared.
  ss.p215.underground-passages:
    title: Underground Passages
    die: d20
    page: 215
    rows:
    - - 1–4
      - None. There are no significant passages underneath the capital.
    - - 5–14
      - Sewers. A network of drains, pipes, and trenches lies beneath the capital. Base the sewer’s condition upon that of the settlement, if they were built concurrently. They may pre-date the current
        capital city.
    - - 15–17
      - Natural Caves. Below the capital, natural cave systems can be found that may, or may not, have been discovered yet.
    - - 18–19
      - Tunnels. A series of tunnels exist beneath the capital. This could be for maintenance, defensive, or clandestine purposes and may, or may not, have been purpose-built for the current settlement.
        They could potentially have been dug by enemy forces, either recently or long ago.
    - - '20'
      - Forgotten Crypts. Old burial chambers and tombs are housed deep beneath the capital, likely unknown to the general populace.
  ss.p216.leadership:
    title: Leadership
    die: d100
    page: 216
    rows:
    - - 1–15
      - Elected Council. Prominent members of the community were chosen to lead the capital collectively.
    - - 16–30
      - Governor. The locals democratically voted for their current leader.
    - - 31–45
      - Hereditary. A non-elected leader is in power, by virtue of their bloodline.
    - - 46–60
      - Merchant Monarch. The wealthiest merchant in the capital leads by default. (Regardless of population wealth, they are, at least, considered wealthy.) (When rolling districts, choose Merchant District
        for one of them)
    - - 61–75
      - Military Officer. The capital is controlled by a current or ex-leader of a military group. They may have been elected or taken control by force, such as part of a coup. (+1 to law enforcement roll)
    - - 76–90
      - 'Oligarchy. A few top individuals hold sway, collectively, over the capital. [Roll 1d4]: 1: merchants (plutocracy); 2: mages (magocracy); 3: priests (theocracy); 4: other small group. (When rolling
        districts, choose one that best fits your leadership)'
    - - 91–99
      - Underworld or Criminal Enterprise. A criminal, or group of criminals, either publicly, or privately, controls the capital. -2 to general crime roll) (Roll on organized crime table regardless of
        general crime table result)
    - - '100'
      - Anarcho-Syndicalist Commune. The members of the capital take turns as a sort of executive officer for the week.
  ss.p216.leadership-unity:
    title: Leadership Unity
    die: d20
    page: 216
    rows:
    - - '1'
      - Rank Animosity. There is open and blatant hostility. Outbursts, threats, and physical violence are possible (or, even, common).
    - - 2–3
      - Thinly-Veiled Discord. There is barely disguised hostility. Muttering, sarcasm, and spiteful comments are likely, but blatant actions, such as yelling or violence, has not occurred.
    - - 4–6
      - Strained. Tension can be felt in the room, and overly polite disagreements are frequent.
    - - 7–9
      - Uneasy. Something feels off, but it may just be that someone is having a bad day.
    - - 10–14
      - Calm. Things are peaceful.
    - - 15–17
      - Close-Knit. Communication is open. Disagreements are constructive.
    - - 18–19
      - Accord. Most of those involved are on the same wavelength, and can often anticipate one another.
    - - '20'
      - United. The bond between those in power is pretty ironclad. They are all of one mind, wholly and equally committed to one vision.
  ss.p217.governing-priority:
    title: Governing Priority
    die: d10
    page: 217
    rows:
    - - '1'
      - Humanitarian. The leadership’s goal is to truly do right by its people. Care and compassion are their highest priorities.
    - - '2'
      - Control. Absolute control is of utmost importance. All decisions are made with the aim of maintaining an iron grip on the capital and its people. (+1 to military force roll)
    - - '3'
      - Isolationist. The capital has no desire to get involved in the dealings of other sovereign entities. They are open and clear about this.
    - - '4'
      - Expansionist. The capital wishes to expand its reach, bringing more regions into itself. (+1 to military force roll)
    - - '5'
      - Cloak & Dagger. The government heavily favors pursuing its goals through the liberal use of secrecy and intrigue. These operations could be secret to all but the inner circle, or the use of these
        types of operations may be blatant and open within the governing body itself. (When rolling for spy network size, 1-16 = Few)
    - - '6'
      - Economic. The capital’s leadership concerns itself largely with economic prosperity, with the further acquisition of wealth and resources the deciding factor in matters of state. (When rolling districts,
        choose ‘Market District’ as one of them)
    - - '7'
      - Enlightenment. The leadership prides itself on intelligence and wisdom, typically making choices that preserve culture and heritage, or reinforce the community’s access to knowledge and understanding.
        (When rolling districts, choose ‘Scholar District’ as one of them)
    - - '8'
      - Industry & Innovation. Those in charge are intent on staying ahead of the curve, pursuing and prioritizing modernization and new practical ideas in an effort to make the capital, and its people,
        more productive and efficient. (When rolling districts, choose ‘Industrial District’ as one of them)
    - - '9'
      - Release. Those at the top do not actually want to be in power. Perhaps they were elected and carried to the position by momentum, or they inherited it from birth. They might have simply been an
        individual (or group) the people rallied behind, but never desired to rule. Now, they just want out.
    - - '10'
