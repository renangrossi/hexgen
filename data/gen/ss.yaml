  ss.p166.hired-help-size:
    title: Hired Help Size
    die: d12
    page: 166
    rows:
    - - 1–6
      - Individual Person. The hired help is a single person hiring out their services.
    - - 7–10
      - Team. The hired help is a team of individuals who work together.
    - - 11–12
      - Guild. An organized guild is hiring out their services. When hired, a portion of the guild’s members handle the job, not the entire guild (unless the job is very large).
  ss.p167.location-notability:
    title: Location Notability
    die: d20
    page: 167
    rows:
    - - '1'
      - Generous Spirit. The location owner is known in the community for their generosity (this could be financial, but could also be with their time, knowledge, or resources).
    - - '2'
      - Top-Notch Marketing. All around the city you can see signage, or hear people mentioning, the location.
    - - '3'
      - Excellent Offerings. Whatever product or service the location offers, it’s good enough to draw notice.
    - - '4'
      - Vested Interests. A third party (not the shopkeeper or an employee) has a stake in whether this location is successful, and has done something to ensure the populus know about it.
    - - '5'
      - Unique Offering. This location has a product or service that no one else in the city has.
    - - '6'
      - More-Than-Meets-the-Eye. This location may seem to be one thing, but the right people know what else is there.
    - - '7'
      - Meeting Place. The establishment is in a particular location which is a prime landmark for people to easily meet. This tends to generate business by proximity.
    - - '8'
      - Entertaining Service. Something about the folk that work here is very entertaining. Perhaps they’re funny, or maybe they do demonstrations, or even have a bard who plays there regularly.
    - - '9'
      - Coercion. Customers, who might otherwise go somewhere else, are pressured into coming here instead. This could be the owner’s doing, but could also be the work of another interested party.
    - - '10'
      - Favoritism. Certain people are given particularly good service here, and it incentivizes them to frequent this location.
    - - '11'
      - Superstition. Those who frequent this location do so out of the belief that if they don’t, something will (or won’t) happen.
    - - '12'
      - History. This location is notable for its links to local history. Perhaps it belongs to a family with a particular reputation? Maybe it has ties to events from long ago?
    - - '13'
      - Rumors. Something intriguing has been heard about this place that, for some reason, has piqued visitor’s curiosity.
    - - '14'
      - Expansion. This place has grown recently.
    - - '15'
      - Important Person. Someone directly involved with this location (owner, employee, etc) is a major figure in the community.
    - - '16'
      - Nearby Curiosity. There is something in very close proximity that draws attention, thereby increasing foot traffic.
    - - '17'
      - Local Loyalty. People who live nearby know this place and stick to it out of a deep-seated loyalty, even if there would seem to be better alternatives.
    - - '18'
      - Exciting. There always seems to be something thrilling going on here, so those seeking to be free of boredom show up in droves.
    - - '19'
      - Organization Affiliation. Association with certain people has generated traffic to this location.
    - - '20'
      - Magic. Some form of magic plays a role in what is drawing people here. It could be on purpose or accidental, innocent or malicious.
  ss.p168.quality:
    title: Quality
    die: d12
    page: 168
    rows:
    - - 1–4
      - Poor. The location is a substandard version of what is typically expected. Its offerings are likely limited, or of bad quality. The location itself may be in disrepair, dirty, or have any number
        of other issues present.
    - - 5–10
      - Good. The location is a standard version of what is typically expected. Its offerings are likely not terrible, but often not particularly remarkable either (though sometimes there may be exceptions).
        The location itself is likely in a serviceable state, though probably not flawless.
    - - 11–12
      - 'Fine. The location is an exceptional version of what is typically expected. Its offerings are likely extensive, or of surpassing quality. The location itself is likely remarkable in some way (or,
        possibly, many ways) such as being very clean or well-built. P o o r / F ine S er v ic e N am es ? Here are some suggestions for service names whether they’re poor/fine. Barber: Dirt Knife/Coiffeur
        Bathhouse: Tubs/Private Baths Doctor/Apothecary: Sawbones/Physician House of Leisure: Den of Leisure/Hall of Leisure Inn: Tents or Hostel/Lodge Club: Stage/Theater Soothsayer: Fortune Teller/Diviner
        Stable: Stalls/Livery Tavern: Pub/Taphouse'
  ss.p168.place-of-worship-size:
    title: Place of Worship Size
    die: d20
    page: 168
    rows:
    - - '1'
      - Secret. The place of worship’s size is unclear, as the location is not publicly known.
    - - 2–5
      - Altar. A small shrine or, perhaps, a tiny shack, usually evincing some various items or images relating to that which the faith venerates.
    - - 6–10
      - Oratory. A modest building with seating for attendees, appointed with various items or images relating to that which the faith venerates.
    - - 11–16
      - Sanctuary. A large, well-appointed structure, able to comfortably accommodate up to a few hundred people.
    - - 17–19
      - Temple. A grand building, replete with elements like high ceilings, plush furnishings, and other impressive ornamental and/or architectural features. It can hold nearly a thousand attendees.
    - - '20'
      - Great Temple. An awe-inspiring structure, devoted to that which it venerates. No expense was spared in its construction. It might display such elements as stunning frescos, elaborate stained-glass
        scenes, and towering, gilded statues. Walking into a great temple is a rare and striking experience for those who do not live near one.
  ss.p169.fervency-of-local-following:
    title: Fervency of Local Following
    die: d20
    page: 169
    rows:
    - - '1'
      - Unseen. To those outside the following, it is not clear that the group exists.
    - - 2–5
      - Quiet. Adherents to the faith are inconspicuous, unless one knows what to look for (perhaps particular gestures, items of clothing, or phrases).
    - - 6–10
      - Subtle. Followers of the faith may be identifiable, but remain very reserved.
    - - 11–16
      - Moderate. The pious are confident and unafraid to display their faith openly, but do not encroach upon the wider populus uncalled for.
    - - 17–19
      - Fervent. Followers are outspoken, with little or no fear of reproach. They may sing or speak to the masses.
    - - '20'
      - Zealous. Adherents are utterly and unthinkingly devout, forcing their doctrine upon their surroundings and peers, or taking actions that further their cause regardless of personal cost. Though typically
        seen as negative, this could also be a positive, such as a church of light rising up in an evil kingdom, helping those in need, even if it puts themselves in peril.
  ss.p169.alignment-of-the-faith:
    title: Alignment of the Faith
    die: d10
    page: 169
    rows:
    - - '1'
      - Evil
    - - 2–5
      - Neutral
    - - 6–10
      - Good
  ss.p169.guild-member:
    title: Guild Member?
    die: d6
    page: 169
    rows:
    - - 1–4
      - No.
    - - 5–6
      - Yes.
  ss.p170.recent-history:
    title: Recent History
    die: d20
    page: 170
    rows:
    - - '1'
      - Some element of city-sponsored construction collapsed, and several people have been killed.
    - - '2'
      - A gang of hooligans have started making trouble around the market.
    - - '3'
      - Adventurers visiting the city started a bar brawl, and the tavern they were in was burned down.
    - - '4'
      - An inventor in the city came up with an incredible contraption that has dramatically impacted the lives of the city’s residents.
    - - '5'
      - Ongoing heavy thunderstorms or blizzards are wracking the city.
    - - '6'
      - A visitor to the city brought something with them that has started a new craze or fashion.
    - - '7'
      - The city received word recently that a representative from a neighboring kingdom will be visiting. They should be arriving any day.
    - - '8'
      - Some form of illness has been sweeping through the city, and none are sure what it is, or how it started.
    - - '9'
      - The city’s main gate has broken and needs extensive repairs. In the meantime, the gate is open and additional guards are needed to staff it at all times. If guards are not available, citizens may
        have been called.
    - - '10'
      - A group of citizens are calling for a new form of leadership. How do others in the city respond?
    - - '11'
      - An item of local cuisine has suddenly been rendered inedible. Whatever is causing the problem seems to be persisting.
    - - '12'
      - An unusual, and intriguing, contest is being held by a major figure in the community. Tryouts began a week ago, but none that have participated have mentioned what it is, whether or not they succeeded,
        or what’s next.
    - - '13'
      - A particular resource, that is very important to the city, has had fantastic yield.
    - - '14'
      - Large amounts of adventurers frequenting the city, lately, has caused massive inflation.
    - - '15'
      - Someone within the city has recently gained incredible fame.
    - - '16'
      - Illegal substances, or goods, have been making appearances around the city, but their origin remains undiscovered.
    - - '17'
      - Taxes have just been raised.
    - - '18'
      - Taxes have just been abolished.
    - - '19'
      - A neighboring kingdom has been attacked. The city leadership is deciding what, if anything, to do about it.
    - - '20'
      - A deity has made a physical appearance in the city.
  ss.p171.noteworthy-official:
    title: Noteworthy Official
    die: d20
    page: 171
    rows:
    - - '1'
      - Adviser. Second in command of the city. Can be an official, or unofficial, position.
    - - '2'
      - Ambassador. Regularly acts as a representative for the city/nation when traveling abroad.
    - - '3'
      - Catchpole. Catches and brings in debtors.
    - - '4'
      - Champion. Ready to stand in for the city leadership for any martial matters, either ceremonially or officially.
    - - '5'
      - Clerk. Recordkeeper for the city.
    - - '6'
      - Exchequer. Responsible for taxes.
    - - '7'
      - Guildmaster. Oversees one of the official (or underground) guilds, or factions, within the city.
    - - '8'
      - Herald. Responsible for disseminating official edicts, and other news, to the general populace. If serving in a courtly capacity, bears responsibility for knowing the names and titles of important
        individuals, and announcing them, when appropriate.
    - - '9'
      - High Priest/Druid. The primary representative of the faithful to the city leadership.
    - - '10'
      - High Mage. The representative of the practitioners of arcane arts to the city leadership.
    - - '11'
      - Jailer. In charge of confining prisoners.
    - - '12'
      - Judge. Decision-maker in legal matters.
    - - '13'
      - Liner. Determines property boundaries.
    - - '14'
      - Master of Intelligence. Responsible for seeking and utilizing information vital for city/nation’s security.
    - - '15'
      - Master of Revels. Lead organizer of festivals and special events.
    - - '16'
      - Master of Stores. Oversees the city’s stores of supplies, such as grain or building materials.
    - - '17'
      - Master of Trade. Responsible for the management of imports and exports.
    - - '18'
      - Master of the Treasury. Responsible for the city’s expenditures and paying contracts and debts.
    - - '19'
      - Master of the Wild. Surveys the surrounding areas, mapping the wilderness, looking for monsters or other threats, and regulating hunting.
    - - '20'
      - Roadwarden/Dockwarden. In charge of some, or all, of the city’s transportation systems.
  ss.p171.officials-competence:
    title: Official’s Competence
    die: d6
    page: 171
    rows:
    - - '1'
      - Corrupt. Taking advantage of the position for personal gain.
    - - 2–3
      - Incompetent. Doesn’t truly understand how to execute the position.
    - - 4–5
      - Committed. Utterly committed to the job, truly feeling it is of vital importance.
    - - '6'
      - Overqualified. Based on skills and experience, ought to be in a higher, or more challenging, position.
  ss.p171.beneath-the-surface:
    title: Beneath the Surface
    die: d12
    page: 171
    rows:
    - - '1'
      - Pack. A pack of particularly feral animals roams the city.
    - - '2'
      - Monster. A monster lurks somewhere in the city.
    - - '3'
      - Markings. Strange markings have been showing up around the city.
    - - '4'
      - Fight Club. A fight club has started somewhere in the city, and may be gaining more participants.
    - - '5'
      - Secret. Some portion of the populace is not as they seem.
    - - '6'
      - Outside Contact. Someone in the city is in regular communication with an interesting external contact.
    - - '7'
      - Tampering. Someone is interfering with forces best left alone.
    - - '8'
      - Unsafe. There is a structural problem with a location within the city (or, possibly, the land, or environment, it is built on). The longer it goes unnoticed, the more damaging it could be.
    - - '9'
      - Parties. A guerilla party scene has been emerging within the city, with semi-frequent, secret, invitation-only parties being held at ever-changing locations.
    - - '10'
