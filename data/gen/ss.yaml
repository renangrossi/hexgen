      - None. No one lives in this district. [If ‘Slums’ or ‘Upper Class’, reroll]
    - - 6–9
      - Limited. Only a few live here; the district may be predominantly a place of business or functionality, or perhaps people avoid living here for another, less innocent reason.
    - - 10–11
      - Moderate. A fair amount of the buildings in the district house residents.
    - - '12'
      - Extensive. A significant amount of the district’s buildings are housing for residents. W h at if N o D is t r ic t s H av e H o u s ing? ! Within your capital, there is always space that is not
        part of any particular district; it is just considered the ‘general area’ of the capital. If none of your districts have housing, this is where your people would likely live.
