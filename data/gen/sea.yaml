    - Sky
    - Effect
    rows:
    - - '1'
      - Stormy
      - Storm check (§8). Visibility −1. Navigate DC 18. No vessel encounters; creatures still come. In harsh seas, below, it is a hurricane.
    - - 2–5
      - Fair
      - —
    - - '6'
      - Excellent
      - Visibility +1. Roll the next Weather with ADV.
    die: d6
    note: 'source: Source: Western Reaches GM’s Guide pp. 40, 43'
