      - Junk or galleon
      - Sailors, 1d4 marines. Trade, or pay to pass.
    - - '2'
      - Fishers or whalers
      - Rowboat or sloop
      - 1d6+2 fishermen or whalers. News, fish, a rumor.
    - - '3'
      - Navy patrol
      - Sailboat or galleon
      - 2d6 marines, 1d4 gunners, a captain. Tolls or arrests.
    - - '4'
      - Pirates
      - Sloop or sailboat
      - 1d6+1 pirates, a captain. Hostile unless outmatched.
    - - '5'
      - Raiders
      - 1d6 longboats near a coast
      - 1d6+2 freebooters each.
    - - '6'
      - Ghost ship
      - Any, rotting
      - 1d6+1 drowned crew; 2-in-6 their captain.
