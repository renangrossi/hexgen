  sea.fast-travel-between-hexes-already-sailed:
    title: Fast Travel · between hexes already sailed
    page: null
    cols:
    - Voyage
    - Rations each
    rows:
    - - null
      - A few days
      - 1–3
    - - null
      - About a week
      - '3'
    - - null
      - Several weeks
      - 3 a week
    note: 'source: Roll 2d6 days per week of voyage. One PC may make an INT check (fishing) for the group; on a failure, short of rations means arriving drained. Source: Western Reaches GM’s Guide p. 45'
  sea.uncharted-hex-1-for-each-open-sea-in-a-r:
    title: Uncharted hex · +1 for each Open sea in a row
    page: null
    cols:
    - The hex holds…
    rows:
    - - '2'
      - Deep water. The kraken’s hex (§11). The next encounter check here is automatic, and it comes.
    - - 3–6
      - Open sea.
    - - '7'
      - Open sea and a find — d12 below.
    - - 8–9
      - A sail. A vessel holds this hex (§7, Vessel).
    - - 10+
      - Island — d8 below.
    die: 2d6
    note: 'source: Anything but Open sea resets the bonus. Source: Curse of the Emerald Sea p. 8'
    review: 2 results uncovered
  sea.finds:
    title: Finds
    page: null
    cols:
    - On the water
    rows:
    - - '1'
      - Someone clinging to debris. 1-in-6 hostile.
    - - '2'
      - A mirage — an island or a sail that is not there.
    - - '3'
      - A sunken mast breaks the surface. Undead crew and treasure below.
    - - '4'
      - A floating body. 1-in-6 it is a creature.
    - - '5'
      - A voice sings a shanty, nowhere to be seen. Heard every night after.
    - - '6'
      - A message in a bottle.
    - - '7'
      - 'Clear skies: no Navigate check tomorrow.'
    - - '8'
      - A small package on a fishing line.
    - - '9'
      - A castaway on a raft. Joins the crew if saved.
    - - '10'
      - 'A floating crate: 1d4 rations and one treasure.'
    - - '11'
      - A blue hole — a drowned cave with two treasures.
    - - '12'
      - 'A tiny atoll: rum, gold and one treasure.'
    die: d12
    note: 'source: Treasure → §13. Source: Curse of the Emerald Sea p. 11'
  sea.island:
    title: Island
    page: null
    cols:
    - Island
    - Here
    rows:
    - - '1'
      - Volcano
      - Ash beaches, hot springs. 1-in-6 it erupts.
    - - '2'
      - Jungle
      - Fresh water. Hunt and forage as on land.
    - - '3'
      - Smuggler’s cove
      - Lagoon and cave of rum and gold. 1-in-6 the smugglers are home.
    - - '4'
      - Mountain peak
      - From the top, the next island needs no Navigate check. 1-in-6 a cult at the summit.
    - - '5'
      - Mangroves
      - Mud crabs, crocodiles, insects. 1-in-6 a hermit gone wild.
    - - '6'
      - Oasis
      - Palms, a spring, coconuts. Refill all water.
    - - '7'
      - Village
      - A fishing hamlet (§14). Roll reaction (§13).
    - - '8'
      - Ruin
      - A drowned temple or a tower. A dungeon below; two treasures.
    die: d8
    note: 'source: Source: Curse of the Emerald Sea pp. 14–15'
  sea.sea-event:
    title: Sea Event
    page: null
    cols:
    - Event
    rows:
    - - '3'
      - Signs of land. Birds, drift, a scent. Land is a day off.
    - - '4'
      - Boat trouble. Fire, a leak, rats, shipworm, a torn sail. Repair fixes it.
    - - '5'
      - Crew trouble. Sickness, drink, sabotage, a man overboard. Crew morale check.
    - - '6'
      - Shallow life. Seals, turtles, a shoal. Free Fish task.
    - - '7'
      - Vessel sighted. Roll Vessel, below, then reaction.
    - - '8'
      - Hazard. Freak wave, reef, sandbar, whirlpool, wreck. 2d6 to the boat if it beats her AC.
    - - '9'
      - Clear sailing.
    - - '10'
      - Island (§6). Land or sail on.
    - - '11'
      - Deep life. Dolphins, whales, flying fish. Free Fish task.
    - - '12'
      - Weather turns. The day becomes Stormy.
    - - '13'
      - Sea folk. Roll Sea folk (§12). Reaction; they know these waters.
    - - 14–15
      - Wind dies. Calm for the rest of the day.
    - - '16'
      - Pirates give chase (§10, Chase).
    - - 17–18
      - Dangerous creature. Roll §11 until one of LV 5+ comes up. Over reefs, wrecks or drowned land, roll Strange waters (§11) instead.
    die: 3d6
    note: 'source: Source: Overland Hexcrawl §24.5 · When Sea Is Calling p. 51'
