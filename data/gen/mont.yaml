    title: Wandering Encounters on This Level
    die: d10
    page: 55
    rows:
    - - '1'
      - 2 GOBELIN WARRIORS (AC 12, HD 1, Atk +1, Dmg 1d6 spear, Shock 2/13, Skill +0, Morale 9, Instinct 3) are on patrol; if they detect intruders, they will immediately flee back to the closer of room
        13 or room 19 in order to raise the alarm.
    - - '2'
      - The nearest glowing blue sun-glyphs briefly flare to a blindingly bright intensity; those within 30 feet must make a Physical save or be blinded for 1 turn and gain 1 System Strain from the alien
        radiance.
    - - '3'
      - A boneless SOFT THRALL slowly oozes down the hallway, searching for a skeleton to wrap around and animate. It ignores intruders; if attacked, it will wetly beg for mercy in the Deepfolk tongue.
    - - '4'
      - A swarm of rats rushes through the area, feasting on any corpses present but ignoring live creatures capable of resistance. If attacked, they flee noisily.
    - - '5'
      - 1d4+2 GOBELIN WARRIORS (AC 12, HD 1, Atk +1, Dmg 1d6 spear, Shock 2/13, Skill +0, Morale 9, Instinct 3) are on their way back to room 19 with a stolen sheep on a pole.
    - - '6'
      - A mastiff-sized CAVE SPIDER (AC 13, HD 2, HP 10, Atk +3, Dmg 1d6+Physical save or be Mortally Wounded by poison, No Shock, Skill +1, Morale 9, Instinct 4) starts stalking the PCs, hiding until one
        is wounded or weakened. It will flee after it downs a victim, and will press the attack only if the PCs try to steal its kill.
    - - '7'
      - A haggard peasant has escaped his gobelin captors and is trying to find a way out. He knows of the gobelin barracks in room 19 and the prisoners in room 17. He will not fight, but only seeks to
        flee.
    - - '8'
      - 1d4+2 GOBELIN WARRIORS (AC 12, HD 1, Atk +1, Dmg 1d6 spear, Shock 2/13, Skill +0, Morale 9, Instinct 3) are on their way out of the Deep to raid the surface.
    - - '9'
      - A sudden fierce gust from the ventilation shafts blows out torches and unprotected lanterns.
    - - '10'
      - The PCs overhear echoes of the nearest inhabitants quarreling, fighting, or celebrating.
  mont.p59.wandering-encounters-on-this-level:
    title: Wandering Encounters on This Level
    die: d8
    page: 59
    rows:
    - - '1'
      - 1d4+2 PAGAN RAIDERS (AC 12, HD 1, Atk +1, Dmg 1d6 spear, Shock 2/13, Skill +1, Morale 9, Instinct 3) are looking for Sighild, and might parley for knowledge of her whereabouts.
    - - '2'
      - The party’s intended path forward is blocked by a mass of damp, swollen fungus. It extinguishes fire instantly, and will take 1d4 turns to chop through.
    - - '3'
      - A mastiff-sized CAVE SPIDER (AC 13, HD 2, HP 10, Atk +3, Dmg 1d6+Physical save or be Mortally Wounded by poison, No Shock, Skill +1, Morale 9, Instinct 4) starts stalking the PCs, hiding until one
        is wounded or weakened. It will flee after it downs a victim, and will press the attack only if the PCs try to steal its kill.
    - - '4'
      - The SOFT THRALL BEAST YOD-JHAAL (AC 13, HD 3, HP 15, Atk +4, Dmg1d6+2, No Shock, Skill +1, Morale 12, Instinct 4) has squeezed itself into the exoskeletal husk of a dead cave spider and clumsily
        mimics its behavior, saying “chitter chitter” and “I will bite you.” in the Court Riu it learned from an old victim. Its chief concern is acting as it thinks a cave spider should, but most of its
        thoughts are wrong.
    - - '5'
      - The party stumbles across the remains of a fight, two dead pagan raiders slain by their fellows’ bronze spears. They’ve been butchered like meat animals by the hungry apostates.
    - - '6'
      - 1d4+2 GOBELIN WARRIORS (AC 12, HD 1, Atk +1, Dmg 1d6 spear, Shock 2/13, Skill +0, Morale 9, Instinct 3) have ventured down in search of fresh loot or fresh meat.
    - - '7'
      - A cloud of invisible spores chokes and stifles the PCs. Each must make a Physical save or gain 1d2 System Strain and lose their Move action each round for the next 1d4 turns.
    - - '8'
      - The PCs’ intended path leads through an ankle-deep slime of water and fungus. If they pass through it, they need at least a turn to scrub it off their boots or they have a 1in 6 chance of slipping
        and falling prone during each round of combat for the next 6 turns.
  mont.p65.wandering-encounters-on-this-level:
    title: Wandering Encounters on This Level
    die: d8
    page: 65
    rows:
    - - '1'
      - The SOFT THRALL ABOMINATION EIGHT-FIVEVOMAL (AC 15, HD 5, HP 30, Atk +6 x2, Dmg 1d8+2, Shock 4/-, Skill +1, Morale 12, Instinct 5) stalks the halls, and will be audible the round before it arrives.
        It moves at a steady pace of 20’ per move, or 40’ if attacked at range. It paces the corridors and rooms endlessly, seeking intruders to kill. PCs can flee ahead of it and it will not actively pursue,
        but it will attack if any human comes within its reach. It will not be encountered inside any room except for 10, 11 and 13.
    - - '2'
      - A weak plea for help is heard around the corner, where a village girl lies clutching her eviscerated belly. The girl can do nothing but repeat her pleas, as it is actually a Soft Thrall that mantled
        the bones of an abandoned cult sacrifice. It has been re-enacting her last moments for years now and cannot think to do anything else.
    - - '3'
      - A patch of flesh-seeking fungus clings to the ceiling ahead of the PCs. Unless they take special precautions or have encountered it before, the lead PC must make an Evasion save or have it drop
        on them, inflicting 2d6 acid damage and ruining their armor or clothing before they can scrape it off.
    - - '4'
      - A choral bellow of many-throated anguish echoes through the salle. It’s the only sound that Eight-FiveVomal can make.
    - - '5'
      - 1d4+4 GOBELIN WARRIORS (AC 12, HD 1, Atk +1, Dmg 1d6 spear, Shock 2/13, Skill +0, Morale 9, Instinct 3) are venturing below to look for loot.
    - - '6'
      - 1d6+4 BLUE SUN CULTISTS (AC 12, HD 1, Atk +1, Dmg 1d6 spear, Shock 2/13, Skill +0, Morale 10, Instinct 4) have come up from level 4, on their way to seek sacrifices above.
    - - '7'
      - Noxious, spore-laden fumes billow from halfclogged ventilation holes, inflicting 1 System Strain on the party.
    - - '8'
      - 1d8+2 PAGAN RAIDERS (AC 12, HD 1, Atk +1, Dmg 1d6 spear, Shock 2/13, Skill +0, Morale 9, Instinct 3) are on an errand to fetch food for the cultists, a task they sullenly resent.
  mont.p70.wandering-encounters-on-this-level:
    title: Wandering Encounters on This Level
    die: d8
    page: 70
    rows:
    - - '1'
      - The SOFT THRALL ABOMINATION FOUR-NINETEEN-HOKMAL (AC 15, HD 6, HP 50, Atk +7 x2, Dmg 1d10+4, Shock 5/-, Skill +1, Morale 12, Instinct 5) from area 14 approaches. It moves very quietly, requiring
        a Wis/Notice check by the sharpest PC at difficulty 10 to hear it the round before it arrives. Hokmal won’t finish off downed or playing-dead PCs, leaving them for the Charwoman.
    - - '2'
      - The PCs are approached by THE CHARWOMAN (AC 15, HD 5, HP 30, Atk +6 x3, Dmg 1d6+4 acid, Shock 4/-, Skill +1, Morale 10, Instinct 5) from room 1. Her degree of present hunger is determined by her
        Reaction Roll; her willingness to attack is based on that and how well the PCs satisfy her longing for new songs.
    - - '3'
      - The sinister GLASS CRAWLER (AC 18, HD 5, HP 28, Atk +7, Dmg 1d6+Physical save or paralyzed for 1d4+1 rounds, Shock N/A, Skill +3, Morale 8, Instinct 4) from room 18 is stalking the party. It takes
        a Wis/Notice check by the keenest PC at difficulty 10 to spot it on the ceiling. It will follow them for
    review: 5 results uncovered
