  mont.p45.encounters-in-the-swamps-of-the-maresc:
    title: Encounters in the Swamps of the Maresc
    die: d6
    page: 45
    rows:
    - - '1'
      - 1 pagan shaman with 1d6+4 skilled raider henchmen seeks unclean occult knowledge in the swamp.
    - - '2'
      - Cursed quicksand; each PC must make an Evasion save or fall in; Str/Exert difficulty 10 to swim out if not rescued by someone on the shore.
    - - '3'
      - 1d6+1 devil beavers are building a dam
    - - '4'
      - A hermit has taken up residence here; 50% chance he’s a bandit chief hiding from the law.
    - - '5'
      - 1 Fae forest witch is looking for ingredients; she may feign being a village girl.
    - - '6'
      - 1 king panther is out hunting; 50% chance it’s recently fed, otherwise it’s altogether hungry.
  mont.p45.encounters-near-the-terra-perduda:
    title: Encounters near the Terra Perduda
    die: d6
    page: 45
    rows:
    - - '1'
      - 1 Fae knight with a retinue of 2d6 gobelins, 1d6 woses, and 1 ogre
    - - '2'
      - Pagan raiders; 3d6 rabble, 1d6 skilled raiders, 1 shaman, and 1 raid leader
    - - '3'
      - 1 desperate Montfroider seeking a taken family member or escaping pagan captivity.
    - - '4'
      - 2d6 gobelins have set up near 1d4 bloodvines to lure or drive prey into the plants as a trap.
    - - '5'
      - 1 cursed beast prowls the area, tormented by its unnatural existence.
    - - '6'
      - 1d8+2 woses riding fae wolves patrol the borders of the Terra Perduda.
  mont.p45.encounters-on-roads-or-trails:
    title: Encounters on Roads or Trails
    die: d8
    page: 45
    rows:
    - - '1'
      - Signs of fighting or murder; roll again to see who died or who attacked here. They may still be close.
    - - '2'
      - A trade caravan from the nearest village; 2 carts, 1d6+4 carters, and 1d6+2 militia guards.
    - - '3'
      - 1d8+2 bandits lie in wait; they won’t challenge groups that outnumber them.
    - - '4'
      - A militia patrol of 2d4+2 men march along, with a veteran militiaman rider leading them.
    - - '5'
      - A joglar is making their way to the next village; 10% chance they’re in league with bandits.
    - - '6'
      - 3d6 gobelins are accompanied by 1d4 woses or 1 gobelin boss. The can be heard 1,000’ distant.
    - - '7'
      - 2d6+2 pagan rabble are led by 1 skilled raider. They’re stealthy, but won’t chase small prizes.
    - - '8'
      - 1d6+2 pilgrims on their way to the next monastery. 25% chance they’re bandits robbing the unwary.
  mont.p45.encounters-on-plains-or-shallow-forest:
    title: Encounters on Plains or Shallow Forest
    die: d6
    page: 45
    rows:
    - - '1'
      - 1d4+2 lumberjacks or charcoal burners are going about their trade.
    - - '2'
      - A flight of 1d6 gobelin hawks are circling the PCs, seeing if any of them are wounded and good prey.
    - - '3'
      - 3d6 gobelins are skulking, looking for likely prey. They’re quieter than most gobelins.
    - - '4'
      - 1d2+1 hunters from the nearest village are bringing back their prey.
    - - '5'
      - 1 ogre is hungry, and lying in wait to capture the first human unlucky enough to meet him.
    - - '6'
      - 1d8+2 pagan rabble are hunting for easy prey; they’ll avoid strong groups.
  mont.p45.encounters-in-the-deep-forest-or-hills:
    title: Encounters in the Deep Forest or Hills
    die: d6
    page: 45
    rows:
    - - '1'
      - 1 forest bear is hiding amid the branches of a downed spruce tree, waiting for prey.
    - - '2'
      - Loup-garous are out hunting; 1d4 whelps with a 50% chance of either a savage or a tempter too
    - - '3'
      - 1 faerie knight out riding with 2d6 gobelins mounted on fae wolves; their horns warn of their coming.
    - - '4'
      - 2d6 pagan rabble, 1d6 skilled raiders, and 1 raid leader are on their way to their hidden raid camp.
    - - '5'
      - A pack of 2d6 Montfroid wolves are out hunting and have scented the PCs.
    - - '6'
      - A thicket of 1d4 bloodvines lies in the group’s path, appearing to be a raspberry bramble patch.
