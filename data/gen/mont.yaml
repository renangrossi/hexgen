      - Terribly; their talents don’t lie in martial aptitude.
    - - '2'
      - With weapons close to their professional tools
    - - '3'
      - They use a bow or crossbow by choice
    - - '4'
      - They favor simple peasant or militia weapons
    - - '5'
      - They have a sword or other martial implement
    - - '6'
      - They have some large or unusual weapon
